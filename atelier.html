    <label>Angle <span class="val" id="vDegAng">${deg.ang == null ? 90 : deg.ang}°</span></label>
    <input type="range" id="sDegAng" min="-180" max="180" value="${deg.ang == null ? 90 : deg.ang}">`)
    + `<label>Étalement <span class="val" id="vDegPos">${(deg.pos == null ? 1 : deg.pos).toFixed(2)}</span></label>
    <input type="range" id="sDegPos" min="0.05" max="1" step="0.05" value="${deg.pos == null ? 1 : deg.pos}">`
    + A(`Le premier arrêt est <b>la couleur de la forme</b> — donc celle de l'individu
        quand elle est tirée au sort plus bas. Un dégradé à deux couleurs fixes annulerait
        cette variation.`);

  h += `<h2>Contour</h2>
    <label class="puce"><input type="checkbox" id="cCont" ${cont ? 'checked' : ''}> tracer un contour</label>`;
  if (cont) h += `
    <div class="rangee">
      <input type="color" id="cContC" value="${(sh.stroke && sh.stroke[0] === '#') ? sh.stroke : '#1c2733'}">
    </div>
    <label>Épaisseur <span class="val" id="vContW">${(sh.lineWidth || 2).toFixed(1)}</span></label>
    <input type="range" id="sContW" min="0.5" max="20" step="0.5" value="${sh.lineWidth || 2}">`
    + A(`Le même champ sert au <b>trait seul</b> (un tentacule, une antenne : décoche
        « remplissage ») et au <b>liseré</b> d'une forme pleine.`);

  h += `<h2>Matière</h2>
    <label>Opacité <span class="val" id="vAlpha">${(sh.alpha == null ? 1 : sh.alpha).toFixed(2)}</span></label>
    <input type="range" id="sAlpha" min="0.05" max="1" step="0.05" value="${sh.alpha == null ? 1 : sh.alpha}">
    <label>Luminescence <span class="val" id="vLueur">${(sh.lueur ? (sh.lueur === true ? 1 : sh.lueur) : 0).toFixed(2)}</span></label>
    <input type="range" id="sLueur" min="0" max="1" step="0.05" value="${sh.lueur ? (sh.lueur === true ? 1 : sh.lueur) : 0}">`
    + A(`La luminescence pose un <b>halo</b> de la couleur de la forme. Si l'espèce déclare
        <code>glowAtNight</code> — méduse, lanterne, calamar — il ne s'allume que la nuit :
        le bouton 🌙 du bandeau permet de le voir.`);

  h += `<h2>Couleur par individu</h2>
    <select id="selCoul">${modes.map(([k, t]) =>
      `<option value="${k}"${(cl.mode || 'fixe') === k ? ' selected' : ''}>${t}</option>`).join('')}</select>`;
  if (cl.mode === 'palette') {
    const l = cl.couleurs || [];
    h += `<div class="pastilles">` + l.map((c, i) =>
        `<input type="color" data-pal="${i}" value="${c}">`).join('')
      + `<button class="sup" id="bPalPlus">+</button>`
      + (l.length ? `<button class="sup" id="bPalMoins">−</button>` : '') + `</div>`
      + `<div class="rangee"><button id="bPalEspece">Reprendre les couleurs de l'espèce</button></div>`;
  } else if (cl.mode === 'teinte') {
    h += `<label>Amplitude <span class="val" id="vTeinte">${cl.amplitude == null ? 30 : cl.amplitude}°</span></label>
      <input type="range" id="sTeinte" min="0" max="180" value="${cl.amplitude == null ? 30 : cl.amplitude}">`;
  }
  h += A(`Chaque individu garde SA couleur toute sa vie, tirée d'après son identifiant :
      deux frames de suite donnent la même. C'est exactement ce que fait déjà
      <code>Entity.color</code> pour les silhouettes — le bouton <b>6 individus</b> du
      bandeau montre le résultat.`);
  return h;
}

function sectionFormes() {
  return `<div class="formes">` + doc.shapes.map((sh, i) => {
      const n = doc.fins.filter(f => calquesDe(f).includes(i)).length;
      const marques = (sh.degrade ? '▨' : '') + (sh.stroke ? '◌' : '')
                    + (sh.lueur ? '✦' : '') + (sh.couleur && sh.couleur.mode && sh.couleur.mode !== 'fixe' ? '🎲' : '');
      return `<div class="forme ${i === formeSel ? 'sel' : ''}" data-i="${i}">
         <input type="checkbox" data-coche="${i}" ${coches.has(i) ? 'checked' : ''}>
         <span class="pastel" style="background:${sh.fill || sh.stroke || '#888'}"></span>
         <span class="info">forme ${i + 1} · ${sh.points.length} pts${n ? ' · 🖐' + n : ''} ${marques}</span>
         ${sh.groupe ? `<span class="grp">${sh.groupe}</span>` : ''}
       </div>`; }).join('') + `</div>
    <div class="rangee">
      <button id="bMonte" title="Vers le fond">▲</button>
      <button id="bDesc" title="Vers l'avant">▼</button>
      <button id="bSup" title="Supprimer">✕</button>
    </div>
    <div class="rangee">
      <button id="bAplatir">Aplatir les cochées (${coches.size})</button>
      <button id="bDegrouper" ${groupeDe(formeSel).length > 1 ? '' : 'disabled'}>Dégrouper</button>
    </div>`
    + A(`<b>Aplatir</b> ne fond pas les tracés — un corps et sa rayure n'ont pas la même
        couleur. Les formes cochées deviennent un <b>seul bloc</b> : elles se déplacent,
        tournent et s'animent ensemble, et un seul appendice les entraîne toutes.<br>
        L'ordre est l'ordre de dessin : la première forme est au fond.
        <kbd>🖐n</kbd> appendices · <kbd>▨</kbd> dégradé · <kbd>◌</kbd> contour ·
        <kbd>✦</kbd> luminescence · <kbd>🎲</kbd> couleur par individu.`);
}

function sectionTaille() {
  return `<label>Échelle <span class="val" id="vEch">${(doc.spriteScale || 1).toFixed(2)}</span>×</label>
    <input type="range" id="sEch" min="0.3" max="3" step="0.01" value="${doc.spriteScale || 1}">`
    + A(doc.echelle
      ? 'Le document déclare son échelle : ce curseur ne fait que la corriger.'
      : '<b>Dessin sans échelle déclarée.</b> Le jeu suppose alors un poisson allongé (largeur ≈ 2,5 × taille), ce qui est faux sur une créature verticale.')
    + `<div class="rangee">
      <button id="bFantome" class="${fantome ? 'on' : ''}">Silhouette d'origine</button>
      <button id="bNuit" class="${nuit ? 'on' : ''}" title="Voir la luminescence et les couleurs de nuit">🌙 Nuit</button>
    </div>
    <div class="rangee">
      <button id="bAnime" class="${anime ? 'on' : ''}">${anime ? 'Animation en cours' : 'Animer'}</button>
      <button id="bRecadrer">Recadrer</button>
    </div>`
    + A(`La silhouette d'origine se superpose en gris : c'est le repère pour juger d'une
        taille. Le mode nuit force <code>Main.nightAmount()</code> à 1 — c'est la seule
        façon de voir une luminescence dans l'atelier.`);
}

function sectionFond() {
  if (doc.fond) {
    const f = doc.fond;
    return A(f.planche
        ? `planche du design — <code>Assets/Reperes/${f.planche}.png</code> (${f.w}×${f.h})`
        : `image importée, embarquée dans le fichier (${f.w}×${f.h})`)
      + `<label>Opacité <span class="val" id="vOpac">${f.opacite.toFixed(2)}</span></label>
      <input type="range" id="sOpac" min="0" max="1" step="0.05" value="${f.opacite}">
      <label>Échelle <span class="val" id="vFk">${(f.k || 1).toFixed(2)}</span></label>
      <input type="range" id="sFk" min="0.1" max="4" step="0.01" value="${f.k || 1}">
      <div class="rangee">
        <label>x <input type="number" id="nFx" value="${Math.round(f.x || 0)}" step="1"></label>
        <label>y <input type="number" id="nFy" value="${Math.round(f.y || 0)}" step="1"></label>
      </div>
      <div class="rangee">
        <button id="bCaler" title="Même largeur et même centre que le dessin">Caler sur le dessin</button>
        <button id="bMiroirFond" title="Le dessin du jeu regarde toujours vers la droite">↔ Retourner</button>
      </div>
      <div class="rangee">
        <button id="bDessusFond" title="Sous le dessin pour calquer, dessus pour comparer">${f.dessus ? 'Passer dessous' : 'Passer dessus'}</button>
        <button id="bSansFond">Retirer l'image</button>
      </div>`
      + A(f.planche
        ? 'La planche est référencée par son chemin : elle n\'alourdit pas le fichier.'
        : 'Elle est embarquée dans le fichier, qui reste donc autonome — mais elle l\'alourdit : à retirer avant l\'enregistrement final.');
  }
  if (aRepere(espece)) return `<div class="rangee"><button id="bPlanche">Poser la planche du design</button></div>`;
  return A('Cette espèce n\'a pas de dessin dans la planche du design. « Image de repérage… » en charge une du disque.');
}

function sectionEnregistrer(nom) {
  return `<label>Nom du fichier</label>
    <input type="text" id="nomFichier" value="${nom}">`
    + A('Écrit dans <code>Assets/&lt;nom&gt;.json</code> par le serveur de dev.')
    + `<div class="rangee"><button class="plein" id="bEnreg">Enregistrer</button></div>
    <div class="rangee">
      <button id="bActiver">${manifeste[espece] ? 'Réactiver' : 'Activer dans le jeu'}</button>
      <button id="bDesactiver" ${manifeste[espece] ? '' : 'disabled'}>Revenir au procédural</button>
    </div>`
    + A(`« Revenir au procédural » garde le fichier : c'est ce qu'on fait pour les espèces
        dont la silhouette actuelle convient déjà, comme la murène.`);
}

function panneau() {
  const p = $('#panneau');
  if (!espece) { p.innerHTML = '<p class="aide">Choisis une espèce dans la liste.</p>'; return; }
  // Un document rechargé peut avoir moins de formes : une case cochée sur un
  // indice disparu ferait planter « Aplatir ».
  if (doc) for (const i of [...coches]) if (i >= doc.shapes.length) coches.delete(i);
  const def = SPECIES[espece];
  const nom = manifeste[espece] || (doc && doc.nom) || espece;
  const O = OUTILS[outil] || OUTILS.ancres;

  let h = `<h2>${fichierOuvert ? fichierOuvert + '.json' : def.name}</h2>
    <p class="aide">${fichierOuvert
        ? `dessin non rattaché · mis à l'échelle de <b>${def.name}</b>`
        : (def.realName || '')}<br>
    taille de jeu <b>${def.size}</b> · ${doc ? doc.shapes.length + ' forme(s)' : 'silhouette procédurale'}</p>`;

  if (!doc) { p.innerHTML = h; cabler(); return; }

  // Le haut du panneau appartient à l'outil courant, et le dit.
  h += `<div id="titreOutil"><span class="ico">${O.ico}</span>
    <b>${O.nom}<span class="quoi">${O.quoi}</span></b></div>`;
  h += outil === 'ancres' ? sectionAncres()
     : outil === 'visage' ? sectionVisage()
     : outil === 'nageoires' ? sectionAppendices()
     : outil === 'queue' ? sectionQueue()
     : outil === 'forme' ? sectionCalque()
     : outil === 'dessiner' ? sectionDessiner()
     : A(`Tire les carrés pour retoucher le contour de la forme sélectionnée.
          <kbd>clic</kbd> sur le trait pour insérer un point, <kbd>alt</kbd>+clic sur un
          point pour le supprimer.<br><kbd>Ctrl</kbd>+<kbd>Z</kbd> annule, partout.`);

  // Sections communes, repliées par défaut sauf celles dont l'outil se sert.
  const surCalque = outil === 'forme' || outil === 'points' || outil === 'dessiner';
  h += bloc('formes', 'Formes', sectionFormes(),
            surCalque || outil === 'nageoires' || outil === 'queue',
            `${doc.shapes.length} · n°${formeSel + 1}`);
  h += bloc('apparence', 'Apparence de la forme', sectionApparence(), surCalque);
  h += bloc('taille', 'Taille & aperçu', sectionTaille(), false,
            (doc.spriteScale || 1).toFixed(2) + '×');
  h += bloc('fond', 'Calque de repérage', sectionFond(), false,
            doc.fond ? (doc.fond.planche || 'image') : '—');
  h += bloc('enreg', 'Enregistrer', sectionEnregistrer(nom), false,
            manifeste[espece] ? 'actif' : '');

  p.innerHTML = h;
  cabler();
}

function cabler() {
  const on = (sel, ev, fn) => { const e = $(sel); if (e) e.addEventListener(ev, fn); };
  ['#sR', '#sFR', '#sTB', '#sAmp'].forEach(sel => on(sel, 'pointerdown', instantane));
  on('#cFill', 'pointerdown', instantane);
  on('#sR', 'input', e => { doc.points.eye.r = +e.target.value; $('#vR').textContent = (+e.target.value).toFixed(1); marquer(); });
  document.querySelectorAll('.coord input').forEach(inp => {
    inp.addEventListener('focus', instantane);
    inp.addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      if (!isFinite(v)) return;
      doc.points[e.target.dataset.anc][e.target.dataset.axe] = v;
      marquer();
    });
  });
  on('#sEcart', 'pointerdown', instantane);
  on('#sEcart', 'input', e => {
    doc.points.eye.ecart = +e.target.value;
    $('#vEcart').textContent = (+e.target.value).toFixed(1);
    marquer();
  });
  on('#bLibererOeil', 'click', () => {
    instantane();
    const o = doc.points.eye;
    doc.points.eye2 = { x: o.x - o.ecart, y: o.y, r: o.r };
    delete o.ecart;
    marquer(); panneau();
  });
  on('#bDeuxYeux', 'click', () => {
    instantane();
    const o = doc.points.eye;
    if (doc.points.eye2 || o.ecart != null) { delete doc.points.eye2; delete o.ecart; }
    else o.ecart = Math.round((o.r || 10) * 2.6 * 10) / 10;
    marquer(); panneau();
  });
  on('#sBR', 'pointerdown', instantane);
  on('#sBR', 'input', e => {
    doc.points.mouth.r = +e.target.value;
    $('#vBR').textContent = (+e.target.value).toFixed(1);
    marquer();
  });
  // Au relâchement seulement : reconstruire le panneau pendant le glissé
  // arracherait le curseur sous le doigt. C'est là que la mention « suit l'œil »
  // devient fausse et doit disparaître.
  on('#sBR', 'change', () => panneau());
  on('#bAutoOeil', 'click', () => {
    instantane();
    doc.points.eye.r = SVGImport.rayonOeil(doc.shapes, doc.points.eye, doc.naturalW);
    marquer(); panneau();
  });
  on('#selFin', 'change', e => { finSel = +e.target.value; panneau(); dessiner(); });
  ['#sFA', '#sFO', '#sFAm', '#sFPh', '#sFV', '#sTO'].forEach(sel => on(sel, 'pointerdown', instantane));
  on('#sFR', 'input', e => { doc.fins[finSel].r = +e.target.value; $('#vFR').textContent = e.target.value; marquer(); });
  on('#sFA', 'input', e => { doc.fins[finSel].ang = +e.target.value; $('#vFA').textContent = e.target.value + '°'; marquer(); });
  on('#sFO', 'input', e => { doc.fins[finSel].ondes = +e.target.value; $('#vFO').textContent = (+e.target.value).toFixed(2); marquer(); });
  on('#sFAm', 'input', e => { doc.fins[finSel].amp = +e.target.value; $('#vFAm').textContent = e.target.value; marquer(); });
  on('#sFPh', 'input', e => { doc.fins[finSel].phase = +e.target.value; $('#vFPh').textContent = e.target.value + '°'; marquer(); });
  on('#sFV', 'input', e => { doc.fins[finSel].vitesse = +e.target.value; $('#vFV').textContent = (+e.target.value).toFixed(2); marquer(); });
  document.querySelectorAll('[data-typeapp]').forEach(b => b.addEventListener('click', () => {
    instantane();
    const f = doc.fins[finSel];
    f.type = b.dataset.typeapp;
    // Les deux réglages ne sont pas dans la même unité (degrés de rotation d'un
    // côté, pourcentage de longueur de l'autre) : garder l'ancienne valeur
    // donnait une patte qui décollait du corps au changement de type.
    f.amp = f.type === 'tentacule' ? 25 : 20;
    if (f.type === 'tentacule' && f.ang == null) f.ang = 180;
    marquer(); panneau();
  }));
  document.querySelectorAll('[data-cal]').forEach(c => c.addEventListener('change', () => {
    instantane();
    const f = doc.fins[finSel];
    const l = new Set(calquesDe(f));
    const i = +c.dataset.cal;
    c.checked ? l.add(i) : l.delete(i);
    f.calques = [...l].sort((a, b) => a - b);
    delete f.layerIndex;
    marquer(); panneau();
  }));
  on('#bFinGroupe', 'click', () => {
    instantane();
    const f = doc.fins[finSel];
    f.calques = groupeDe(formeSel);
    delete f.layerIndex;
    marquer(); panneau();
  });
  on('#bMiroirFin', 'click', () => {
    instantane();
    const f = doc.fins[finSel];
    f.miroir = !f.miroir;
    marquer(); panneau();
  });
  on('#bSupFin', 'click', () => { instantane(); doc.fins.splice(finSel, 1); finSel = 0; marquer(); panneau(); });
  on('#bSansQueue', 'click', () => {
    instantane();
    // `tailBlend` est CONSERVÉ : décocher rend la queue telle qu'elle était
    // réglée, sans avoir à la repositionner.
    if (doc.sansQueue) delete doc.sansQueue; else doc.sansQueue = true;
    marquer(); panneau();
  });
  on('#sTO', 'input', e => { doc.tailOndes = +e.target.value; $('#vTO').textContent = (+e.target.value).toFixed(2); marquer(); });
  on('#bQTout', 'click', () => { instantane(); delete doc.queueCalques; marquer(); panneau(); });
  on('#bQChoisir', 'click', () => {
    instantane();
    doc.queueCalques = doc.shapes.map((_, i) => i);
    marquer(); panneau();
  });
  document.querySelectorAll('[data-qcal]').forEach(c => c.addEventListener('change', () => {
    instantane();
    const l = new Set(doc.queueCalques || []);
    const i = +c.dataset.qcal;
    c.checked ? l.add(i) : l.delete(i);
    doc.queueCalques = [...l].sort((a, b) => a - b);
    marquer(); panneau();
  }));
  document.querySelectorAll('[data-gab]').forEach(b => b.addEventListener('click', () => { gabarit(b.dataset.gab); }));
  on('#bAplatir', 'click', aplatir);
  on('#bDegrouper', 'click', degrouper);
  document.querySelectorAll('[data-coche]').forEach(c => c.addEventListener('click', ev => {
    ev.stopPropagation();
    const i = +c.dataset.coche;
    c.checked ? coches.add(i) : coches.delete(i);
    panneau();
  }));
  on('#sTB', 'input', e => { doc.tailBlend = +e.target.value; $('#vTB').textContent = e.target.value; marquer(); });
  on('#sAmp', 'input', e => { doc.shapes[formeSel].amp = +e.target.value; $('#vAmp').textContent = e.target.value; marquer(); });
  on('#sAmp', 'pointerdown', instantane);
  on('#cFill', 'input', e => { if (doc.shapes[formeSel]) { doc.shapes[formeSel].fill = e.target.value; marquer(); panneau(); } });
  on('#bPlusPetit', 'click', () => echelleForme(0.95));
  on('#bPlusGrand', 'click', () => echelleForme(1 / 0.95));
  on('#bTourneG', 'click', () => tournerForme(-3));
  on('#bTourneD', 'click', () => tournerForme(3));
  on('#bMiroirX', 'click', () => miroirForme('x'));
  on('#bMiroirY', 'click', () => miroirForme('y'));
  on('#bDupliquer', 'click', dupliquerForme);
  on('#bMonte', 'click', () => bouger(-1));
  on('#bDesc', 'click', () => bouger(1));
  on('#bSup', 'click', () => {
    if (doc.shapes.length < 2) return dire('il faut au moins une forme', 'ko');
    instantane();
    doc.shapes.splice(formeSel, 1);
    decalerCalques(j => (j === formeSel ? null : (j > formeSel ? j - 1 : j)));
    doc.fins = doc.fins.filter(f => calquesDe(f).length);
    coches.clear();
    formeSel = Math.max(0, formeSel - 1); marquer(); panneau();
  });
  document.querySelectorAll('.forme').forEach(el =>
    el.addEventListener('click', () => { formeSel = +el.dataset.i; panneau(); dessiner(); }));
  on('#bEnreg', 'click', enregistrer);
  on('#bActiver', 'click', () => activer($('#nomFichier').value.trim()));
  on('#bDesactiver', 'click', () => activer(null));
  on('#sEch', 'pointerdown', instantane);
  on('#sEch', 'input', e => {
    doc.spriteScale = +e.target.value;
    $('#vEch').textContent = (+e.target.value).toFixed(2);
    marquer();
  });
  on('#bFantome', 'click', () => { fantome = !fantome; panneau(); dessiner(); });
  on('#cTrace', 'input', e => { couleurTrace = e.target.value; dessiner(); });
  on('#cLisse', 'change', e => { lisseTrace = e.target.checked; });
  on('#bFermer', 'click', fermerTrace);
  on('#bAnnulerTrace', 'click', () => { trace = null; panneau(); dessiner(); });
  on('#cSmooth', 'change', e => {
    instantane();
    doc.shapes[formeSel].smooth = e.target.checked;
    marquer();
  });
  on('#sOpac', 'input', e => { doc.fond.opacite = +e.target.value; $('#vOpac').textContent = (+e.target.value).toFixed(2); dessiner(); });
  on('#sFk', 'input', e => { doc.fond.k = +e.target.value; $('#vFk').textContent = (+e.target.value).toFixed(2); dessiner(); });
  on('#nFx', 'input', e => { doc.fond.x = +e.target.value || 0; dessiner(); });
  on('#nFy', 'input', e => { doc.fond.y = +e.target.value || 0; dessiner(); });
  on('#bCaler', 'click', () => { instantane(); ajusterFond(); marquer(); panneau(); dessiner(); });
  on('#bMiroirFond', 'click', () => { instantane(); doc.fond.miroir = !doc.fond.miroir; marquer(); dessiner(); });
  on('#bDessusFond', 'click', () => { doc.fond.dessus = !doc.fond.dessus; panneau(); dessiner(); });
  on('#bPlanche', 'click', () => { instantane(); poserRepere(espece); marquer(); panneau(); dessiner(); });
  on('#bSansFond', 'click', () => { instantane(); delete doc.fond; reprendreFond(); marquer(); panneau(); });
  on('#bAnime', 'click', () => { anime = !anime; panneau(); });
  on('#bRecadrer', 'click', cadrer);

  // --- Sections repliables ---------------------------------------------------
  // L'état est retenu hors du DOM : le panneau est reconstruit à chaque geste,
  // une section ouverte se refermerait sinon au premier mouvement de curseur.
  document.querySelectorAll('details.bloc').forEach(d => d.addEventListener('toggle', () => {
    ouverts[d.dataset.bloc] = d.open;
    localStorage.setItem('atelier.blocs', JSON.stringify(ouverts));
  }));

  // --- Visage ----------------------------------------------------------------
  on('#selBouche', 'change', e => {
    instantane();
    if (e.target.value === 'standard') delete doc.boucheStyle;
    else doc.boucheStyle = e.target.value;
    marquer(); panneau();
  });
  document.querySelectorAll('[data-vis]').forEach(inp => {
    inp.addEventListener('pointerdown', instantane);
    inp.addEventListener('input', () => {
      doc.visage = doc.visage || {};
      doc.visage[inp.dataset.vis] = inp.value;
      marquer();
    });
    // La mention « défaut » et le bouton ↺ ne changent qu'au relâchement :
    // reconstruire le panneau pendant le glissé arracherait le sélecteur.
    inp.addEventListener('change', () => panneau());
  });
  document.querySelectorAll('[data-visraz]').forEach(b => b.addEventListener('click', () => {
    instantane();
    if (doc.visage) delete doc.visage[b.dataset.visraz];
    if (doc.visage && !Object.keys(doc.visage).length) delete doc.visage;
    marquer(); panneau();
  }));
  on('#bVisRaz', 'click', () => { instantane(); delete doc.visage; marquer(); panneau(); });

  // --- Apparence d'un calque -------------------------------------------------
  const sh = () => doc.shapes[formeSel];
  on('#bSansFill', 'click', () => {
    instantane();
    const f = sh(); if (!f) return;
    // Trait seul : c'est ainsi que se dessinent un tentacule, une antenne, une
    // moustache. Il lui faut alors forcément un contour, sinon la forme
    // disparaît purement et simplement.
    if (f.fill === null) f.fill = f._fillAvant || '#888888';
    else { f._fillAvant = f.fill; f.fill = null; if (!f.stroke) { f.stroke = '#1c2733'; f.lineWidth = f.lineWidth || 3; } }
    marquer(); panneau();
  });
  on('#cOuvert', 'change', e => {
    instantane();
    const f = sh(); if (!f) return;
    // Un contour ouvert n'a de sens qu'avec un trait : sans lui il n'y a plus
    // qu'un remplissage bâclé, refermé n'importe comment par le moteur.
    if (e.target.checked) { f.ferme = false; f.stroke = f.stroke || f.fill || '#1c2733'; f.lineWidth = f.lineWidth || 3; }
    else delete f.ferme;
    marquer(); panneau();
  });
  on('#cDeg', 'change', e => {
    instantane();
    const f = sh(); if (!f) return;
    if (e.target.checked) f.degrade = { type: 'lineaire', ang: 90, pos: 1 };
    else delete f.degrade;
    marquer(); panneau();
  });
  document.querySelectorAll('[data-degtype]').forEach(b => b.addEventListener('click', () => {
    instantane(); sh().degrade.type = b.dataset.degtype; marquer(); panneau();
  }));
  on('#cDegVers', 'pointerdown', instantane);
  on('#cDegVers', 'input', e => { sh().degrade.vers = e.target.value; marquer(); });
  on('#cDegVers', 'change', () => panneau());
  on('#bDegAuto', 'click', () => { instantane(); delete sh().degrade.vers; marquer(); panneau(); });
  on('#sDegAng', 'pointerdown', instantane);
  on('#sDegAng', 'input', e => {
    sh().degrade.ang = +e.target.value; $('#vDegAng').textContent = e.target.value + '°'; marquer();
  });
  on('#sDegPos', 'pointerdown', instantane);
  on('#sDegPos', 'input', e => {
    sh().degrade.pos = +e.target.value; $('#vDegPos').textContent = (+e.target.value).toFixed(2); marquer();
  });
  on('#cCont', 'change', e => {
    instantane();
    const f = sh(); if (!f) return;
    if (e.target.checked) { f.stroke = f.stroke || '#1c2733'; f.lineWidth = f.lineWidth || 2; }
    else if (f.fill === null) return dire('une forme sans remplissage a besoin de son contour', 'ko');
    else delete f.stroke;
    marquer(); panneau();
  });
  on('#cContC', 'pointerdown', instantane);
  on('#cContC', 'input', e => { sh().stroke = e.target.value; marquer(); });
  on('#sContW', 'pointerdown', instantane);
  on('#sContW', 'input', e => {
    sh().lineWidth = +e.target.value; $('#vContW').textContent = (+e.target.value).toFixed(1); marquer();
  });
  on('#sAlpha', 'pointerdown', instantane);
  on('#sAlpha', 'input', e => {
    const v = +e.target.value;
    if (v >= 0.999) delete sh().alpha; else sh().alpha = v;
    $('#vAlpha').textContent = v.toFixed(2); marquer();
  });
  on('#sLueur', 'pointerdown', instantane);
  on('#sLueur', 'input', e => {
    const v = +e.target.value;
    if (v <= 0.001) delete sh().lueur; else sh().lueur = v;
    $('#vLueur').textContent = v.toFixed(2); marquer();
  });

  // --- Couleur tirée au sort par individu ------------------------------------
  on('#selCoul', 'change', e => {
    instantane();
    const f = sh(); if (!f) return;
    const m = e.target.value;
    if (m === 'fixe') delete f.couleur;
    else if (m === 'palette') f.couleur = { mode: m, couleurs: (f.couleur && f.couleur.couleurs) || [f.fill || '#888888'] };
    else if (m === 'teinte') f.couleur = { mode: m, amplitude: (f.couleur && f.couleur.amplitude) || 30 };
    else f.couleur = { mode: m };
    marquer(); panneau();
  });
  document.querySelectorAll('[data-pal]').forEach(inp => {
    inp.addEventListener('pointerdown', instantane);
    inp.addEventListener('input', () => { sh().couleur.couleurs[+inp.dataset.pal] = inp.value; marquer(); });
  });
  on('#bPalPlus', 'click', () => {
    instantane();
    const c = sh().couleur;
    c.couleurs = (c.couleurs || []).concat([sh().fill || '#888888']);
    marquer(); panneau();
  });
  on('#bPalMoins', 'click', () => {
    instantane(); sh().couleur.couleurs.pop(); marquer(); panneau();
  });
  // Le raccourci qui compte : les couleurs de l'espèce sont DÉJÀ celles que la
  // silhouette procédurale tire au sort. Les recopier à la main, c'est se
  // tromper d'une nuance et voir le banc dessiné jurer avec le reste.
  on('#bPalEspece', 'click', () => {
    instantane();
    sh().couleur.couleurs = (defEspece().colors || []).slice();
    marquer(); panneau();
    dire(`${sh().couleur.couleurs.length} couleurs reprises de ${defEspece().name}`, 'ok');
  });
  on('#sTeinte', 'pointerdown', instantane);
  on('#sTeinte', 'input', e => {
    sh().couleur.amplitude = +e.target.value;
    $('#vTeinte').textContent = e.target.value + '°'; marquer();
  });

  // Sans ce bouton, une luminescence ne se voit jamais dans l'atelier : le
  // faux `Main` de la page renvoie toujours « plein jour ».
  on('#bNuit', 'click', () => {
    nuit = !nuit;
    Main.nightAmount = () => (nuit ? 1 : 0);
    panneau(); dessiner();
  });
}

// --- Transformations d'une forme entière ------------------------------------
// Tirer les points un par un ne permet pas de RE-PLACER une nageoire ou de
// redresser une pièce importée de travers. Tout passe donc par une seule
// fonction : on applique la transformation aux points, et — c'est le détail qui
// évite le piège — aux ancrages de nageoire qui visent cette forme, sinon le
// disque d'influence reste derrière et la nageoire se déforme autour du vide.
function transformer(fn) {
  const lot = groupeDe(formeSel);
  if (!lot.length || !doc.shapes[formeSel]) return;
  const vus = new Set(lot);
  for (const j of lot) doc.shapes[j].points = doc.shapes[j].points.map(fn);
  // Les ancrages qui visent un des calques déplacés suivent, sinon le disque
  // d'influence reste derrière et la nageoire se déforme autour du vide.
  for (const f of doc.fins) {
    if (!calquesDe(f).some(j => vus.has(j))) continue;
    const [x, y] = fn([f.x, f.y]);
    f.x = x; f.y = y;
  }
  marquer();
}

// Centre de la boîte du GROUPE : repère des mises à l'échelle et rotations.
// Prendre le centre du seul calque actif ferait tourner les pièces d'une même
// patte autour de trois centres différents — elle se désarticulerait.
function centreForme() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const j of groupeDe(formeSel)) for (const p of doc.shapes[j].points) {
    if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
    if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
  }
  return [(x0 + x1) / 2, (y0 + y1) / 2];
}

function echelleForme(k) {
  const [cx, cy] = centreForme();
  instantane();
  transformer(p => [cx + (p[0] - cx) * k, cy + (p[1] - cy) * k]);
}
function tournerForme(deg) {
  const [cx, cy] = centreForme();
  const a = deg * Math.PI / 180, co = Math.cos(a), si = Math.sin(a);
  instantane();
  transformer(p => {
    const dx = p[0] - cx, dy = p[1] - cy;
    return [cx + dx * co - dy * si, cy + dx * si + dy * co];
  });
}
function miroirForme(axe) {
  const [cx, cy] = centreForme();
  instantane();
  transformer(p => (axe === 'x' ? [2 * cx - p[0], p[1]] : [p[0], 2 * cy - p[1]]));
}
function dupliquerForme() {
  instantane();
  const sh = JSON.parse(JSON.stringify(doc.shapes[formeSel]));
  sh.points = sh.points.map(p => [p[0] + doc.naturalW * 0.04, p[1] + doc.naturalH * 0.04]);
  // La copie sort du groupe : dupliquer une nageoire, c'est en faire une AUTRE.
  delete sh.groupe;
  doc.shapes.splice(formeSel + 1, 0, sh);
  // Les appendices visant une forme au-delà du point d'insertion se décalent.
  decalerCalques(j => (j > formeSel ? j + 1 : j));
  formeSel++;
  marquer(); panneau();
}

// Toute renumérotation des calques doit être répercutée sur ce qui les VISE :
// les appendices et la liste des calques qui ondulent. C'était fait à la main,
// à trois endroits, sur le seul `layerIndex` — et rien ne suivait `calques`.
function decalerCalques(map) {
  const conv = (l) => l.map(map).filter(j => j != null);
  for (const f of doc.fins) {
    f.calques = conv(calquesDe(f));
    delete f.layerIndex;
  }
  if (doc.queueCalques) {
    doc.queueCalques = conv(doc.queueCalques);
    if (!doc.queueCalques.length) delete doc.queueCalques;
  }
}

function bouger(d) {
  const j = formeSel + d;
  if (j < 0 || j >= doc.shapes.length) return;
  instantane();
  const t = doc.shapes[formeSel]; doc.shapes[formeSel] = doc.shapes[j]; doc.shapes[j] = t;
  decalerCalques(k => (k === formeSel ? j : (k === j ? formeSel : k)));
  formeSel = j; marquer(); panneau();
}

// « Aplatir » : les calques cochés deviennent un seul bloc animé.
function aplatir() {
  const lot = [...coches].sort((a, b) => a - b);
  if (lot.length < 2) return dire('coche au moins deux formes dans la liste', 'ko');
  instantane();
  const nom = nomGroupeLibre();
  for (const i of lot) doc.shapes[i].groupe = nom;
  formeSel = lot[0]; coches.clear();
  marquer(); panneau();
  dire(`${lot.length} formes aplaties dans « ${nom} » : elles se déplacent et s'animent ensemble`, 'ok');
}
function degrouper() {
  const lot = groupeDe(formeSel);
  if (lot.length < 2) return dire('cette forme n\'est dans aucun groupe');
  instantane();
  for (const i of lot) delete doc.shapes[i].groupe;
  marquer(); panneau();
  dire('groupe défait');
}

function marquer() { if (espece && doc) brouillons[espece] = doc; dessiner(); rail(); }

// Le tracé devient une forme, posée AU-DESSUS de la pile : on dessine
// généralement du corps vers les détails.
function fermerTrace() {
  if (!trace || trace.length < 3) return dire('il faut au moins trois sommets', 'ko');
  instantane();
  doc.shapes.push({ points: trace, fill: couleurTrace, smooth: lisseTrace,
                    pivot: null, amp: 15, ferme: true });
  formeSel = doc.shapes.length - 1;
  trace = null;
  marquer(); panneau();
  dire(`forme ${doc.shapes.length} créée`, 'ok');
}

// --- Annulation -------------------------------------------------------------
// Instantanés du document entier. C'est brutal mais un document fait quelques
// dizaines de kilo-octets, et un éditeur sans Ctrl+Z n'est pas un éditeur : on
// n'ose plus rien essayer.
// `instantane()` s'appelle AVANT la modification, et une seule fois par geste —
// pas à chaque `pointermove`, sinon un simple glissé remplit la pile.
const histoire = [], futur = [];
// La SÉLECTION fait partie de l'instantané. Sans elle, annuler une duplication
// laissait la forme active sur un indice qui n'existe plus au même endroit : on
// croyait tirer une nageoire et on en déplaçait une autre.
function instantane() {
  if (!doc) return;
  histoire.push(JSON.stringify({ doc, formeSel, finSel }));
  if (histoire.length > 40) histoire.shift();
  futur.length = 0;
}
function annuler(pile, autre) {
  if (!doc || !pile.length) return dire('rien à ' + (pile === histoire ? 'annuler' : 'rétablir'));
  autre.push(JSON.stringify({ doc, formeSel, finSel }));
  const e = JSON.parse(pile.pop());
  doc = e.doc;
  formeSel = Math.min(e.formeSel, doc.shapes.length - 1);
  finSel = Math.min(e.finSel, Math.max(0, doc.fins.length - 1));
  marquer(); panneau();
  dire(pile === histoire ? 'annulé' : 'rétabli');
}
addEventListener('keydown', ev => {
  if (!(ev.ctrlKey || ev.metaKey)) return;
  const k = ev.key.toLowerCase();
  if (k === 'z' && !ev.shiftKey) { ev.preventDefault(); annuler(histoire, futur); }
  else if (k === 'y' || (k === 'z' && ev.shiftKey)) { ev.preventDefault(); annuler(futur, histoire); }
});

// ---------------------------------------------------------------------------
// Souris
// ---------------------------------------------------------------------------
function pres(sx, sy) {
  if (!doc) return null;
  const seuil = 11;
  // L'outil Visage règle les mêmes deux ancres que l'outil Ancres : il doit
  // pouvoir les tirer, sinon la taille de l'œil se règle au curseur à l'aveugle
  // alors que la poignée est là, sous le pointeur.
  if (outil === 'ancres' || outil === 'visage') {
    for (const cle of ['eye', 'eye2', 'mouth']) {
      const a = doc.points[cle];
      if (!a) continue;
      const r = cle === 'mouth' ? tailleBouche() : a.r;
      if (!r) continue;
      const [x, y] = versEcran([a.x, a.y]);
      if (Math.hypot(sx - (x + r * vueT.k), sy - y) < seuil) return { type: 'rayonOeil', cle };
    }
    if (outil === 'visage') {
      for (const cle of ['eye', 'eye2', 'mouth']) {
        const p2 = doc.points[cle]; if (!p2) continue;
        const [x, y] = versEcran([p2.x, p2.y]);
        if (Math.hypot(sx - x, sy - y) < seuil) return { type: 'ancre', cle };
      }
      return null;
    }
    // La croix la PLUS PROCHE, pas la première trouvée : sur une petite tête,
    // center, nose, eye et mouth tiennent dans quarante pixels, et la première
    // de la liste raflait tous les clics.
    let best = null, bestD = seuil;
    for (const cle of ancres()) {
      const p = doc.points[cle];
      const [x, y] = versEcran([p.x, p.y]);
      const d = Math.hypot(sx - x, sy - y);
      if (d < bestD) { bestD = d; best = { type: 'ancre', cle }; }
    }
    if (best) return best;
  }
  if (outil === 'nageoires') {
    // La POINTE d'un tentacule d'abord : elle règle direction et longueur d'un
    // seul geste, et elle est testée avant la base parce qu'un tentacule court
    // met les deux poignées à portée l'une de l'autre.
    for (let i = 0; i < doc.fins.length; i++) {
      const f = doc.fins[i];
      if (TYPE(f) !== 'tentacule') continue;
      const a0 = (f.ang != null ? f.ang : 180) * Math.PI / 180;
      const [x, y] = versEcran([f.x + Math.cos(a0) * (f.r || 60), f.y + Math.sin(a0) * (f.r || 60)]);
      if (Math.hypot(sx - x, sy - y) < seuil) return { type: 'boutApp', i };
    }
    for (let i = 0; i < doc.fins.length; i++) {
      const [x, y] = versEcran([doc.fins[i].x, doc.fins[i].y]);
      if (Math.hypot(sx - x, sy - y) < seuil) return { type: 'fin', i };
    }
  }
  if (outil === 'queue') {
    const [x] = versEcran([doc.tailBlend, 0]);
    if (Math.abs(sx - x) < seuil) return { type: 'queue' };
  }
  if (outil === 'points' && doc.shapes[formeSel]) {
    const pts = doc.shapes[formeSel].points;
    for (let i = 0; i < pts.length; i++) {
      const [x, y] = versEcran(pts[i]);
      if (Math.hypot(sx - x, sy - y) < seuil) return { type: 'point', i };
    }
  }
  if (outil === 'forme') {
    const [wx, wy] = versDoc(sx, sy);
    // Le calque ACTIF d'abord : sinon un calque posé par-dessus lui volerait le
    // clic dès qu'on veut déplacer celui qu'on vient de sélectionner.
    if (doc.shapes[formeSel] && dansForme(doc.shapes[formeSel].points, wx, wy))
      return { type: 'forme', i: formeSel, wx, wy };
    for (let i = doc.shapes.length - 1; i >= 0; i--)
      if (dansForme(doc.shapes[i].points, wx, wy)) return { type: 'forme', i, wx, wy };
  }
  return null;
}

// Le point est-il dans le polygone ? (lancer de rayon, pair/impair)
function dansForme(pts, x, y) {
  let dedans = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) dedans = !dedans;
  }
  return dedans;
}

// Point du contour le plus proche du curseur, s'il est à portée : renvoie
// l'indice du segment et la projection, pour y insérer un point.
function segmentPres(sx, sy) {
  const pts = doc.shapes[formeSel].points, n = pts.length;
  let best = null, bestD = 10;                 // 10 px écran
  for (let i = 0; i < n; i++) {
    const [ax, ay] = versEcran(pts[i]), [bx, by] = versEcran(pts[(i + 1) % n]);
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    if (!l2) continue;
    const t = U.clamp(((sx - ax) * dx + (sy - ay) * dy) / l2, 0, 1);
    const px = ax + dx * t, py = ay + dy * t;
    const d = Math.hypot(sx - px, sy - py);
    if (d < bestD) { bestD = d; best = { i, p: versDoc(px, py) }; }
  }
  return best;
}

vue.addEventListener('pointerdown', ev => {
  if (!doc) return;
  const r = vue.getBoundingClientRect();
  const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
  const cible = pres(sx, sy);

  if (cible && cible.type === 'point' && ev.altKey) {
    const pts = doc.shapes[formeSel].points;
    if (pts.length > 3) { instantane(); pts.splice(cible.i, 1); marquer(); }
    return;
  }
  if (cible) {
    instantane();
    attrape = cible; vue.setPointerCapture(ev.pointerId);
    if (cible.type === 'fin' || cible.type === 'boutApp') { finSel = cible.i; panneau(); }
    // Cliquer un calque le SÉLECTIONNE : c'était le seul moyen manquant pour
    // reprendre un dessin existant — il fallait deviner son rang dans la liste.
    if (cible.type === 'forme' && cible.i !== formeSel) { formeSel = cible.i; panneau(); }
    return;
  }

  // Rien sous le curseur : en mode nageoires, on en pose une.
  if (outil === 'nageoires') {
    instantane();
    const [x, y] = versDoc(sx, sy);
    // Rayon déduit de la forme visée (diagonale de sa boîte × 0,75), comme dans
    // l'outil d'ancrages : une valeur fixe est presque toujours à refaire.
    const pts = doc.shapes[formeSel] ? doc.shapes[formeSel].points : null;
    let r = Math.round(doc.naturalW * 0.35);
    if (pts && pts.length) {
      let a = Infinity, b = Infinity, c = -Infinity, e2 = -Infinity;
      for (const q of pts) { a = Math.min(a, q[0]); b = Math.min(b, q[1]); c = Math.max(c, q[0]); e2 = Math.max(e2, q[1]); }
      r = Math.max(10, Math.round(Math.hypot(c - a, e2 - b) * 0.75));
    }
    // Le nouvel appendice entraîne TOUT LE GROUPE du calque actif : si l'artiste
    // a pris la peine d'aplatir une patte en trois pièces, il ne veut pas poser
    // trois ancrages identiques.
    doc.fins.push({ x, y, r, type: 'nageoire', amp: 20, phase: 0, vitesse: 1,
                    calques: groupeDe(formeSel) });
    finSel = doc.fins.length - 1;
    marquer(); panneau();
    return;
  }

  // Mode Dessiner : chaque clic pose un sommet. Un clic sur le PREMIER sommet
  // referme la forme, comme dans tout outil de tracé.
  if (outil === 'dessiner') {
    const [x, y] = versDoc(sx, sy);
    if (trace && trace.length > 2) {
      const [px, py] = versEcran(trace[0]);
      if (Math.hypot(sx - px, sy - py) < 10) { fermerTrace(); return; }
    }
    if (!trace) trace = [];
    trace.push([x, y]);
    panneau(); dessiner();
    return;
  }

  // En mode points, un clic SUR LE CONTOUR insère un point. Sans ça on ne peut
  // que déplacer ou supprimer, et un contour importé trop pauvre à un endroit
  // reste irrécupérable.
  if (outil === 'points' && doc.shapes[formeSel]) {
    const seg = segmentPres(sx, sy);
    if (seg) {
      instantane();
      doc.shapes[formeSel].points.splice(seg.i + 1, 0, seg.p);
      attrape = { type: 'point', i: seg.i + 1 };
      vue.setPointerCapture(ev.pointerId);
      marquer(); panneau();
      return;
    }
    // Ni point ni contour sous le curseur : un clic dans un AUTRE calque le
    // sélectionne, pour retoucher un dessin existant sans passer par la liste.
    const [wx, wy] = versDoc(sx, sy);
    for (let i = doc.shapes.length - 1; i >= 0; i--) {
      if (i !== formeSel && dansForme(doc.shapes[i].points, wx, wy)) {
        formeSel = i; panneau(); dessiner(); return;
      }
    }
  }
  attrape = { type: 'vue', sx, sy, ox: vueT.x, oy: vueT.y };
  vue.setPointerCapture(ev.pointerId);
});

let souris = null;          // position courante, pour l'élastique du tracé
vue.addEventListener('pointermove', ev => {
  if (outil === 'dessiner' && trace) {
    const rr = vue.getBoundingClientRect();
    souris = versDoc(ev.clientX - rr.left, ev.clientY - rr.top);
    dessiner();
  }
  if (!attrape) return;
  const r = vue.getBoundingClientRect();
  const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
  const [x, y] = versDoc(sx, sy);
  const a = attrape;
  if (a.type === 'ancre') { doc.points[a.cle].x = x; doc.points[a.cle].y = y; }
  else if (a.type === 'rayonOeil') {
    const oe = doc.points[a.cle];
    oe.r = Math.max(1, x - oe.x);
  }
  else if (a.type === 'fin') { doc.fins[a.i].x = x; doc.fins[a.i].y = y; }
  else if (a.type === 'boutApp') {
    const f = doc.fins[a.i], dx = x - f.x, dy = y - f.y;
    f.r = Math.max(10, Math.round(Math.hypot(dx, dy)));
    f.ang = Math.round(Math.atan2(dy, dx) * 180 / Math.PI);
  }
  else if (a.type === 'queue') doc.tailBlend = x;
  else if (a.type === 'point') doc.shapes[formeSel].points[a.i] = [x, y];
  else if (a.type === 'forme') {
    const dx = x - a.wx, dy = y - a.wy;
    a.wx = x; a.wy = y;
    transformer(p => [p[0] + dx, p[1] + dy]);
    return;                       // `transformer` a déjà appelé `marquer`
  }
  else if (a.type === 'vue') { vueT.x = a.ox + (sx - a.sx); vueT.y = a.oy + (sy - a.sy); dessiner(); return; }
  marquer();
});

vue.addEventListener('pointerup', () => {
  if (attrape && attrape.type !== 'vue') panneau();
  attrape = null;
});

vue.addEventListener('dblclick', () => { if (outil === 'dessiner') fermerTrace(); });

addEventListener('keydown', ev => {
  if (outil !== 'dessiner' || !trace) return;
  if (ev.key === 'Escape') { trace = null; panneau(); dessiner(); }
  else if (ev.key === 'Backspace') { ev.preventDefault(); trace.pop(); panneau(); dessiner(); }
  else if (ev.key === 'Enter') fermerTrace();
});

vue.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = vue.getBoundingClientRect();
  const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
  const [wx, wy] = versDoc(sx, sy);
  vueT.k *= ev.deltaY > 0 ? 0.9 : 1.11;
  vueT.x = sx - wx * vueT.k; vueT.y = sy - wy * vueT.k;
  dessiner();
}, { passive: false });

// ---------------------------------------------------------------------------
// Import
// ---------------------------------------------------------------------------
$('#btnNeuf').onclick = () => {
  if (!espece) return dire('choisis d\'abord une espèce', 'ko');
  debrancher();
  doc = SVGImport.vide(espece);
  doc.espece = espece; doc.nom = espece;
  formeSel = 0; finSel = 0; trace = null; imgFond = null;
  outil = 'dessiner';
  document.querySelectorAll('#barre button[data-outil]').forEach(b =>
    b.classList.toggle('on', b.dataset.outil === 'dessiner'));
  // La planche de l'espèce sert de patron : document vide, elle prend toute la
  // surface de travail et on trace directement dessus.
  const avecPlanche = poserRepere(espece, true);
  marquer(); cadrer(); panneau();
  dire(avecPlanche ? 'document vide, planche en repérage — trace par-dessus'
                   : 'document vide — pose les sommets de ta première forme', 'ok');
};

$('#btnFond').onclick = () => {
  if (!doc) return dire('ouvre ou crée d\'abord un dessin', 'ko');
  $('#fichierFond').click();
};
$('#fichierFond').onchange = ev => {
  const f = ev.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      instantane();
      // La surface de travail prend la taille de l'image : on dessine DANS son
      // repère, pas à côté.
      if (!doc.shapes.length) { doc.naturalW = im.width; doc.naturalH = im.height; }
      chargerFond(fr.result, im.width, im.height);
      marquer(); panneau();
      dire(`${f.name} en calque de repérage (${im.width}×${im.height})`, 'ok');
    };
    im.onerror = () => dire('image illisible', 'ko');
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
  ev.target.value = '';
};

$('#btnSilhouette').onclick = () => {
  if (!espece) return dire('choisis d\'abord une espèce', 'ko');
  try {
    debrancher();
    doc = SVGImport.depuisEspece(espece);
    doc.nom = espece;
    formeSel = 0; finSel = 0;
    if (!doc.fond && aRepere(espece)) poserRepere(espece, true);
    marquer(); cadrer(); panneau();
    dire(`silhouette reprise : ${doc.shapes.length} formes, ${doc.shapes.reduce((n, s) => n + s.points.length, 0)} points`, 'ok');
  } catch (err) { dire('échec : ' + err.message, 'ko'); }
};

let attenteFichier = null;
$('#btnSVG').onclick = () => { attenteFichier = 'svg'; $('#fichier').accept = '.svg'; $('#fichier').click(); };
$('#btnJSON').onclick = () => { attenteFichier = 'json'; $('#fichier').accept = '.json'; $('#fichier').click(); };
$('#fichier').onchange = ev => {
  const f = ev.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    ouvrir(fr.result, f.name.replace(/\.(svg|json)$/i, ''), attenteFichier);
    ev.target.value = '';
  };
  fr.readAsText(f);
};

// Chargement d'un contenu, quelle que soit sa provenance. Exposé sur `window`
// pour que la page soit pilotable depuis la console — c'est ce qui permet de la
// vérifier sans passer par un sélecteur de fichier natif, qu'aucun script ne
// peut ouvrir.
function ouvrir(contenu, nom, type) {
  try {
    debrancher();
    doc = type === 'svg'
      ? SVGImport.depuisSVG(contenu, nom)
      : SVGImport.finaliser(Object.assign(
          typeof contenu === 'string' ? JSON.parse(contenu) : contenu, { nom }));
    doc.espece = espece; doc.nom = nom;
    formeSel = 0; finSel = 0; trace = null;
    if (!doc.fond && aRepere(espece)) poserRepere(espece, true);
    reprendreFond();
    marquer(); cadrer(); panneau();
    dire(`${nom} importé : ${doc.shapes.length} formes, `
       + `${doc.shapes.reduce((n, s) => n + s.points.length, 0)} points`, 'ok');
  } catch (err) { dire('import impossible : ' + err.message, 'ko'); }
}
window.Atelier = { ouvrir, choisir, get doc() { return doc; } };

// ---------------------------------------------------------------------------
// Enregistrement
// ---------------------------------------------------------------------------
function aEnvoyer() {
  const d = JSON.parse(JSON.stringify(doc));
  delete d.espece; delete d.nom;
  // La planche du design ne s'enregistre pas : elle est reposée toute seule à
  // l'ouverture, et elle appartient au dépôt, pas au dessin. Une image importée
  // au disque, elle, reste embarquée — sans elle le document n'est plus repris.
  if (d.fond && d.fond.planche) delete d.fond;
  // Arrondi : un dessin n'a pas besoin de quinze décimales, et le fichier
  // triple de taille pour rien.
  const a = v => Math.round(v * 100) / 100;
  for (const sh of d.shapes) {
    sh.points = sh.points.map(p => [a(p[0]), a(p[1])]);
    // Mémoire de travail du bouton « trait seul » : elle n'a rien à faire dans
    // le fichier, et le jeu ne saurait pas quoi en faire.
    delete sh._fillAvant;
    if (sh.lineWidth != null) sh.lineWidth = a(sh.lineWidth);
    if (sh.alpha != null) sh.alpha = a(sh.alpha);
    if (sh.lueur != null) sh.lueur = a(sh.lueur);
  }
  for (const c in d.points) {
    const pt = d.points[c];
    pt.x = a(pt.x); pt.y = a(pt.y);
    if (pt.r != null) pt.r = a(pt.r);
    if (pt.ecart != null) pt.ecart = a(pt.ecart);
  }
  for (const f of d.fins) {
    f.x = a(f.x); f.y = a(f.y); f.r = Math.round(f.r);
    if (f.ang != null) f.ang = Math.round(f.ang);
    if (f.phase != null) f.phase = Math.round(f.phase);
    if (f.vitesse != null) f.vitesse = a(f.vitesse);
    if (f.ondes != null) f.ondes = a(f.ondes);
  }
  // `tailBlend` reste enregistré même sans queue : décocher « sans queue » doit
  // rendre le réglage tel qu'il était, pas une valeur par défaut.
  if (d.tailBlend != null) d.tailBlend = a(d.tailBlend);
  return d;
}

function enregistrer() {
  const nom = ($('#nomFichier').value || '').trim();
  if (!/^[A-Za-z0-9_-]{1,64}$/.test(nom)) return dire('nom invalide (lettres, chiffres, - et _)', 'ko');
  dire('enregistrement…');
  fetch('api/sprite/' + encodeURIComponent(nom), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(aEnvoyer()),
  }).then(r => r.json()).then(rep => {
    if (rep.erreur) return dire('refusé : ' + rep.erreur, 'ko');
    doc.nom = nom;
    delete brouillons[espece];
    dire(`écrit dans ${rep.fichier} (${rep.octets} octets)`, 'ok');
    inventaire().then(rail);
  }).catch(e => dire('serveur injoignable — lancer dev_server.py : ' + e, 'ko'));
}

function activer(nom) {
  if (nom !== null && !/^[A-Za-z0-9_-]{1,64}$/.test(nom)) return dire('nom invalide', 'ko');
  const m = Object.assign({}, manifeste);
  if (nom === null) delete m[espece]; else m[espece] = nom;
  fetch('api/manifeste', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(m),
  }).then(r => r.json()).then(rep => {
    if (rep.erreur) return dire('refusé : ' + rep.erreur, 'ko');
    manifeste = m;
    fichierOuvert = null;
    dire(nom === null
      ? `${SPECIES[espece].name} revient à sa silhouette procédurale`
      : `${SPECIES[espece].name} utilise maintenant ${nom}.json — recharge le jeu`, 'ok');
    inventaire().then(() => { rail(); panneau(); });
  }).catch(e => dire('serveur injoignable : ' + e, 'ko'));
}

function dire(m, cls) { const e = $('#etat'); e.textContent = m || ''; e.className = cls || ''; }

// ---------------------------------------------------------------------------
// Outils, boucle, démarrage
// ---------------------------------------------------------------------------
function choisirOutil(nom) {
  outil = nom;
  document.querySelectorAll('#barre button[data-outil]').forEach(x =>
    x.classList.toggle('on', x.dataset.outil === nom));
  panneau(); dessiner();
}
document.querySelectorAll('#barre button[data-outil]').forEach(b =>
  b.addEventListener('click', () => choisirOutil(b.dataset.outil)));

// --- Commandes permanentes (hors panneau, donc câblées une seule fois) -------
// Le filtre : à 51 espèces réparties en cinq rubriques, chercher « la murène »
// à l'œil coûtait plus cher que de la taper.
$('#filtre').addEventListener('input', e => { filtreTxt = e.target.value; rail(); });
// L'aide occupait les deux tiers de la colonne. Elle est indispensable la
// première fois et encombrante toutes les suivantes : elle s'éteint.
$('#bAide').addEventListener('click', () => {
  aide = !aide;
  localStorage.setItem('atelier.aide', aide ? '1' : '0');
  $('#bAide').classList.toggle('on', aide);
  panneau();
});
$('#bAide').classList.toggle('on', aide);
document.querySelectorAll('#humeursBarre button').forEach(b =>
  b.addEventListener('click', () => {
    bandeauMode = b.dataset.bandeau;
    document.querySelectorAll('#humeursBarre button').forEach(x =>
      x.classList.toggle('on', x === b));
  }));

// Raccourcis 1…7, dans l'ordre de la barre. Un outil de dessin où l'on change
// d'outil à la souris fait faire l'aller-retour vingt fois par minute.
const ORDRE = ['ancres', 'visage', 'nageoires', 'queue', 'forme', 'points', 'dessiner'];
addEventListener('keydown', ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName || ''))) return;
  const i = +ev.key;
  if (i >= 1 && i <= ORDRE.length) { ev.preventDefault(); choisirOutil(ORDRE[i - 1]); }
});

// Une erreur JavaScript ne doit pas se solder par une page qui « ne marche
// pas » sans rien dire : la barre d'état la montre.
addEventListener('error', ev => dire('erreur : ' + (ev.message || ev.error || ''), 'ko'));
addEventListener('unhandledrejection', ev => dire('erreur : ' + (ev.reason || ''), 'ko'));

addEventListener('resize', () => { cadrer(); });

function boucle() { if (anime) { dessiner(); } bandeau(); requestAnimationFrame(boucle); }

// L'index des repères d'abord : le rail affiche une pastille par espèce qui a
// son dessin dans la planche, et `choisir()` la pose aussitôt.
Promise.all([
  fetch('Assets/sprites.json').then(r => (r.ok ? r.json() : {})).catch(() => ({})),
  fetch('Assets/Reperes/index.json').then(r => (r.ok ? r.json() : {})).catch(() => ({})),
])
  .then(([m, rep]) => {
    REPERES = rep || {};
    manifeste = m || {};
    // Les sprites déclarés en dur dans species.js comptent aussi.
    for (const id in SPECIES) if (SPECIES[id].sprite && !(id in manifeste)) manifeste[id] = SPECIES[id].sprite;
    inventaire().then(() => {
      rail(); panneau();
      const premier = Object.keys(manifeste)[0] || Object.keys(SPECIES)[0];
      choisir(premier);
      boucle();
    });
  });
})();
</script>
