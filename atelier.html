<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aquarium — atelier des créatures</title>
<!--
  ATELIER DES CRÉATURES — l'outil unique.

  Il remplace le banc de calibrage et les allers-retours de fichiers à la main.
  Tout s'y fait au même endroit :

    partir de la silhouette du jeu ─┐
    importer un SVG ───────────────┼─▶ ancres · nageoires · queue · formes
    importer un JSON ──────────────┘        │
                                            ▼
                        aperçu avec le VRAI rendu du jeu
                                            │
                                            ▼
                    Assets/<nom>.json  +  Assets/sprites.json
                          (écrits par le serveur de dev)

  Le point important : ce qu'on voit ici est dessiné par `FishBody.draw`, le
  code du jeu, pas par une imitation. Toute divergence serait un bug du jeu, pas
  une surprise à la première mise en eau.

  Se lance avec le serveur de dev : python dev_server.py 8642 → /atelier.html
-->
<style>
  :root {
    color-scheme: light;
    --bord: #c9d8e3; --texte: #16232e; --doux: #5b7186;
    --fond: #eef3f7; --panneau: #fff; --accent: #2d7fd3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; overflow: hidden;
         font: 13.5px/1.5 "Segoe UI", system-ui, sans-serif;
         background: var(--fond); color: var(--texte); }

  /* --- Rail des espèces --- */
  #rail { width: 216px; background: var(--panneau); border-right: 1px solid var(--bord);
          display: flex; flex-direction: column; }
  #rail header { padding: 12px 14px 8px; border-bottom: 1px solid var(--bord); }
  #rail h1 { margin: 0; font-size: 14px; }
  #rail .sous { font-size: 11.5px; color: var(--doux); }
  #liste { flex: 1; overflow-y: auto; padding: 6px; }
  .esp { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 6px;
         cursor: pointer; font-size: 12.5px; }
  .esp:hover { background: #eef5fb; }
  .esp.actif { background: var(--accent); color: #fff; }
  .pastille { width: 8px; height: 8px; border-radius: 50%; background: #cbd8e2; flex: none; }
  .pastille.sprite { background: #35b06a; }
  .pastille.brouillon { background: #f0a92e; }
  .esp .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rubrique { font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
              color: #8ba2b4; padding: 12px 8px 3px; }
  .esp .fic { font-size: 10.5px; color: #8ba2b4; margin-left: auto; padding-left: 6px; }
  .esp.actif .fic { color: rgba(255,255,255,.75); }

  /* --- Scène --- */
  #scene { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #barre { display: flex; gap: 6px; align-items: center; padding: 8px 12px;
           background: var(--panneau); border-bottom: 1px solid var(--bord); flex-wrap: wrap; }
  #plan { flex: 1; position: relative; min-height: 0; }
  #vue { position: absolute; inset: 0; width: 100%; height: 100%; }
  #humeurs { height: 132px; border-top: 1px solid var(--bord); background: var(--panneau); }
  #humeurs canvas { width: 100%; height: 100%; display: block; }

  /* --- Panneau --- */
  #panneau { width: 322px; background: var(--panneau); border-left: 1px solid var(--bord);
             overflow-y: auto; padding: 14px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
       color: var(--doux); margin: 20px 0 8px; }
  h2:first-child { margin-top: 0; }
  label { display: block; margin: 10px 0 2px; font-weight: 600; font-size: 12.5px; }
  label .val { float: right; font-weight: 400; color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; }
  input[type=text], input[type=color], select {
    width: 100%; padding: 5px 7px; border: 1px solid var(--bord); border-radius: 5px; font: inherit; }
  input[type=color] { padding: 2px; height: 30px; }
  button { padding: 6px 10px; font: inherit; border: 1px solid var(--bord); border-radius: 6px;
           background: #fff; cursor: pointer; }
  button:hover { background: #f2f7fb; }
  button.plein { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  button.plein:hover { filter: brightness(1.08); }
  button.on { background: #dcecfa; border-color: var(--accent); color: #14507f; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .rangee { display: flex; gap: 6px; margin-top: 8px; }
  .rangee > * { flex: 1; }
  .aide { font-size: 11.5px; color: var(--doux); margin: 6px 0 0; }
  .formes { border: 1px solid var(--bord); border-radius: 6px; overflow: hidden; }
  .forme { display: flex; align-items: center; gap: 7px; padding: 5px 7px; cursor: pointer;
           border-bottom: 1px solid #edf2f6; font-size: 12px; }
  .forme:last-child { border-bottom: 0; }
  .forme.sel { background: #dcecfa; }
  .pastel { width: 15px; height: 15px; border-radius: 3px; border: 1px solid rgba(0,0,0,.18); flex: none; }
  .forme .info { flex: 1; color: var(--doux); }
  #etat { padding: 6px 12px; font-size: 12px; color: var(--doux); background: var(--panneau);
          border-top: 1px solid var(--bord); min-height: 28px; }
  #etat.ok { color: #1c7a45; } #etat.ko { color: #b3261e; }
  .coord { display: grid; grid-template-columns: 56px 1fr 1fr; gap: 4px 5px; align-items: center;
           margin-top: 6px; }
  .coord label { margin: 0; font-size: 11.5px; font-weight: 600; }
  .coord input { padding: 3px 5px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .coord .pt { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
               margin-right: 4px; vertical-align: middle; }
  kbd { background: #eef2f6; border: 1px solid var(--bord); border-bottom-width: 2px;
        border-radius: 4px; padding: 0 4px; font: 11px monospace; }
  .forme input[type=checkbox] { margin: 0; flex: none; }
  .forme .grp { font-size: 10px; background: #e6eef6; color: #14507f; border-radius: 3px;
                padding: 0 4px; flex: none; }
  .calques { border: 1px solid var(--bord); border-radius: 6px; max-height: 132px;
             overflow-y: auto; padding: 3px 5px; }
  .calques label { display: flex; align-items: center; gap: 6px; margin: 2px 0;
                   font-weight: 400; font-size: 12px; cursor: pointer; }
  .calques input { flex: none; margin: 0; }
  .sep { border: 0; border-top: 1px solid var(--bord); margin: 0 4px; height: 18px; align-self: center; }
  #barre .grp2 { display: flex; gap: 4px; }
</style>
</head>
<body>

<div id="rail">
  <header>
    <h1>Atelier des créatures</h1>
    <div class="sous"><span id="compte">—</span></div>
  </header>
  <div id="liste"></div>
</div>

<div id="scene">
  <div id="barre">
    <button id="tOutils" class="on" data-outil="ancres" title="Repères du visage (1)">📍 Ancres</button>
    <button data-outil="nageoires" title="Nageoires, pattes, tentacules (2)">🖐 Appendices</button>
    <button data-outil="queue" title="Ondulation du corps (3)">〰 Queue</button>
    <button data-outil="forme" title="Déplacer / tourner un calque (4)">⬛ Calque</button>
    <button data-outil="points" title="Retoucher le contour (5)">◻ Points</button>
    <button data-outil="dessiner" title="Tracer un nouveau calque (6)">✏️ Dessiner</button>
    <span style="flex:1"></span>
    <button id="btnNeuf">Nouveau dessin</button>
    <button id="btnFond">Image de repérage…</button>
    <button id="btnSilhouette">Partir de la silhouette du jeu</button>
    <button id="btnSVG">Importer un SVG…</button>
    <button id="btnJSON">Importer un JSON…</button>
    <input type="file" id="fichier" hidden>
    <input type="file" id="fichierFond" accept="image/*" hidden>
  </div>
  <div id="plan"><canvas id="vue"></canvas></div>
  <div id="humeurs"><canvas id="cHumeurs"></canvas></div>
  <div id="etat">Choisis une espèce à gauche.</div>
</div>

<div id="panneau"></div>

<script>
// Le jeu n'est pas lancé ici : on ne charge que ce qui dessine, et on bouche
// le reste. Les silhouettes lisent l'heure, la pente du fond et la souris.
window.GAGS = {};
window.Main = { time: 0, nightAmount: () => 0, dayT: () => 0.25, dpr: 1 };
window.World = { slopeAt: () => 0, floorY: () => 99999, planktonAt: () => 1,
                 isUnderwater: () => true, shoreX: 0, depthAt: () => 1000 };
window.Camera = { zoom: 1, x: 0, y: 0, w: 1200, h: 800, vw: 1200, vh: 800,
                  isVisible: () => true, toScreen: (x, y) => [x, y], toWorld: (x, y) => [x, y] };
window.Input = { inWindow: false, mx: 0, my: 0, mouseSpeed: 0 };
window.Particles = new Proxy({}, { get: () => () => {} });
window.Ecosystem = { entities: [], neighbors: () => [], bySpecies: {}, counts: {},
                     colosses: [], chasseurs: [], refugeFloor: () => 0, isNearRefuge: () => false };
window.Food = new Proxy({}, { get: () => () => null });
</script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/species.js"></script>
<script src="js/sprites.js"></script>
<script src="js/fishbody.js"></script>
<script src="js/entity.js"></script>
<script src="js/svgexport.js"></script>
<script src="js/svgimport.js"></script>
<script>
(function () {
'use strict';
const $ = s => document.querySelector(s);
const vue = $('#vue'), ctx = vue.getContext('2d');
const cHum = $('#cHumeurs'), gHum = cHum.getContext('2d');

// ---------------------------------------------------------------------------
// État
// ---------------------------------------------------------------------------
let espece = null;      // id d'espèce sélectionné
let doc = null;         // document en cours d'édition (format sprites.js)
let outil = 'ancres';
let formeSel = 0;
let finSel = 0;
let manifeste = {};     // espèce -> nom de fichier sprite
let fichiers = [];      // tous les dessins présents dans Assets/
const brouillons = {};  // espèce -> doc pas encore enregistré
let fichierOuvert = null;   // dessin libre en cours d'édition, s'il y en a un
let coches = new Set();     // formes cochées, pour les gestes de groupe
let trace = null;           // polygone en cours de tracé (mode Dessiner)
let couleurTrace = '#5b8fb5';
let lisseTrace = true;
let imgFond = null;         // Image() de l'éventuel calque de repérage
let REPERES = {};           // espèce -> { w, h, rang } : la planche découpée
let vueT = { x: 0, y: 0, k: 1 };
let anime = false;
let fantome = false;    // superposition de la silhouette procédurale
let attrape = null;     // ce que la souris tient en ce moment

// `eye2` n'est présente que si l'espèce a deux yeux : la liste effective est
// donc lue depuis le document, pas figée.
const CLE_ANCRES = ['center', 'nose', 'eye', 'eye2', 'mouth', 'tail'];
const COUL = { center: '#0a8f3c', nose: '#8a5ea8', eye: '#e0322f', eye2: '#e0322f',
               mouth: '#1560d8', tail: '#c98a1b' };
function ancres() { return CLE_ANCRES.filter(c => doc && doc.points[c]); }

// --- Groupes de calques -----------------------------------------------------
// « Aplatir » ne fusionne PAS les tracés : un corps et sa rayure n'ont pas la
// même couleur, les souder ferait perdre le dessin. Aplatir, ici, c'est déclarer
// que plusieurs calques n'en font plus qu'un DU POINT DE VUE DE L'ANIMATION et
// des gestes : ils se déplacent ensemble, tournent ensemble, et un seul
// appendice les entraîne tous. C'est ce qu'il faut pour un corps peint en
// quatre couches, et pour une patte dessinée en trois pièces.
function groupeDe(i) {
  const sh = doc && doc.shapes[i];
  if (!sh || !sh.groupe) return [i];
  const l = [];
  doc.shapes.forEach((o, j) => { if (o.groupe === sh.groupe) l.push(j); });
  return l;
}
function nomGroupeLibre() {
  let n = 0;
  for (const sh of doc.shapes) {
    const m = /^G(\d+)$/.exec(sh.groupe || '');
    if (m) n = Math.max(n, +m[1]);
  }
  return 'G' + (n + 1);
}
// Les calques qu'un appendice entraîne. `layerIndex` reste lu : les dessins déjà
// enregistrés (le requin) ne doivent pas changer d'aspect au premier chargement.
function calquesDe(f) {
  if (f.calques && f.calques.length) return f.calques;
  return f.layerIndex != null ? [f.layerIndex] : [];
}
function TYPE(f) { return f.type === 'tentacule' ? 'tentacule' : 'nageoire'; }

// Taille de la bouche en unités du dessin. Tant qu'elle n'a pas été réglée, elle
// suit l'œil — c'est le comportement d'origine, qu'on ne veut pas changer sous
// les pieds d'un dessin déjà calé. `drawFace` place l'œil à 0,22 fois la taille
// du visage et la bouche à ~0,2 : l'équivalence ne dépend donc pas du zoom.
function tailleBouche() {
  if (!doc || !doc.points.mouth) return 0;
  if (doc.points.mouth.r != null) return doc.points.mouth.r;
  return (doc.points.eye.r || 10) * 0.2 / 0.22;
}

// Boîte du dessin, ou la surface de travail s'il est encore vide.
function boiteDoc() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const sh of doc.shapes) for (const q of sh.points) {
    if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0];
    if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1];
  }
  if (!isFinite(x0)) { x0 = 0; y0 = 0; x1 = doc.naturalW || 420; y1 = doc.naturalH || 260; }
  return { x0, y0, L: Math.max(1, x1 - x0), H: Math.max(1, y1 - y0) };
}

// GABARITS d'ancrage. Les valeurs par défaut supposent un poisson vu de profil :
// museau à droite, bouche tout devant, queue qui bat. Sur un crabe c'était faux
// sur les trois points à la fois — bouche posée sur une pince, un seul œil, et
// un tiers de la carapace qui ondulait. Trois boutons plutôt que six réglages.
function gabarit(genre) {
  if (!doc) return;
  instantane();
  const { x0, y0, L, H } = boiteDoc();
  const p = doc.points;
  const rO = p.eye.r, rB = p.mouth.r;
  p.center = { x: x0 + L * 0.5, y: y0 + H * 0.5 };
  p.nose = { x: x0 + L, y: y0 + H * 0.5 };
  p.tail = { x: x0, y: y0 + H * 0.5 };
  delete p.eye2;
  if (genre === 'profil') {
    p.eye = { x: x0 + L * 0.78, y: y0 + H * 0.38, r: rO };
    p.mouth = { x: x0 + L * 0.90, y: y0 + H * 0.58, r: rB };
    delete doc.sansQueue;
  } else {
    // Vu de face ou de dessus : deux yeux écartés, et la bouche AU MILIEU —
    // c'est le cas du crabe, de l'étoile, du coquillage, du poulpe.
    p.eye = { x: x0 + L * 0.62, y: y0 + H * 0.34, r: rO, ecart: Math.round(L * 0.24) };
    p.mouth = { x: x0 + L * 0.50, y: y0 + H * 0.54, r: rB };
    if (genre === 'rampant') doc.sansQueue = true; else delete doc.sansQueue;
  }
  marquer(); panneau();
  dire(genre === 'profil' ? 'gabarit poisson : un œil, bouche au museau, queue active'
     : genre === 'face' ? 'gabarit vu de face : deux yeux, bouche au milieu'
     : 'gabarit rampant : deux yeux, bouche au milieu, pas de queue', 'ok');
}

// ---------------------------------------------------------------------------
// Rail des espèces
// ---------------------------------------------------------------------------
function rail() {
  const l = $('#liste');
  l.innerHTML = '';
  let nSprite = 0;
  const titre = txt => {
    const d = document.createElement('div');
    d.className = 'rubrique'; d.textContent = txt; l.appendChild(d);
  };

  titre('Espèces du jeu');
  for (const id of Object.keys(SPECIES)) {
    const d = document.createElement('div');
    d.className = 'esp' + (id === espece && !fichierOuvert ? ' actif' : '');
    const aSprite = !!manifeste[id];
    if (aSprite) nSprite++;
    d.innerHTML = `<span class="pastille ${brouillons[id] ? 'brouillon' : (aSprite ? 'sprite' : '')}"></span>`
                + `<span class="nom">${SPECIES[id].name}</span>`
                + (aRepere(id) ? `<span class="fic" title="dessin de référence">🎨</span>` : '')
                + (aSprite ? `<span class="fic">${manifeste[id]}</span>` : '');
    d.title = (aSprite ? `dessin : ${manifeste[id]}.json` : 'silhouette procédurale')
            + (aRepere(id) ? ' · planche du design disponible' : '');
    d.onclick = () => { fichierOuvert = null; choisir(id); };
    l.appendChild(d);
  }

  // Tout dessin présent dans Assets/ mais rattaché à aucune espèce. Sans cette
  // rubrique, un fichier enregistré puis désactivé devenait introuvable : il
  // existait sur le disque et nulle part dans l'outil.
  const rattaches = new Set(Object.values(manifeste));
  const libres = fichiers.filter(f => !rattaches.has(f));
  if (libres.length) {
    titre('Dessins non rattachés');
    for (const f of libres) {
      const d = document.createElement('div');
      d.className = 'esp' + (f === fichierOuvert ? ' actif' : '');
      d.innerHTML = `<span class="pastille brouillon"></span><span class="nom">${f}</span>`;
      d.title = `Assets/${f}.json — pas encore rattaché à une espèce`;
      d.onclick = () => ouvrirFichier(f);
      l.appendChild(d);
    }
  }

  $('#compte').textContent =
    `${Object.keys(SPECIES).length} espèces · ${nSprite} dessin${nSprite > 1 ? 's' : ''} actif${nSprite > 1 ? 's' : ''} · `
    + `${Object.keys(REPERES).length} planches · `
    + `${fichiers.length} fichier${fichiers.length > 1 ? 's' : ''} dans Assets/`;
}

// Ouvre un dessin libre, en le rattachant provisoirement à l'espèce courante
// (il faut bien un `size` pour le mettre à l'échelle).
function ouvrirFichier(f) {
  fichierOuvert = f;
  // Un dessin libre a quand même besoin d'une espèce : c'est elle qui donne le
  // `size` qui met le dessin à l'échelle. Si le nom du fichier est celui d'une
  // espèce, on la prend — sinon `crabe.json` s'affichait à la taille du requin.
  if (SPECIES[f]) espece = f;
  dire('chargement de ' + f + '…');
  fetch(`Assets/${f}.json`).then(r => r.json())
    .then(d => {
      doc = SVGImport.finaliser(Object.assign({}, d, { espece, nom: f }));
      formeSel = 0; finSel = 0;
      cadrer(); panneau(); rail();
      dire(`${f}.json ouvert — rattache-le à une espèce avec « Activer dans le jeu »`, 'ok');
    })
    .catch(e => dire('illisible : ' + e, 'ko'));
}

// --- Calque de repérage ------------------------------------------------------
// Une image posée SOUS le dessin, à opacité réglable, pour redessiner par-dessus
// un rendu généré ailleurs. Elle est embarquée dans le document (comme le
// `sourceRaw` de l'outil d'ancrages) : le fichier reste autonome, on peut
// reprendre le travail sans avoir à retrouver l'image d'origine.
//
// Deux provenances, un seul objet `doc.fond` :
//   `data` — une image choisie au disque, EMBARQUÉE dans le document ;
//   `src`  — une image du dépôt (la planche découpée, ci-dessous), référencée
//            par son chemin. 30 vignettes embarquées, ce serait 1 Mo de base64
//            recopié dans les documents ; le chemin ne coûte rien et suit les
//            mises à jour de la planche.
// `x`, `y` et `k` la placent dans le repère du DESSIN : une vignette de 155 px
// n'est jamais à l'échelle d'un document de 410, il faut pouvoir la caler.
function chargerFond(dataURL, w, h) {
  doc.fond = Object.assign({ x: 0, y: 0, k: 1, opacite: 0.45 }, doc.fond || {},
                           { data: dataURL, src: null, w, h });
  imgFond = new Image();
  imgFond.onload = () => { cadrer(); };
  imgFond.src = dataURL;
}
function reprendreFond() {
  imgFond = null;
  // Sans document ouvert, on montre quand même la planche de l'espèce : c'est
  // ce qu'on regarde avant de décider de dessiner.
  const src = (doc && doc.fond) ? (doc.fond.data || doc.fond.src)
            : (aRepere(espece) ? `Assets/Reperes/${espece}.png` : null);
  if (!src) return;
  imgFond = new Image();
  imgFond.onload = () => dessiner();
  imgFond.src = src;
}

// --- La planche des 30 créatures ---------------------------------------------
// `Assets/Reperes/<espèce>.png` : le dessin de référence, détouré, une image par
// espèce. L'index dit qui en a une — sans lui il faudrait sonder 51 URL au
// chargement pour afficher une pastille dans le rail.
function aRepere(id) { return !!REPERES[id]; }

// Cale la vignette sur le dessin en cours : même largeur, même centre. C'est le
// seul placement qui serve à quelque chose — on redessine PAR-DESSUS.
function ajusterFond() {
  if (!doc || !doc.fond) return;
  const b = bornesDoc();
  if (!b) { doc.fond.x = 0; doc.fond.y = 0; doc.fond.k = 1; return; }
  doc.fond.k = (b.x1 - b.x0) / doc.fond.w;
  doc.fond.x = b.x0;
  doc.fond.y = (b.y0 + b.y1) / 2 - doc.fond.h * doc.fond.k / 2;
}

// Boîte du dessin, en unités du document. `bornes()` travaille sur le sprite
// préparé par le jeu, qui n'existe que quand il y a des formes.
function bornesDoc() {
  if (!doc || !doc.shapes.length) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const s of doc.shapes) for (const p of s.points) {
    if (p[0] < x0) x0 = p[0];
    if (p[0] > x1) x1 = p[0];
    if (p[1] < y0) y0 = p[1];
    if (p[1] > y1) y1 = p[1];
  }
  return isFinite(x0) ? { x0, y0, x1, y1 } : null;
}

function poserRepere(id, silencieux) {
  const r = REPERES[id];
  if (!doc || !r) return false;
  doc.fond = { src: `Assets/Reperes/${id}.png`, w: r.w, h: r.h,
               x: 0, y: 0, k: 1, planche: id,
               opacite: doc.fond ? doc.fond.opacite : 0.45 };
  // Document vide : la surface de travail prend la taille de la vignette, on
  // dessine DANS son repère. Document existant : on cale la vignette dessus.
  if (!doc.shapes.length) { doc.naturalW = r.w; doc.naturalH = r.h; }
  else ajusterFond();
  reprendreFond();
  if (!silencieux) dire(`planche posée en repérage (${r.w}×${r.h})`, 'ok');
  return true;
}

function inventaire() {
  return fetch('api/sprites').then(r => r.json())
    .then(r => { fichiers = r.sprites || []; })
    .catch(() => { fichiers = Object.values(manifeste); });
}

function choisir(id) {
  espece = id;
  const nom = manifeste[id];
  if (brouillons[id]) { doc = brouillons[id]; apres(); }
  else if (nom) {
    dire('chargement de ' + nom + '…');
    fetch(`Assets/${nom}.json`).then(r => r.json())
      .then(d => { doc = SVGImport.finaliser(Object.assign({}, d, { espece: id, nom })); apres(); })
      .catch(e => { doc = null; apres(); dire('illisible : ' + e, 'ko'); });
  } else { doc = null; apres(); }
  rail();
}

function apres() {
  trace = null; coches.clear();
  // La planche se pose TOUTE SEULE : c'est le dessin de référence de l'espèce,
  // on ne travaille jamais sans. Elle ne remplace pas une image déjà choisie.
  if (doc && !doc.fond && aRepere(espece)) poserRepere(espece, true);
  reprendreFond(); cadrer(); panneau(); rail();
  dire(doc ? '' : 'Aucun dessin : importe-en un, ou pars de la silhouette du jeu.');
}

// ---------------------------------------------------------------------------
// Vue : le dessin est rendu par le VRAI code du jeu
// ---------------------------------------------------------------------------
function defEspece() { return SPECIES[espece] || SPECIES.requin; }

function poser(expr, t) {
  const def = defEspece();
  const e = new Entity(espece || 'requin', 0, 0);
  e.stage = 'adult'; e.growth = 1; e.gabarit = 1; e.age = e.maxAge * 0.5;
  e.expression = expr || 'idle'; e._held = true; e.exprTimer = 9; e.emoteDur = 9;
  e._facing = 1; e._flipX = 1; e._tilt = 0; e._chew = 0; e._sable = 0;
  e.speedNow = def.speed; e.phase = 0; e._color = def.colors[0];
  e.stealth = 0; e.strikeT = 0; e._repli = 0;
  return e;
}

// Le document en cours est injecté dans le cache de `Sprites` sous une clé
// dédiée : le rendu passe alors exactement par le même chemin qu'en jeu,
// préparation comprise.
function brancher() {
  if (!doc) return null;
  const cle = '__atelier__';
  Sprites.cache[cle] = Sprites.preparer(doc);
  defEspece().sprite = cle;
  return Sprites.cache[cle];
}
function debrancher() { const d = defEspece(); if (d.sprite === '__atelier__') delete d.sprite; }

// Même règle que `FishBody.drawSprite` : l'échelle déclarée si elle existe,
// sinon la règle du poisson allongé. Dupliquée ici parce que l'atelier doit
// convertir les coordonnées du DESSIN en coordonnées écran pour ses poignées.
function echelleRendu(sp, def) {
  const ajust = sp.spriteScale || def.spriteScale || 1;
  return (sp.echelle && sp.tailleJeu)
    ? sp.echelle * (def.size / sp.tailleJeu) * ajust
    : (def.size * 2.5 * ajust) / sp.w;
}

function bornes(sp) {
  let y0 = Infinity, y1 = -Infinity;
  for (const sh of sp.shapes) for (const p of sh.points) {
    if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
  }
  return { x0: sp.minX, x1: sp.minX + sp.w, y0, y1 };
}

function cadrer() {
  const sp = brancher();
  if (!sp) { debrancher(); dessiner(); return; }
  const b = bornes(sp);
  const W = vue.clientWidth, H = vue.clientHeight;
  // Document encore vide : on cadre la SURFACE DE TRAVAIL, sinon il n'y a rien
  // à cadrer et le zoom part à l'infini.
  if (!doc.shapes.length) {
    const k0 = Math.min(W / ((doc.naturalW || 420) * 1.15), H / ((doc.naturalH || 260) * 1.2));
    vueT.k = k0;
    vueT.x = W / 2 - (doc.naturalW || 420) / 2 * k0;
    vueT.y = H / 2 - (doc.naturalH || 260) / 2 * k0;
    debrancher(); dessiner(); return;
  }
  const k = Math.min(W / (sp.w * 1.25), H / Math.max(1, (b.y1 - b.y0) * 1.35));
  vueT.k = k;
  vueT.x = W / 2 - (b.x0 + sp.w / 2) * k;
  vueT.y = H / 2 - (b.y0 + (b.y1 - b.y0) / 2) * k;
  debrancher();
  dessiner();
}

const versEcran = p => [p[0] * vueT.k + vueT.x, p[1] * vueT.k + vueT.y];

// Le calque de repérage. Il se pose SOUS le dessin pour redessiner par-dessus,
// et AU-DESSUS pour comparer : sur une espèce reprise de sa silhouette, le
// corps opaque recouvre entièrement la référence et on ne compare plus rien.
function tracerFond() {
  if (!doc || !doc.fond || !imgFond || !imgFond.complete) return;
  ctx.save();
  ctx.globalAlpha = doc.fond.opacite;
  const k = doc.fond.k || 1;
  const [x, y] = versEcran([doc.fond.x || 0, doc.fond.y || 0]);
  const lw = doc.fond.w * k * vueT.k, lh = doc.fond.h * k * vueT.k;
  // Les planches sont déjà retournées vers la droite à la découpe ; ce miroir
  // sert aux créatures vues de face, dont le sens ne veut rien dire, et aux
  // images importées d'ailleurs.
  if (doc.fond.miroir) { ctx.translate(x + lw, y); ctx.scale(-1, 1); ctx.drawImage(imgFond, 0, 0, lw, lh); }
  else ctx.drawImage(imgFond, x, y, lw, lh);
  ctx.restore();
}
const versDoc = (sx, sy) => [(sx - vueT.x) / vueT.k, (sy - vueT.y) / vueT.k];

function dessiner() {
  const W = vue.clientWidth, H = vue.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  if (vue.width !== W * dpr || vue.height !== H * dpr) { vue.width = W * dpr; vue.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#dfeaf2'; ctx.fillRect(0, 0, W, H);

  if (!doc) {
    // Pas de dessin, mais une planche : autant la montrer. C'est elle qu'on
    // vient regarder avant de cliquer sur « Nouveau dessin ».
    let bas = H / 2;
    if (imgFond && imgFond.complete && aRepere(espece)) {
      const r = REPERES[espece];
      const k = Math.min(W * 0.55 / r.w, H * 0.62 / r.h);
      ctx.save(); ctx.globalAlpha = 0.85;
      ctx.drawImage(imgFond, W / 2 - r.w * k / 2, H / 2 - r.h * k / 2 - 14,
                    r.w * k, r.h * k);
      ctx.restore();
      bas = H / 2 + r.h * k / 2 + 8;
    }
    ctx.fillStyle = '#8ba2b4'; ctx.font = '15px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(espece ? 'Pas encore de dessin pour cette espèce.' : 'Choisis une espèce à gauche.', W / 2, bas);
    ctx.textAlign = 'left';
    return;
  }

  // Calque de repérage, sous le dessin — ou par-dessus, voir `dessus`.
  if (!(doc.fond && doc.fond.dessus)) tracerFond();

  const sp = brancher();
  const def = defEspece();
  // Échelle : `FishBody.draw` travaille en unités de jeu autour de l'origine,
  // il faut donc défaire sa mise à l'échelle pour retrouver les coordonnées du
  // dessin, sur lesquelles portent les poignées.
  const kJeu = echelleRendu(sp, def);
  const t = anime ? performance.now() / 1000 : 1.2;
  Main.time = t;

  // Fantôme : la silhouette procédurale que ce dessin remplace, en gris, calée
  // sur la MÊME origine. C'est la seule façon de juger d'un coup d'œil si un
  // dessin importé est à la bonne taille — la règle de repli du jeu suppose un
  // poisson allongé et se trompe sur tout ce qui est vertical.
  if (fantome) {
    debrancher();
    ctx.save();
    ctx.globalAlpha = 0.3;
    ctx.translate(sp.cx * vueT.k + vueT.x, sp.cy * vueT.k + vueT.y);
    ctx.scale(vueT.k / kJeu, vueT.k / kJeu);
    try { FishBody.draw(ctx, poser('idle', t), t); } catch (err) { /* ignore */ }
    ctx.restore();
    brancher();
  }

  ctx.save();
  ctx.translate(sp.cx * vueT.k + vueT.x, sp.cy * vueT.k + vueT.y);
  ctx.scale(vueT.k / kJeu, vueT.k / kJeu);
  try { FishBody.draw(ctx, poser('idle', t), t); } catch (err) { /* dessin incomplet */ }
  ctx.restore();

  if (doc.fond && doc.fond.dessus) tracerFond();
  debrancher();

  poignees(sp);

  // Polygone en cours de tracé : les sommets posés, le segment vers le curseur,
  // et le retour à la fermeture. Sans le retour on ne voit pas la forme venir.
  if (trace && trace.length) {
    ctx.strokeStyle = couleurTrace; ctx.lineWidth = 2;
    ctx.fillStyle = couleurTrace + '55';
    ctx.beginPath();
    trace.forEach((p, i) => { const [x, y] = versEcran(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    if (souris) { const [x, y] = versEcran(souris); ctx.lineTo(x, y); }
    ctx.stroke();
    if (trace.length > 1) {
      ctx.save(); ctx.globalAlpha = 0.5; ctx.beginPath();
      trace.forEach((p, i) => { const [x, y] = versEcran(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.closePath(); ctx.fill(); ctx.restore();
      ctx.setLineDash([4, 4]);
      const [ax, ay] = versEcran(trace[trace.length - 1]), [bx, by] = versEcran(trace[0]);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.fillStyle = '#fff'; ctx.strokeStyle = couleurTrace;
    for (const p of trace) {
      const [x, y] = versEcran(p);
      ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }
}

function poignees(sp) {
  const R = 6;
  // Ligne de queue — masquée quand la créature n'en a pas : la montrer laissait
  // croire qu'un réglage restait actif.
  if (doc.tailBlend != null && !doc.sansQueue) {
    const [x] = versEcran([doc.tailBlend, 0]);
    ctx.strokeStyle = outil === 'queue' ? '#c98a1b' : 'rgba(201,138,27,.45)';
    ctx.lineWidth = outil === 'queue' ? 2 : 1;
    ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, vue.clientHeight); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#c98a1b'; ctx.font = '11px system-ui';
    ctx.fillText('queue ←', x - 52, 14);
  }

  // Appendices. Deux dessins, parce que ce sont deux gestes différents :
  //  · nageoire  → un DISQUE, le rayon d'influence de la rotation ;
  //  · tentacule → une FLÈCHE, l'axe le long duquel l'onde court.
  // Montrer un disque pour un tentacule laissait croire à une rotation.
  (doc.fins || []).forEach((f, i) => {
    const vif = outil === 'nageoires' && i === finSel;
    // Le second tracé, en symétrique, est en pointillés : on doit voir OÙ il
    // tombe, c'est tout l'intérêt de l'option.
    const axes = f.miroir ? [[f.x, 1, false], [2 * doc.points.center.x - f.x, -1, true]]
                          : [[f.x, 1, false]];
    for (const [fx, sens, image] of axes) {
      const [x, y] = versEcran([fx, f.y]);
      const r = (f.r || 60) * vueT.k;
      ctx.strokeStyle = vif ? 'rgba(45,127,211,.9)' : 'rgba(45,127,211,.35)';
      ctx.lineWidth = vif ? 2 : 1;
      if (image) ctx.setLineDash([6, 5]);
      if (TYPE(f) === 'tentacule') {
        const a0 = (f.ang != null ? f.ang : 180) * Math.PI / 180;
        const ax = Math.cos(a0) * sens, ay = Math.sin(a0);
        const bx = x + ax * r, by = y + ay * r;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(bx, by); ctx.stroke();
        // L'amplitude se voit : l'enveloppe que le bout parcourt.
        const amp = (f.amp != null ? f.amp : 15) / 100 * r;
        ctx.beginPath();
        ctx.moveTo(bx - ay * amp, by + ax * amp);
        ctx.lineTo(bx + ay * amp, by - ax * amp);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = image ? '#9fc0dd' : (vif ? '#1560d8' : '#7ea6cc');
        ctx.beginPath(); ctx.arc(bx, by, vif ? 5.5 : 4, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(45,127,211,.07)';
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.fillStyle = image ? '#9fc0dd' : (vif ? '#1560d8' : '#7ea6cc');
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
    }
  });

  // Contour du calque actif — et de tout son groupe, puisqu'un geste les prend
  // tous. Dans tous les outils qui travaillent SUR un calque : sans repère
  // permanent on ne sait pas sur lequel on agit. Pas dans « Ancres », où on
  // regarde un visage et où le pointillé ne fait que gêner.
  if (doc.shapes[formeSel] && outil !== 'ancres' && outil !== 'dessiner') {
    const lot = groupeDe(formeSel);
    ctx.setLineDash([6, 4]);
    for (const j of lot) {
      const actif = j === formeSel;
      ctx.strokeStyle = actif ? '#1560d8' : 'rgba(21,96,216,.4)';
      ctx.lineWidth = actif ? 2 : 1.2;
      ctx.beginPath();
      doc.shapes[j].points.forEach((p, i) => {
        const [x, y] = versEcran(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      ctx.closePath(); ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // Points de la forme sélectionnée
  if (outil === 'points' && doc.shapes[formeSel]) {
    const pts = doc.shapes[formeSel].points;
    ctx.strokeStyle = 'rgba(20,80,127,.5)'; ctx.lineWidth = 1;
    ctx.beginPath();
    pts.forEach((p, i) => { const [x, y] = versEcran(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#14507f';
    for (const p of pts) {
      const [x, y] = versEcran(p);
      ctx.beginPath(); ctx.rect(x - 3, y - 3, 6, 6); ctx.fill(); ctx.stroke();
    }
  }

  // Ancres
  for (const cle of ancres()) {
    const a = doc.points[cle]; if (!a) continue;
    const [x, y] = versEcran([a.x, a.y]);
    const vif = outil === 'ancres';
    // Cercle de taille : l'œil, et la bouche. La bouche n'a pas toujours de `r`
    // enregistré — on montre alors la valeur qu'elle suit.
    const rayon = cle === 'mouth' ? tailleBouche() : a.r;
    if ((cle.startsWith('eye') || cle === 'mouth') && rayon) {
      const teinte = cle === 'mouth' ? '21,96,216' : '224,50,47';
      ctx.strokeStyle = `rgba(${teinte},${vif ? 0.85 : 0.3})`;
      ctx.lineWidth = vif ? 2 : 1;
      ctx.beginPath(); ctx.arc(x, y, rayon * vueT.k, 0, Math.PI * 2); ctx.stroke();
      if (vif) {   // poignée de rayon, à droite du cercle
        ctx.fillStyle = COUL[cle];
        ctx.beginPath(); ctx.arc(x + rayon * vueT.k, y, 4.5, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.strokeStyle = COUL[cle]; ctx.lineWidth = vif ? 2 : 1.2;
    ctx.beginPath();
    ctx.moveTo(x - R, y); ctx.lineTo(x + R, y);
    ctx.moveTo(x, y - R); ctx.lineTo(x, y + R);
    ctx.stroke();
    if (vif) { ctx.fillStyle = COUL[cle]; ctx.font = '11px system-ui'; ctx.fillText(cle, x + 9, y - 5); }
  }
}

// --- Bandeau d'humeurs : une calibration juste doit tenir sur TOUTES les
// expressions. `sleeping` (bouche du ronflement) et `angry` (sourcil lourd)
// sont les deux qui débordent en premier d'une tête trop petite.
const HUMEURS = ['idle', 'happy', 'angry', 'sleeping', 'scared', 'kiss', 'disgust'];
function bandeau() {
  const W = cHum.clientWidth, H = cHum.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  if (cHum.width !== W * dpr || cHum.height !== H * dpr) { cHum.width = W * dpr; cHum.height = H * dpr; }
  gHum.setTransform(dpr, 0, 0, dpr, 0, 0);
  gHum.clearRect(0, 0, W, H);
  if (!doc) return;
  const sp = brancher(); const def = defEspece();
  const b = bornes(sp);
  const kJeu = echelleRendu(sp, def);
  const pas = W / HUMEURS.length;
  const k = Math.min((pas - 16) / (sp.w * kJeu), (H - 34) / Math.max(1, (b.y1 - b.y0) * kJeu));
  const t = anime ? performance.now() / 1000 : 1.2;
  HUMEURS.forEach((ex, i) => {
    gHum.save();
    gHum.translate(pas * (i + 0.5), H / 2 + 8);
    gHum.scale(k, k);
    try { FishBody.draw(gHum, poser(ex, t), t); } catch (err) { /* ignore */ }
    gHum.restore();
    gHum.fillStyle = '#5b7186'; gHum.font = '11px system-ui'; gHum.textAlign = 'center';
    gHum.fillText(ex, pas * (i + 0.5), 15);
  });
  gHum.textAlign = 'left';
  debrancher();
}

// ---------------------------------------------------------------------------
// Panneau contextuel
// ---------------------------------------------------------------------------
// Amplitude effective d'un appendice : la sienne, ou à défaut celle du premier
// calque qu'il entraîne (le comportement d'avant, pour les dessins déjà calés).
function ampDe(f) {
  if (f.amp != null) return f.amp;
  const i = calquesDe(f)[0];
  return (doc.shapes[i] && doc.shapes[i].amp) || 15;
}
// Liste de cases à cocher « quelles formes » — le même bloc sert aux appendices
// et à la queue.
function listeCalques(attr, choisies) {
  const s = new Set(choisies);
  return `<div class="calques">` + doc.shapes.map((sh, i) =>
    `<label><input type="checkbox" data-${attr}="${i}" ${s.has(i) ? 'checked' : ''}>` +
    `<span class="pastel" style="background:${sh.fill || sh.stroke || '#888'}"></span>` +
    `forme ${i + 1}${sh.groupe ? ' · ' + sh.groupe : ''}</label>`).join('') + `</div>`;
}
function panneau() {
  const p = $('#panneau');
  if (!espece) { p.innerHTML = '<p class="aide">Choisis une espèce dans la liste.</p>'; return; }
  // Un document rechargé peut avoir moins de formes : une case cochée sur un
  // indice disparu ferait planter « Aplatir ».
  if (doc) for (const i of [...coches]) if (i >= doc.shapes.length) coches.delete(i);
  const def = SPECIES[espece];
  const nom = manifeste[espece] || (doc && doc.nom) || espece;

  let h = `<h2>${fichierOuvert ? fichierOuvert + '.json' : def.name}</h2>
    <p class="aide">${fichierOuvert
        ? `dessin non rattaché · mis à l'échelle de <b>${def.name}</b>`
        : (def.realName || '')}<br>
    taille de jeu <b>${def.size}</b> · ${doc ? doc.shapes.length + ' forme(s)' : 'silhouette procédurale'}</p>`;

  if (doc) {
    if (outil === 'ancres') {
      const deux = doc.points.eye.ecart != null || !!doc.points.eye2;
      h += `<h2>Ancres</h2><p class="aide">Tire les croix sur le dessin, ou saisis les
        coordonnées : sur une petite tête elles se chevauchent et deviennent
        impossibles à viser à la souris.<br>
        <b>center</b> est le point que le jeu place à la position de la créature ;
        <b>eye</b> et <b>mouth</b> portent le visage commun.</p>
        <div class="coord">` +
        ancres().map(cle => `
          <label><span class="pt" style="background:${COUL[cle]}"></span>${cle}</label>
          <input type="number" step="0.5" data-anc="${cle}" data-axe="x" value="${doc.points[cle].x.toFixed(1)}">
          <input type="number" step="0.5" data-anc="${cle}" data-axe="y" value="${doc.points[cle].y.toFixed(1)}">`).join('')
        + `</div>
        <label>Taille de l'œil <span class="val" id="vR">${(doc.points.eye.r || 0).toFixed(1)}</span></label>
        <input type="range" id="sR" min="1" max="${Math.round(doc.naturalW * 0.3)}" step="0.5" value="${doc.points.eye.r || 10}">
        <div class="rangee"><button id="bAutoOeil">Déduire du dessin</button></div>
        <label>Taille de la bouche <span class="val" id="vBR">${tailleBouche().toFixed(1)}</span></label>
        <input type="range" id="sBR" min="1" max="${Math.round(doc.naturalW * 0.3)}" step="0.5" value="${tailleBouche()}">
        <p class="aide">${doc.points.mouth.r == null
          ? 'Suit la taille de l\'œil tant qu\'on n\'y touche pas.'
          : 'Réglée à part de l\'œil.'} Le cercle bleu sur le dessin : tire sa poignée droite.</p>

        <h2>Gabarit</h2>
        <div class="rangee">
          <button data-gab="profil">Poisson</button>
          <button data-gab="face">De face</button>
          <button data-gab="rampant">Rampant</button>
        </div>
        <p class="aide">Replace les ancres d'un coup. Un poisson se voit de
          <b>profil</b> : un œil, bouche au museau, queue qui bat. Un crabe ou une
          étoile se voient de <b>dessus</b> : deux yeux, <b>bouche au milieu</b>,
          et <b>pas de queue</b> du tout.</p>

        <h2>Nombre d'yeux</h2>
        <div class="rangee"><button id="bDeuxYeux" class="${deux ? 'on' : ''}">${deux ? 'Revenir à un œil' : 'Passer à deux yeux'}</button></div>
        ${deux && doc.points.eye.ecart != null ? `
          <label>Écartement <span class="val" id="vEcart">${doc.points.eye.ecart.toFixed(1)}</span></label>
          <input type="range" id="sEcart" min="0" max="${Math.round(doc.naturalW * 0.8)}" step="0.5" value="${doc.points.eye.ecart}">
          <p class="aide">Le second œil est le symétrique du premier, décalé vers la queue :
            une seule ancre à placer.</p>
          <div class="rangee"><button id="bLibererOeil">Le placer librement</button></div>` : ''}
        ${doc.points.eye2 ? `<p class="aide">Second œil <b>placé librement</b> : son ancre
          <code>eye2</code> est dans la liste ci-dessus.</p>` : ''}
        <p class="aide">Le visage commun est de <b>profil</b> : un seul œil, ce qui va
          à un poisson vu de côté. Tout ce qui se voit de face ou de dessus —
          crabe, raie, coquillage, poulpe — en veut deux.</p>`;
    } else if (outil === 'nageoires') {
      h += `<h2>Appendices</h2><p class="aide">Nageoire, patte, antenne, bras de poulpe.
        <kbd>clic</kbd> dans le vide en pose un sur le calque sélectionné.</p>`;
      if (!doc.fins.length) h += '<p class="aide"><i>aucun appendice</i></p>';
      else {
        const f = doc.fins[finSel], tt = TYPE(f);
        const tent = tt === 'tentacule';
        h += `<select id="selFin">${doc.fins.map((o, i) => {
            const c = calquesDe(o);
            return `<option value="${i}" ${i === finSel ? 'selected' : ''}>${i + 1}. ${TYPE(o)}`
                 + ` → ${c.length > 1 ? c.length + ' formes' : 'forme ' + (c[0] + 1)}</option>`;
          }).join('')}</select>

          <h2>Type</h2>
          <div class="rangee">
            <button data-typeapp="nageoire" class="${tent ? '' : 'on'}">Nageoire</button>
            <button data-typeapp="tentacule" class="${tent ? 'on' : ''}">Tentacule</button>
          </div>
          <p class="aide">${tent
            ? 'Une <b>onde court</b> de l\'ancre vers la pointe de la flèche : la base ne bouge pas, le bout parcourt toute l\'amplitude. C\'est ce qu\'il faut pour une patte, une antenne, un bras — un pivot les rend raides.'
            : 'La forme <b>pivote</b> autour de l\'ancre : plein effet au centre du disque, plus rien à son bord.'}</p>

          <label>${tent ? 'Longueur' : 'Rayon d\'influence'} <span class="val" id="vFR">${Math.round(f.r)}</span></label>
          <input type="range" id="sFR" min="10" max="${Math.round(doc.naturalW * 0.9)}" value="${Math.round(f.r)}">`;
        if (tent) h += `
          <label>Direction <span class="val" id="vFA">${Math.round(f.ang != null ? f.ang : 180)}°</span></label>
          <input type="range" id="sFA" min="-180" max="180" value="${Math.round(f.ang != null ? f.ang : 180)}">
          <label>Ondes sur la longueur <span class="val" id="vFO">${(f.ondes != null ? f.ondes : 1).toFixed(2)}</span></label>
          <input type="range" id="sFO" min="0" max="2" step="0.05" value="${f.ondes != null ? f.ondes : 1}">
          <p class="aide">Tire la <b>pointe de la flèche</b> sur le dessin : direction et
            longueur d'un seul geste. 0 onde = le membre se balance d'un bloc ;
            1 onde = il se déroule.</p>`;
        h += `
          <label>Amplitude <span class="val" id="vFAm">${ampDe(f)}</span>${tent ? ' %' : '°'}</label>
          <input type="range" id="sFAm" min="0" max="${tent ? 80 : 60}" value="${ampDe(f)}">
          <label>Déphasage <span class="val" id="vFPh">${Math.round(f.phase || 0)}°</span></label>
          <input type="range" id="sFPh" min="0" max="360" value="${Math.round(f.phase || 0)}">
          <label>Vitesse <span class="val" id="vFV">${(f.vitesse || 1).toFixed(2)}</span>×</label>
          <input type="range" id="sFV" min="0.2" max="2.5" step="0.05" value="${f.vitesse || 1}">
          <p class="aide">Déphasage et vitesse <b>propres à cet appendice</b> : sans eux,
            les huit pattes d'un crabe battent toutes ensemble, ce qui se lit comme un
            tressaillement et pas comme une marche.</p>

          <div class="rangee"><button id="bMiroirFin" class="${f.miroir ? 'on' : ''}">${f.miroir ? 'Symétrique ✓' : 'Rendre symétrique'}</button></div>
          <p class="aide">Un crabe, une raie, un poulpe ont des appendices des <b>deux</b>
            côtés : un seul ancrage n'en anime qu'une moitié. En symétrique, un second est
            posé en miroir de l'axe vertical du dessin et joue en sens inverse — les deux
            côtés battent comme une paire de pattes.</p>

          <h2>Formes entraînées</h2>
          ${listeCalques('cal', calquesDe(f))}
          <div class="rangee"><button id="bFinGroupe">Tout le groupe de la forme ${formeSel + 1}</button></div>
          <p class="aide">Un appendice peut entraîner <b>plusieurs formes</b> : une patte
            dessinée en trois pièces bat alors d'un seul geste, sans déchirure au
            raccord. C'est l'« aplatissement » — voir la liste des formes plus bas.</p>
          <div class="rangee"><button id="bSupFin">Supprimer cet appendice</button></div>`;
      }
    } else if (outil === 'queue') {
      h += `<h2>Queue</h2>
        <div class="rangee"><button id="bSansQueue" class="${doc.sansQueue ? 'on' : ''}">${doc.sansQueue ? 'Sans queue ✓' : 'Cette créature n\'a pas de queue'}</button></div>
        <p class="aide">Un crabe, une étoile, un coquillage n'ont rien à faire onduler :
          la valeur par défaut faisait tortiller un tiers du crabe. Leurs membres
          s'animent avec des <b>appendices</b>, pas avec la queue.</p>`;
      if (!doc.sansQueue) h += `
        <p class="aide">Tout ce qui est <b>à gauche</b> de la ligne ondule, d'autant plus
          qu'on approche du bout. Tire la ligne sur le dessin.</p>
        <label>Départ de la queue <span class="val" id="vTB">${Math.round(doc.tailBlend)}</span></label>
        <input type="range" id="sTB" min="0" max="${Math.round(doc.naturalW)}" value="${Math.round(doc.tailBlend)}">
        <label>Ondes le long du corps <span class="val" id="vTO">${(doc.tailOndes || 0).toFixed(2)}</span></label>
        <input type="range" id="sTO" min="0" max="3" step="0.05" value="${doc.tailOndes || 0}">
        <p class="aide">0 = la queue bat <b>d'un seul tenant</b>, comme un poisson.
          1 ou 2 = l'onde <b>court</b> vers le bout : c'est une murène ou une anguille,
          dont le corps entier est un tentacule. Pour celles-là, pousse aussi le départ
          de la queue jusqu'au museau.</p>
        ${doc.shapes[formeSel] ? `
          <label>Amplitude de la forme ${formeSel + 1} <span class="val" id="vAmp">${doc.shapes[formeSel].amp}</span></label>
          <input type="range" id="sAmp" min="0" max="60" value="${doc.shapes[formeSel].amp}">` : ''}
        <h2>Formes qui ondulent</h2>
        <div class="rangee"><button id="bQTout" class="${doc.queueCalques ? '' : 'on'}">Toutes${doc.queueCalques ? '' : ' ✓'}</button></div>
        ${doc.queueCalques ? listeCalques('qcal', doc.queueCalques) : ''}
        <p class="aide">Par défaut la queue déforme tout le dessin. Restreindre est utile
          quand un élément doit rester <b>rigide</b> — une carapace, un œil posé sur le
          corps, un coquillage porté sur le dos.</p>
        ${doc.queueCalques ? '' : '<div class="rangee"><button id="bQChoisir">Choisir les formes…</button></div>'}`;
    } else if (outil === 'forme') {
      h += `<h2>Forme entière</h2><p class="aide">Tire la forme sélectionnée pour la
        déplacer. Les boutons agissent autour de son centre.</p>
        <label>Taille</label>
        <div class="rangee"><button id="bPlusPetit">− 5 %</button><button id="bPlusGrand">+ 5 %</button></div>
        <label>Rotation</label>
        <div class="rangee"><button id="bTourneG">↺ 3°</button><button id="bTourneD">↻ 3°</button></div>
        <label>Miroir</label>
        <div class="rangee"><button id="bMiroirX">↔ horizontal</button><button id="bMiroirY">↕ vertical</button></div>
        <div class="rangee"><button id="bDupliquer">Dupliquer la forme</button></div>
        <p class="aide">Un miroir horizontal sert à faire la nageoire de l'autre côté :
          dupliquer, puis retourner, puis déplacer.<br>
          <kbd>Ctrl</kbd>+<kbd>Z</kbd> annule chaque geste.</p>`;
    } else if (outil === 'dessiner') {
      h += `<h2>Dessiner une forme</h2><p class="aide">Clique pour poser les sommets.
        <kbd>double-clic</kbd> ou <b>Fermer</b> termine la forme,
        <kbd>Échap</kbd> l'abandonne, <kbd>retour arrière</kbd> retire le dernier point.</p>
        <label>Couleur</label>
        <input type="color" id="cTrace" value="${couleurTrace}">
        <label class="puce"><input type="checkbox" id="cLisse" ${lisseTrace ? 'checked' : ''}> contour lissé</label>
        <div class="rangee">
          <button id="bFermer" ${trace && trace.length > 2 ? '' : 'disabled'}>Fermer la forme</button>
          <button id="bAnnulerTrace" ${trace && trace.length ? '' : 'disabled'}>Abandonner</button>
        </div>
        <p class="aide">${trace ? `${trace.length} sommet(s) posé(s)` : 'aucun tracé en cours'}</p>`;
    } else if (outil === 'points') {
      h += `<h2>Points</h2><p class="aide">Tire les carrés pour retoucher le contour de la
        forme sélectionnée. <kbd>clic</kbd> sur le trait pour insérer un point,
        <kbd>alt</kbd>+clic sur un point pour le supprimer.<br>
        <kbd>Ctrl</kbd>+<kbd>Z</kbd> annule, partout dans l'atelier.</p>`;
    }

    h += `<h2>Taille</h2>
      <label>Échelle <span class="val" id="vEch">${(doc.spriteScale || 1).toFixed(2)}</span>×</label>
      <input type="range" id="sEch" min="0.3" max="3" step="0.01" value="${doc.spriteScale || 1}">
      <p class="aide">${doc.echelle
        ? 'Le document déclare son échelle : ce curseur ne fait que la corriger.'
        : '<b>Dessin sans échelle déclarée.</b> Le jeu suppose alors un poisson allongé (largeur ≈ 2,5 × taille), ce qui est faux sur une créature verticale.'}</p>
      <div class="rangee"><button id="bFantome" class="${fantome ? 'on' : ''}">Silhouette d'origine</button></div>
      <p class="aide">Superpose en gris la silhouette procédurale que ce dessin remplace : c'est le repère pour juger de la taille.</p>

      <h2>Formes</h2><div class="formes">` + doc.shapes.map((sh, i) => {
      const anime = doc.fins.filter(f => calquesDe(f).includes(i)).length;
      return `<div class="forme ${i === formeSel ? 'sel' : ''}" data-i="${i}">
         <input type="checkbox" data-coche="${i}" ${coches.has(i) ? 'checked' : ''}>
         <span class="pastel" style="background:${sh.fill || sh.stroke || '#888'}"></span>
         <span class="info">forme ${i + 1} · ${sh.points.length} pts${anime ? ' · 🖐' + anime : ''}</span>
         ${sh.groupe ? `<span class="grp">${sh.groupe}</span>` : ''}
       </div>`; }).join('') + `</div>
      <div class="rangee">
        <input type="color" id="cFill" value="${(doc.shapes[formeSel] && doc.shapes[formeSel].fill) || '#888888'}">
        <button id="bMonte" title="Vers le fond">▲</button>
        <button id="bDesc" title="Vers l'avant">▼</button>
        <button id="bSup" title="Supprimer">✕</button>
      </div>
      <label class="puce"><input type="checkbox" id="cSmooth"
        ${doc.shapes[formeSel] && doc.shapes[formeSel].smooth ? 'checked' : ''}> contour lissé</label>
      <div class="rangee">
        <button id="bAplatir">Aplatir les cochées (${coches.size})</button>
        <button id="bDegrouper" ${groupeDe(formeSel).length > 1 ? '' : 'disabled'}>Dégrouper</button>
      </div>
      <p class="aide"><b>Aplatir</b> ne fond pas les tracés — un corps et sa rayure n'ont
        pas la même couleur. Les formes cochées deviennent un <b>seul bloc</b> : elles se
        déplacent, tournent et s'animent ensemble, et un seul appendice les entraîne
        toutes. C'est ce qu'il faut pour un corps peint en plusieurs couches, et pour une
        patte dessinée en trois pièces.<br>
        L'ordre est l'ordre de dessin : la première forme est au fond.
        <kbd>🖐n</kbd> = nombre d'appendices qui animent la forme.</p>`;

    h += `<h2>Enregistrer</h2>
      <label>Nom du fichier</label>
      <input type="text" id="nomFichier" value="${nom}">
      <p class="aide">Écrit dans <code>Assets/&lt;nom&gt;.json</code> par le serveur de dev.</p>
      <div class="rangee"><button class="plein" id="bEnreg">Enregistrer</button></div>
      <div class="rangee">
        <button id="bActiver">${manifeste[espece] ? 'Réactiver' : 'Activer dans le jeu'}</button>
        <button id="bDesactiver" ${manifeste[espece] ? '' : 'disabled'}>Revenir au procédural</button>
      </div>
      <p class="aide">« Revenir au procédural » garde le fichier : c'est ce qu'on fait pour
      les espèces dont la silhouette actuelle convient déjà, comme la murène.</p>`;
  }

  if (doc && doc.fond) {
    const f = doc.fond;
    h += `<h2>Calque de repérage</h2>
      <p class="aide">${f.planche
        ? `planche du design — <code>Assets/Reperes/${f.planche}.png</code>`
        : 'image importée, embarquée dans le fichier'} (${f.w}×${f.h})</p>
      <label>Opacité <span class="val" id="vOpac">${f.opacite.toFixed(2)}</span></label>
      <input type="range" id="sOpac" min="0" max="1" step="0.05" value="${f.opacite}">
      <label>Échelle <span class="val" id="vFk">${(f.k || 1).toFixed(2)}</span></label>
      <input type="range" id="sFk" min="0.1" max="4" step="0.01" value="${f.k || 1}">
      <div class="rangee">
        <label>x <input type="number" id="nFx" value="${Math.round(f.x || 0)}" step="1"></label>
        <label>y <input type="number" id="nFy" value="${Math.round(f.y || 0)}" step="1"></label>
      </div>
      <div class="rangee">
        <button id="bCaler" title="Même largeur et même centre que le dessin">Caler sur le dessin</button>
        <button id="bMiroirFond" title="Le dessin du jeu regarde toujours vers la droite">↔ Retourner</button>
      </div>
      <div class="rangee">
        <button id="bDessusFond" title="Sous le dessin pour calquer, dessus pour comparer">${doc.fond.dessus ? 'Passer dessous' : 'Passer dessus'}</button>
        <button id="bSansFond">Retirer l'image</button>
      </div>
      <p class="aide">${f.planche
        ? 'La planche est référencée par son chemin : elle n\'alourdit pas le fichier.'
        : 'Elle est embarquée dans le fichier, qui reste donc autonome — mais elle l\'alourdit : à retirer avant l\'enregistrement final.'}</p>`;
  } else if (doc && aRepere(espece)) {
    h += `<h2>Calque de repérage</h2>
      <div class="rangee"><button id="bPlanche">Poser la planche du design</button></div>`;
  }

  h += `<h2>Aperçu</h2>
    <div class="rangee"><button id="bAnime" class="${anime ? 'on' : ''}">${anime ? 'Animation en cours' : 'Animer'}</button>
    <button id="bRecadrer">Recadrer</button></div>`;

  p.innerHTML = h;
  cabler();
}

function cabler() {
  const on = (sel, ev, fn) => { const e = $(sel); if (e) e.addEventListener(ev, fn); };
  ['#sR', '#sFR', '#sTB', '#sAmp'].forEach(sel => on(sel, 'pointerdown', instantane));
  on('#cFill', 'pointerdown', instantane);
  on('#sR', 'input', e => { doc.points.eye.r = +e.target.value; $('#vR').textContent = (+e.target.value).toFixed(1); marquer(); });
  document.querySelectorAll('.coord input').forEach(inp => {
    inp.addEventListener('focus', instantane);
    inp.addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      if (!isFinite(v)) return;
      doc.points[e.target.dataset.anc][e.target.dataset.axe] = v;
      marquer();
    });
  });
  on('#sEcart', 'pointerdown', instantane);
  on('#sEcart', 'input', e => {
    doc.points.eye.ecart = +e.target.value;
    $('#vEcart').textContent = (+e.target.value).toFixed(1);
    marquer();
  });
  on('#bLibererOeil', 'click', () => {
    instantane();
    const o = doc.points.eye;
    doc.points.eye2 = { x: o.x - o.ecart, y: o.y, r: o.r };
    delete o.ecart;
    marquer(); panneau();
  });
  on('#bDeuxYeux', 'click', () => {
    instantane();
    const o = doc.points.eye;
    if (doc.points.eye2 || o.ecart != null) { delete doc.points.eye2; delete o.ecart; }
    else o.ecart = Math.round((o.r || 10) * 2.6 * 10) / 10;
    marquer(); panneau();
  });
  on('#sBR', 'pointerdown', instantane);
  on('#sBR', 'input', e => {
    doc.points.mouth.r = +e.target.value;
    $('#vBR').textContent = (+e.target.value).toFixed(1);
    marquer();
  });
  // Au relâchement seulement : reconstruire le panneau pendant le glissé
  // arracherait le curseur sous le doigt. C'est là que la mention « suit l'œil »
  // devient fausse et doit disparaître.
  on('#sBR', 'change', () => panneau());
  on('#bAutoOeil', 'click', () => {
    instantane();
    doc.points.eye.r = SVGImport.rayonOeil(doc.shapes, doc.points.eye, doc.naturalW);
    marquer(); panneau();
  });
  on('#selFin', 'change', e => { finSel = +e.target.value; panneau(); dessiner(); });
  ['#sFA', '#sFO', '#sFAm', '#sFPh', '#sFV', '#sTO'].forEach(sel => on(sel, 'pointerdown', instantane));
  on('#sFR', 'input', e => { doc.fins[finSel].r = +e.target.value; $('#vFR').textContent = e.target.value; marquer(); });
  on('#sFA', 'input', e => { doc.fins[finSel].ang = +e.target.value; $('#vFA').textContent = e.target.value + '°'; marquer(); });
  on('#sFO', 'input', e => { doc.fins[finSel].ondes = +e.target.value; $('#vFO').textContent = (+e.target.value).toFixed(2); marquer(); });
  on('#sFAm', 'input', e => { doc.fins[finSel].amp = +e.target.value; $('#vFAm').textContent = e.target.value; marquer(); });
  on('#sFPh', 'input', e => { doc.fins[finSel].phase = +e.target.value; $('#vFPh').textContent = e.target.value + '°'; marquer(); });
  on('#sFV', 'input', e => { doc.fins[finSel].vitesse = +e.target.value; $('#vFV').textContent = (+e.target.value).toFixed(2); marquer(); });
  document.querySelectorAll('[data-typeapp]').forEach(b => b.addEventListener('click', () => {
    instantane();
    const f = doc.fins[finSel];
    f.type = b.dataset.typeapp;
    // Les deux réglages ne sont pas dans la même unité (degrés de rotation d'un
    // côté, pourcentage de longueur de l'autre) : garder l'ancienne valeur
    // donnait une patte qui décollait du corps au changement de type.
    f.amp = f.type === 'tentacule' ? 25 : 20;
    if (f.type === 'tentacule' && f.ang == null) f.ang = 180;
    marquer(); panneau();
  }));
  document.querySelectorAll('[data-cal]').forEach(c => c.addEventListener('change', () => {
    instantane();
    const f = doc.fins[finSel];
    const l = new Set(calquesDe(f));
    const i = +c.dataset.cal;
    c.checked ? l.add(i) : l.delete(i);
    f.calques = [...l].sort((a, b) => a - b);
    delete f.layerIndex;
    marquer(); panneau();
  }));
  on('#bFinGroupe', 'click', () => {
    instantane();
    const f = doc.fins[finSel];
    f.calques = groupeDe(formeSel);
    delete f.layerIndex;
    marquer(); panneau();
  });
  on('#bMiroirFin', 'click', () => {
    instantane();
    const f = doc.fins[finSel];
    f.miroir = !f.miroir;
    marquer(); panneau();
  });
  on('#bSupFin', 'click', () => { instantane(); doc.fins.splice(finSel, 1); finSel = 0; marquer(); panneau(); });
  on('#bSansQueue', 'click', () => {
    instantane();
    // `tailBlend` est CONSERVÉ : décocher rend la queue telle qu'elle était
    // réglée, sans avoir à la repositionner.
    if (doc.sansQueue) delete doc.sansQueue; else doc.sansQueue = true;
    marquer(); panneau();
  });
  on('#sTO', 'input', e => { doc.tailOndes = +e.target.value; $('#vTO').textContent = (+e.target.value).toFixed(2); marquer(); });
  on('#bQTout', 'click', () => { instantane(); delete doc.queueCalques; marquer(); panneau(); });
  on('#bQChoisir', 'click', () => {
    instantane();
    doc.queueCalques = doc.shapes.map((_, i) => i);
    marquer(); panneau();
  });
  document.querySelectorAll('[data-qcal]').forEach(c => c.addEventListener('change', () => {
    instantane();
    const l = new Set(doc.queueCalques || []);
    const i = +c.dataset.qcal;
    c.checked ? l.add(i) : l.delete(i);
    doc.queueCalques = [...l].sort((a, b) => a - b);
    marquer(); panneau();
  }));
  document.querySelectorAll('[data-gab]').forEach(b => b.addEventListener('click', () => { gabarit(b.dataset.gab); }));
  on('#bAplatir', 'click', aplatir);
  on('#bDegrouper', 'click', degrouper);
  document.querySelectorAll('[data-coche]').forEach(c => c.addEventListener('click', ev => {
    ev.stopPropagation();
    const i = +c.dataset.coche;
    c.checked ? coches.add(i) : coches.delete(i);
    panneau();
  }));
  on('#sTB', 'input', e => { doc.tailBlend = +e.target.value; $('#vTB').textContent = e.target.value; marquer(); });
  on('#sAmp', 'input', e => { doc.shapes[formeSel].amp = +e.target.value; $('#vAmp').textContent = e.target.value; marquer(); });
  on('#sAmp', 'pointerdown', instantane);
  on('#cFill', 'input', e => { if (doc.shapes[formeSel]) { doc.shapes[formeSel].fill = e.target.value; marquer(); panneau(); } });
  on('#bPlusPetit', 'click', () => echelleForme(0.95));
  on('#bPlusGrand', 'click', () => echelleForme(1 / 0.95));
  on('#bTourneG', 'click', () => tournerForme(-3));
  on('#bTourneD', 'click', () => tournerForme(3));
  on('#bMiroirX', 'click', () => miroirForme('x'));
  on('#bMiroirY', 'click', () => miroirForme('y'));
  on('#bDupliquer', 'click', dupliquerForme);
  on('#bMonte', 'click', () => bouger(-1));
  on('#bDesc', 'click', () => bouger(1));
  on('#bSup', 'click', () => {
    if (doc.shapes.length < 2) return dire('il faut au moins une forme', 'ko');
    instantane();
    doc.shapes.splice(formeSel, 1);
    decalerCalques(j => (j === formeSel ? null : (j > formeSel ? j - 1 : j)));
    doc.fins = doc.fins.filter(f => calquesDe(f).length);
    coches.clear();
    formeSel = Math.max(0, formeSel - 1); marquer(); panneau();
  });
  document.querySelectorAll('.forme').forEach(el =>
    el.addEventListener('click', () => { formeSel = +el.dataset.i; panneau(); dessiner(); }));
  on('#bEnreg', 'click', enregistrer);
  on('#bActiver', 'click', () => activer($('#nomFichier').value.trim()));
  on('#bDesactiver', 'click', () => activer(null));
  on('#sEch', 'pointerdown', instantane);
  on('#sEch', 'input', e => {
    doc.spriteScale = +e.target.value;
    $('#vEch').textContent = (+e.target.value).toFixed(2);
    marquer();
  });
  on('#bFantome', 'click', () => { fantome = !fantome; panneau(); dessiner(); });
  on('#cTrace', 'input', e => { couleurTrace = e.target.value; dessiner(); });
  on('#cLisse', 'change', e => { lisseTrace = e.target.checked; });
  on('#bFermer', 'click', fermerTrace);
  on('#bAnnulerTrace', 'click', () => { trace = null; panneau(); dessiner(); });
  on('#cSmooth', 'change', e => {
    instantane();
    doc.shapes[formeSel].smooth = e.target.checked;
    marquer();
  });
  on('#sOpac', 'input', e => { doc.fond.opacite = +e.target.value; $('#vOpac').textContent = (+e.target.value).toFixed(2); dessiner(); });
  on('#sFk', 'input', e => { doc.fond.k = +e.target.value; $('#vFk').textContent = (+e.target.value).toFixed(2); dessiner(); });
  on('#nFx', 'input', e => { doc.fond.x = +e.target.value || 0; dessiner(); });
  on('#nFy', 'input', e => { doc.fond.y = +e.target.value || 0; dessiner(); });
  on('#bCaler', 'click', () => { instantane(); ajusterFond(); marquer(); panneau(); dessiner(); });
  on('#bMiroirFond', 'click', () => { instantane(); doc.fond.miroir = !doc.fond.miroir; marquer(); dessiner(); });
  on('#bDessusFond', 'click', () => { doc.fond.dessus = !doc.fond.dessus; panneau(); dessiner(); });
  on('#bPlanche', 'click', () => { instantane(); poserRepere(espece); marquer(); panneau(); dessiner(); });
  on('#bSansFond', 'click', () => { instantane(); delete doc.fond; reprendreFond(); marquer(); panneau(); });
  on('#bAnime', 'click', () => { anime = !anime; panneau(); });
  on('#bRecadrer', 'click', cadrer);
}

// --- Transformations d'une forme entière ------------------------------------
// Tirer les points un par un ne permet pas de RE-PLACER une nageoire ou de
// redresser une pièce importée de travers. Tout passe donc par une seule
// fonction : on applique la transformation aux points, et — c'est le détail qui
// évite le piège — aux ancrages de nageoire qui visent cette forme, sinon le
// disque d'influence reste derrière et la nageoire se déforme autour du vide.
function transformer(fn) {
  const lot = groupeDe(formeSel);
  if (!lot.length || !doc.shapes[formeSel]) return;
  const vus = new Set(lot);
  for (const j of lot) doc.shapes[j].points = doc.shapes[j].points.map(fn);
  // Les ancrages qui visent un des calques déplacés suivent, sinon le disque
  // d'influence reste derrière et la nageoire se déforme autour du vide.
  for (const f of doc.fins) {
    if (!calquesDe(f).some(j => vus.has(j))) continue;
    const [x, y] = fn([f.x, f.y]);
    f.x = x; f.y = y;
  }
  marquer();
}

// Centre de la boîte du GROUPE : repère des mises à l'échelle et rotations.
// Prendre le centre du seul calque actif ferait tourner les pièces d'une même
// patte autour de trois centres différents — elle se désarticulerait.
function centreForme() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const j of groupeDe(formeSel)) for (const p of doc.shapes[j].points) {
    if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
    if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
  }
  return [(x0 + x1) / 2, (y0 + y1) / 2];
}

function echelleForme(k) {
  const [cx, cy] = centreForme();
  instantane();
  transformer(p => [cx + (p[0] - cx) * k, cy + (p[1] - cy) * k]);
}
function tournerForme(deg) {
  const [cx, cy] = centreForme();
  const a = deg * Math.PI / 180, co = Math.cos(a), si = Math.sin(a);
  instantane();
  transformer(p => {
    const dx = p[0] - cx, dy = p[1] - cy;
    return [cx + dx * co - dy * si, cy + dx * si + dy * co];
  });
}
function miroirForme(axe) {
  const [cx, cy] = centreForme();
  instantane();
  transformer(p => (axe === 'x' ? [2 * cx - p[0], p[1]] : [p[0], 2 * cy - p[1]]));
}
function dupliquerForme() {
  instantane();
  const sh = JSON.parse(JSON.stringify(doc.shapes[formeSel]));
  sh.points = sh.points.map(p => [p[0] + doc.naturalW * 0.04, p[1] + doc.naturalH * 0.04]);
  // La copie sort du groupe : dupliquer une nageoire, c'est en faire une AUTRE.
  delete sh.groupe;
  doc.shapes.splice(formeSel + 1, 0, sh);
  // Les appendices visant une forme au-delà du point d'insertion se décalent.
  decalerCalques(j => (j > formeSel ? j + 1 : j));
  formeSel++;
  marquer(); panneau();
}

// Toute renumérotation des calques doit être répercutée sur ce qui les VISE :
// les appendices et la liste des calques qui ondulent. C'était fait à la main,
// à trois endroits, sur le seul `layerIndex` — et rien ne suivait `calques`.
function decalerCalques(map) {
  const conv = (l) => l.map(map).filter(j => j != null);
  for (const f of doc.fins) {
    f.calques = conv(calquesDe(f));
    delete f.layerIndex;
  }
  if (doc.queueCalques) {
    doc.queueCalques = conv(doc.queueCalques);
    if (!doc.queueCalques.length) delete doc.queueCalques;
  }
}

function bouger(d) {
  const j = formeSel + d;
  if (j < 0 || j >= doc.shapes.length) return;
  instantane();
  const t = doc.shapes[formeSel]; doc.shapes[formeSel] = doc.shapes[j]; doc.shapes[j] = t;
  decalerCalques(k => (k === formeSel ? j : (k === j ? formeSel : k)));
  formeSel = j; marquer(); panneau();
}

// « Aplatir » : les calques cochés deviennent un seul bloc animé.
function aplatir() {
  const lot = [...coches].sort((a, b) => a - b);
  if (lot.length < 2) return dire('coche au moins deux formes dans la liste', 'ko');
  instantane();
  const nom = nomGroupeLibre();
  for (const i of lot) doc.shapes[i].groupe = nom;
  formeSel = lot[0]; coches.clear();
  marquer(); panneau();
  dire(`${lot.length} formes aplaties dans « ${nom} » : elles se déplacent et s'animent ensemble`, 'ok');
}
function degrouper() {
  const lot = groupeDe(formeSel);
  if (lot.length < 2) return dire('cette forme n\'est dans aucun groupe');
  instantane();
  for (const i of lot) delete doc.shapes[i].groupe;
  marquer(); panneau();
  dire('groupe défait');
}

function marquer() { if (espece && doc) brouillons[espece] = doc; dessiner(); rail(); }

// Le tracé devient une forme, posée AU-DESSUS de la pile : on dessine
// généralement du corps vers les détails.
function fermerTrace() {
  if (!trace || trace.length < 3) return dire('il faut au moins trois sommets', 'ko');
  instantane();
  doc.shapes.push({ points: trace, fill: couleurTrace, smooth: lisseTrace,
                    pivot: null, amp: 15, ferme: true });
  formeSel = doc.shapes.length - 1;
  trace = null;
  marquer(); panneau();
  dire(`forme ${doc.shapes.length} créée`, 'ok');
}

// --- Annulation -------------------------------------------------------------
// Instantanés du document entier. C'est brutal mais un document fait quelques
// dizaines de kilo-octets, et un éditeur sans Ctrl+Z n'est pas un éditeur : on
// n'ose plus rien essayer.
// `instantane()` s'appelle AVANT la modification, et une seule fois par geste —
// pas à chaque `pointermove`, sinon un simple glissé remplit la pile.
const histoire = [], futur = [];
// La SÉLECTION fait partie de l'instantané. Sans elle, annuler une duplication
// laissait la forme active sur un indice qui n'existe plus au même endroit : on
// croyait tirer une nageoire et on en déplaçait une autre.
function instantane() {
  if (!doc) return;
  histoire.push(JSON.stringify({ doc, formeSel, finSel }));
  if (histoire.length > 40) histoire.shift();
  futur.length = 0;
}
function annuler(pile, autre) {
  if (!doc || !pile.length) return dire('rien à ' + (pile === histoire ? 'annuler' : 'rétablir'));
  autre.push(JSON.stringify({ doc, formeSel, finSel }));
  const e = JSON.parse(pile.pop());
  doc = e.doc;
  formeSel = Math.min(e.formeSel, doc.shapes.length - 1);
  finSel = Math.min(e.finSel, Math.max(0, doc.fins.length - 1));
  marquer(); panneau();
  dire(pile === histoire ? 'annulé' : 'rétabli');
}
addEventListener('keydown', ev => {
  if (!(ev.ctrlKey || ev.metaKey)) return;
  const k = ev.key.toLowerCase();
  if (k === 'z' && !ev.shiftKey) { ev.preventDefault(); annuler(histoire, futur); }
  else if (k === 'y' || (k === 'z' && ev.shiftKey)) { ev.preventDefault(); annuler(futur, histoire); }
});

// ---------------------------------------------------------------------------
// Souris
// ---------------------------------------------------------------------------
function pres(sx, sy) {
  if (!doc) return null;
  const seuil = 11;
  if (outil === 'ancres') {
    for (const cle of ['eye', 'eye2', 'mouth']) {
      const a = doc.points[cle];
      if (!a) continue;
      const r = cle === 'mouth' ? tailleBouche() : a.r;
      if (!r) continue;
      const [x, y] = versEcran([a.x, a.y]);
      if (Math.hypot(sx - (x + r * vueT.k), sy - y) < seuil) return { type: 'rayonOeil', cle };
    }
    // La croix la PLUS PROCHE, pas la première trouvée : sur une petite tête,
    // center, nose, eye et mouth tiennent dans quarante pixels, et la première
    // de la liste raflait tous les clics.
    let best = null, bestD = seuil;
    for (const cle of ancres()) {
      const p = doc.points[cle];
      const [x, y] = versEcran([p.x, p.y]);
      const d = Math.hypot(sx - x, sy - y);
      if (d < bestD) { bestD = d; best = { type: 'ancre', cle }; }
    }
    if (best) return best;
  }
  if (outil === 'nageoires') {
    // La POINTE d'un tentacule d'abord : elle règle direction et longueur d'un
    // seul geste, et elle est testée avant la base parce qu'un tentacule court
    // met les deux poignées à portée l'une de l'autre.
    for (let i = 0; i < doc.fins.length; i++) {
      const f = doc.fins[i];
      if (TYPE(f) !== 'tentacule') continue;
      const a0 = (f.ang != null ? f.ang : 180) * Math.PI / 180;
      const [x, y] = versEcran([f.x + Math.cos(a0) * (f.r || 60), f.y + Math.sin(a0) * (f.r || 60)]);
      if (Math.hypot(sx - x, sy - y) < seuil) return { type: 'boutApp', i };
    }
    for (let i = 0; i < doc.fins.length; i++) {
      const [x, y] = versEcran([doc.fins[i].x, doc.fins[i].y]);
      if (Math.hypot(sx - x, sy - y) < seuil) return { type: 'fin', i };
    }
  }
  if (outil === 'queue') {
    const [x] = versEcran([doc.tailBlend, 0]);
    if (Math.abs(sx - x) < seuil) return { type: 'queue' };
  }
  if (outil === 'points' && doc.shapes[formeSel]) {
    const pts = doc.shapes[formeSel].points;
    for (let i = 0; i < pts.length; i++) {
      const [x, y] = versEcran(pts[i]);
      if (Math.hypot(sx - x, sy - y) < seuil) return { type: 'point', i };
    }
  }
  if (outil === 'forme') {
    const [wx, wy] = versDoc(sx, sy);
    // Le calque ACTIF d'abord : sinon un calque posé par-dessus lui volerait le
    // clic dès qu'on veut déplacer celui qu'on vient de sélectionner.
    if (doc.shapes[formeSel] && dansForme(doc.shapes[formeSel].points, wx, wy))
      return { type: 'forme', i: formeSel, wx, wy };
    for (let i = doc.shapes.length - 1; i >= 0; i--)
      if (dansForme(doc.shapes[i].points, wx, wy)) return { type: 'forme', i, wx, wy };
  }
  return null;
}

// Le point est-il dans le polygone ? (lancer de rayon, pair/impair)
function dansForme(pts, x, y) {
  let dedans = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) dedans = !dedans;
  }
  return dedans;
}

// Point du contour le plus proche du curseur, s'il est à portée : renvoie
// l'indice du segment et la projection, pour y insérer un point.
function segmentPres(sx, sy) {
  const pts = doc.shapes[formeSel].points, n = pts.length;
  let best = null, bestD = 10;                 // 10 px écran
  for (let i = 0; i < n; i++) {
    const [ax, ay] = versEcran(pts[i]), [bx, by] = versEcran(pts[(i + 1) % n]);
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    if (!l2) continue;
    const t = U.clamp(((sx - ax) * dx + (sy - ay) * dy) / l2, 0, 1);
    const px = ax + dx * t, py = ay + dy * t;
    const d = Math.hypot(sx - px, sy - py);
    if (d < bestD) { bestD = d; best = { i, p: versDoc(px, py) }; }
  }
  return best;
}

vue.addEventListener('pointerdown', ev => {
  if (!doc) return;
  const r = vue.getBoundingClientRect();
  const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
  const cible = pres(sx, sy);

  if (cible && cible.type === 'point' && ev.altKey) {
    const pts = doc.shapes[formeSel].points;
    if (pts.length > 3) { instantane(); pts.splice(cible.i, 1); marquer(); }
    return;
  }
  if (cible) {
    instantane();
    attrape = cible; vue.setPointerCapture(ev.pointerId);
    if (cible.type === 'fin' || cible.type === 'boutApp') { finSel = cible.i; panneau(); }
    // Cliquer un calque le SÉLECTIONNE : c'était le seul moyen manquant pour
    // reprendre un dessin existant — il fallait deviner son rang dans la liste.
    if (cible.type === 'forme' && cible.i !== formeSel) { formeSel = cible.i; panneau(); }
    return;
  }

  // Rien sous le curseur : en mode nageoires, on en pose une.
  if (outil === 'nageoires') {
    instantane();
    const [x, y] = versDoc(sx, sy);
    // Rayon déduit de la forme visée (diagonale de sa boîte × 0,75), comme dans
    // l'outil d'ancrages : une valeur fixe est presque toujours à refaire.
    const pts = doc.shapes[formeSel] ? doc.shapes[formeSel].points : null;
    let r = Math.round(doc.naturalW * 0.35);
    if (pts && pts.length) {
      let a = Infinity, b = Infinity, c = -Infinity, e2 = -Infinity;
      for (const q of pts) { a = Math.min(a, q[0]); b = Math.min(b, q[1]); c = Math.max(c, q[0]); e2 = Math.max(e2, q[1]); }
      r = Math.max(10, Math.round(Math.hypot(c - a, e2 - b) * 0.75));
    }
    // Le nouvel appendice entraîne TOUT LE GROUPE du calque actif : si l'artiste
    // a pris la peine d'aplatir une patte en trois pièces, il ne veut pas poser
    // trois ancrages identiques.
    doc.fins.push({ x, y, r, type: 'nageoire', amp: 20, phase: 0, vitesse: 1,
                    calques: groupeDe(formeSel) });
    finSel = doc.fins.length - 1;
    marquer(); panneau();
    return;
  }

  // Mode Dessiner : chaque clic pose un sommet. Un clic sur le PREMIER sommet
  // referme la forme, comme dans tout outil de tracé.
  if (outil === 'dessiner') {
    const [x, y] = versDoc(sx, sy);
    if (trace && trace.length > 2) {
      const [px, py] = versEcran(trace[0]);
      if (Math.hypot(sx - px, sy - py) < 10) { fermerTrace(); return; }
    }
    if (!trace) trace = [];
    trace.push([x, y]);
    panneau(); dessiner();
    return;
  }

  // En mode points, un clic SUR LE CONTOUR insère un point. Sans ça on ne peut
  // que déplacer ou supprimer, et un contour importé trop pauvre à un endroit
  // reste irrécupérable.
  if (outil === 'points' && doc.shapes[formeSel]) {
    const seg = segmentPres(sx, sy);
    if (seg) {
      instantane();
      doc.shapes[formeSel].points.splice(seg.i + 1, 0, seg.p);
      attrape = { type: 'point', i: seg.i + 1 };
      vue.setPointerCapture(ev.pointerId);
      marquer(); panneau();
      return;
    }
    // Ni point ni contour sous le curseur : un clic dans un AUTRE calque le
    // sélectionne, pour retoucher un dessin existant sans passer par la liste.
    const [wx, wy] = versDoc(sx, sy);
    for (let i = doc.shapes.length - 1; i >= 0; i--) {
      if (i !== formeSel && dansForme(doc.shapes[i].points, wx, wy)) {
        formeSel = i; panneau(); dessiner(); return;
      }
    }
  }
  attrape = { type: 'vue', sx, sy, ox: vueT.x, oy: vueT.y };
  vue.setPointerCapture(ev.pointerId);
});

let souris = null;          // position courante, pour l'élastique du tracé
vue.addEventListener('pointermove', ev => {
  if (outil === 'dessiner' && trace) {
    const rr = vue.getBoundingClientRect();
    souris = versDoc(ev.clientX - rr.left, ev.clientY - rr.top);
    dessiner();
  }
  if (!attrape) return;
  const r = vue.getBoundingClientRect();
  const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
  const [x, y] = versDoc(sx, sy);
  const a = attrape;
  if (a.type === 'ancre') { doc.points[a.cle].x = x; doc.points[a.cle].y = y; }
  else if (a.type === 'rayonOeil') {
    const oe = doc.points[a.cle];
    oe.r = Math.max(1, x - oe.x);
  }
  else if (a.type === 'fin') { doc.fins[a.i].x = x; doc.fins[a.i].y = y; }
  else if (a.type === 'boutApp') {
    const f = doc.fins[a.i], dx = x - f.x, dy = y - f.y;
    f.r = Math.max(10, Math.round(Math.hypot(dx, dy)));
    f.ang = Math.round(Math.atan2(dy, dx) * 180 / Math.PI);
  }
  else if (a.type === 'queue') doc.tailBlend = x;
  else if (a.type === 'point') doc.shapes[formeSel].points[a.i] = [x, y];
  else if (a.type === 'forme') {
    const dx = x - a.wx, dy = y - a.wy;
    a.wx = x; a.wy = y;
    transformer(p => [p[0] + dx, p[1] + dy]);
    return;                       // `transformer` a déjà appelé `marquer`
  }
  else if (a.type === 'vue') { vueT.x = a.ox + (sx - a.sx); vueT.y = a.oy + (sy - a.sy); dessiner(); return; }
  marquer();
});

vue.addEventListener('pointerup', () => {
  if (attrape && attrape.type !== 'vue') panneau();
  attrape = null;
});

vue.addEventListener('dblclick', () => { if (outil === 'dessiner') fermerTrace(); });

addEventListener('keydown', ev => {
  if (outil !== 'dessiner' || !trace) return;
  if (ev.key === 'Escape') { trace = null; panneau(); dessiner(); }
