# Le banc d'essai (outils/banc.js) à chaque push : l'aquarium simulé sans
# joueur puis gavé, l'atelier, et les deux versions publiables. Une croix
# rouge ici veut dire qu'une règle du jeu est enfreinte — le détail est dans
# le journal de l'étape « Banc d'essai ».
#
# Playwright n'est installé que pour ce banc : le jeu lui-même reste sans
# dépendance.

name: Banc d'essai

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  banc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Banc d'essai
        run: node outils/banc.js
