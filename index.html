<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐠 Aquarium Vivant</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="depth-gauge"><div id="depth-marker"></div></div>
  <div id="clock">☀️</div>
  <div id="food-bar">
    <button class="food-btn active" data-food="generic" title="Graines standard">🌾</button>
    <button class="food-btn" data-food="plancton_dore" title="Plancton doré">✨</button>
    <button class="food-btn" data-food="micro_crevettes" title="Micro-crevettes">🦐</button>
    <button class="food-btn" data-food="vers_de_sable" title="Vers de sable">🪱</button>
    <button id="info-btn" title="Fiches d'identité au survol">🔍</button>
    <button id="legend-btn" title="Légende des bulles et des expressions">❔</button>
  </div>
  <div id="info"></div>
</div>
<!-- LIEN VERS L'ATELIER DES CRÉATURES.
     Le serveur de dev sert le jeu à la racine : tout aperçu ouvre donc
     l'aquarium, et le seul moyen d'atteindre l'atelier était de taper
     /atelier.html à la main. Le lien n'apparaît qu'en LOCAL — c'est un outil de
     développement, pas une commande de jeu. -->
<a id="atelier-link" href="atelier.html" title="Atelier des créatures" hidden>🎨</a>
<script>
  if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname))
    document.getElementById('atelier-link').hidden = false;
</script>
<script src="js/boot.js"></script>
</body>
</html>
