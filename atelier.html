  else if (ev.key === 'Backspace') { ev.preventDefault(); trace.pop(); panneau(); dessiner(); }
  else if (ev.key === 'Enter') fermerTrace();
});

vue.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = vue.getBoundingClientRect();
  const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
  const [wx, wy] = versDoc(sx, sy);
  vueT.k *= ev.deltaY > 0 ? 0.9 : 1.11;
  vueT.x = sx - wx * vueT.k; vueT.y = sy - wy * vueT.k;
  dessiner();
}, { passive: false });

// ---------------------------------------------------------------------------
// Import
// ---------------------------------------------------------------------------
$('#btnNeuf').onclick = () => {
  if (!espece) return dire('choisis d\'abord une espèce', 'ko');
  debrancher();
  doc = SVGImport.vide(espece);
  doc.espece = espece; doc.nom = espece;
  formeSel = 0; finSel = 0; trace = null; imgFond = null;
  outil = 'dessiner';
  document.querySelectorAll('#barre button[data-outil]').forEach(b =>
    b.classList.toggle('on', b.dataset.outil === 'dessiner'));
  // La planche de l'espèce sert de patron : document vide, elle prend toute la
  // surface de travail et on trace directement dessus.
  const avecPlanche = poserRepere(espece, true);
  marquer(); cadrer(); panneau();
  dire(avecPlanche ? 'document vide, planche en repérage — trace par-dessus'
                   : 'document vide — pose les sommets de ta première forme', 'ok');
};

$('#btnFond').onclick = () => {
  if (!doc) return dire('ouvre ou crée d\'abord un dessin', 'ko');
  $('#fichierFond').click();
};
$('#fichierFond').onchange = ev => {
  const f = ev.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      instantane();
      // La surface de travail prend la taille de l'image : on dessine DANS son
      // repère, pas à côté.
      if (!doc.shapes.length) { doc.naturalW = im.width; doc.naturalH = im.height; }
      chargerFond(fr.result, im.width, im.height);
      marquer(); panneau();
      dire(`${f.name} en calque de repérage (${im.width}×${im.height})`, 'ok');
    };
    im.onerror = () => dire('image illisible', 'ko');
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
  ev.target.value = '';
};

$('#btnSilhouette').onclick = () => {
  if (!espece) return dire('choisis d\'abord une espèce', 'ko');
  try {
    debrancher();
    doc = SVGImport.depuisEspece(espece);
    doc.nom = espece;
    formeSel = 0; finSel = 0;
    if (!doc.fond && aRepere(espece)) poserRepere(espece, true);
    marquer(); cadrer(); panneau();
    dire(`silhouette reprise : ${doc.shapes.length} formes, ${doc.shapes.reduce((n, s) => n + s.points.length, 0)} points`, 'ok');
  } catch (err) { dire('échec : ' + err.message, 'ko'); }
};

let attenteFichier = null;
$('#btnSVG').onclick = () => { attenteFichier = 'svg'; $('#fichier').accept = '.svg'; $('#fichier').click(); };
$('#btnJSON').onclick = () => { attenteFichier = 'json'; $('#fichier').accept = '.json'; $('#fichier').click(); };
$('#fichier').onchange = ev => {
  const f = ev.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    ouvrir(fr.result, f.name.replace(/\.(svg|json)$/i, ''), attenteFichier);
    ev.target.value = '';
  };
  fr.readAsText(f);
};

// Chargement d'un contenu, quelle que soit sa provenance. Exposé sur `window`
// pour que la page soit pilotable depuis la console — c'est ce qui permet de la
// vérifier sans passer par un sélecteur de fichier natif, qu'aucun script ne
// peut ouvrir.
function ouvrir(contenu, nom, type) {
  try {
    debrancher();
    doc = type === 'svg'
      ? SVGImport.depuisSVG(contenu, nom)
      : SVGImport.finaliser(Object.assign(
          typeof contenu === 'string' ? JSON.parse(contenu) : contenu, { nom }));
    doc.espece = espece; doc.nom = nom;
    formeSel = 0; finSel = 0; trace = null;
    if (!doc.fond && aRepere(espece)) poserRepere(espece, true);
    reprendreFond();
    marquer(); cadrer(); panneau();
    dire(`${nom} importé : ${doc.shapes.length} formes, `
       + `${doc.shapes.reduce((n, s) => n + s.points.length, 0)} points`, 'ok');
  } catch (err) { dire('import impossible : ' + err.message, 'ko'); }
}
window.Atelier = { ouvrir, choisir, get doc() { return doc; } };

// ---------------------------------------------------------------------------
// Enregistrement
// ---------------------------------------------------------------------------
function aEnvoyer() {
  const d = JSON.parse(JSON.stringify(doc));
  delete d.espece; delete d.nom;
  // La planche du design ne s'enregistre pas : elle est reposée toute seule à
  // l'ouverture, et elle appartient au dépôt, pas au dessin. Une image importée
  // au disque, elle, reste embarquée — sans elle le document n'est plus repris.
  if (d.fond && d.fond.planche) delete d.fond;
  // Arrondi : un dessin n'a pas besoin de quinze décimales, et le fichier
  // triple de taille pour rien.
  const a = v => Math.round(v * 100) / 100;
  for (const sh of d.shapes) sh.points = sh.points.map(p => [a(p[0]), a(p[1])]);
  for (const c in d.points) {
    const pt = d.points[c];
    pt.x = a(pt.x); pt.y = a(pt.y);
    if (pt.r != null) pt.r = a(pt.r);
    if (pt.ecart != null) pt.ecart = a(pt.ecart);
  }
  for (const f of d.fins) {
    f.x = a(f.x); f.y = a(f.y); f.r = Math.round(f.r);
    if (f.ang != null) f.ang = Math.round(f.ang);
    if (f.phase != null) f.phase = Math.round(f.phase);
    if (f.vitesse != null) f.vitesse = a(f.vitesse);
    if (f.ondes != null) f.ondes = a(f.ondes);
  }
  // `tailBlend` reste enregistré même sans queue : décocher « sans queue » doit
  // rendre le réglage tel qu'il était, pas une valeur par défaut.
  if (d.tailBlend != null) d.tailBlend = a(d.tailBlend);
  return d;
}

function enregistrer() {
  const nom = ($('#nomFichier').value || '').trim();
  if (!/^[A-Za-z0-9_-]{1,64}$/.test(nom)) return dire('nom invalide (lettres, chiffres, - et _)', 'ko');
  dire('enregistrement…');
  fetch('api/sprite/' + encodeURIComponent(nom), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(aEnvoyer()),
  }).then(r => r.json()).then(rep => {
    if (rep.erreur) return dire('refusé : ' + rep.erreur, 'ko');
    doc.nom = nom;
    delete brouillons[espece];
    dire(`écrit dans ${rep.fichier} (${rep.octets} octets)`, 'ok');
    inventaire().then(rail);
  }).catch(e => dire('serveur injoignable — lancer dev_server.py : ' + e, 'ko'));
}

function activer(nom) {
  if (nom !== null && !/^[A-Za-z0-9_-]{1,64}$/.test(nom)) return dire('nom invalide', 'ko');
  const m = Object.assign({}, manifeste);
  if (nom === null) delete m[espece]; else m[espece] = nom;
  fetch('api/manifeste', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(m),
  }).then(r => r.json()).then(rep => {
    if (rep.erreur) return dire('refusé : ' + rep.erreur, 'ko');
    manifeste = m;
    fichierOuvert = null;
    dire(nom === null
      ? `${SPECIES[espece].name} revient à sa silhouette procédurale`
      : `${SPECIES[espece].name} utilise maintenant ${nom}.json — recharge le jeu`, 'ok');
    inventaire().then(() => { rail(); panneau(); });
  }).catch(e => dire('serveur injoignable : ' + e, 'ko'));
}

function dire(m, cls) { const e = $('#etat'); e.textContent = m || ''; e.className = cls || ''; }

// ---------------------------------------------------------------------------
// Outils, boucle, démarrage
// ---------------------------------------------------------------------------
function choisirOutil(nom) {
  outil = nom;
  document.querySelectorAll('#barre button[data-outil]').forEach(x =>
    x.classList.toggle('on', x.dataset.outil === nom));
  panneau(); dessiner();
}
document.querySelectorAll('#barre button[data-outil]').forEach(b =>
  b.addEventListener('click', () => choisirOutil(b.dataset.outil)));

// Raccourcis 1…6, dans l'ordre de la barre. Un outil de dessin où l'on change
// d'outil à la souris fait faire l'aller-retour vingt fois par minute.
const ORDRE = ['ancres', 'nageoires', 'queue', 'forme', 'points', 'dessiner'];
addEventListener('keydown', ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName || ''))) return;
  const i = +ev.key;
  if (i >= 1 && i <= ORDRE.length) { ev.preventDefault(); choisirOutil(ORDRE[i - 1]); }
});

// Une erreur JavaScript ne doit pas se solder par une page qui « ne marche
// pas » sans rien dire : la barre d'état la montre.
addEventListener('error', ev => dire('erreur : ' + (ev.message || ev.error || ''), 'ko'));
addEventListener('unhandledrejection', ev => dire('erreur : ' + (ev.reason || ''), 'ko'));

addEventListener('resize', () => { cadrer(); });

function boucle() { if (anime) { dessiner(); } bandeau(); requestAnimationFrame(boucle); }

// L'index des repères d'abord : le rail affiche une pastille par espèce qui a
// son dessin dans la planche, et `choisir()` la pose aussitôt.
Promise.all([
  fetch('Assets/sprites.json').then(r => (r.ok ? r.json() : {})).catch(() => ({})),
  fetch('Assets/Reperes/index.json').then(r => (r.ok ? r.json() : {})).catch(() => ({})),
])
  .then(([m, rep]) => {
    REPERES = rep || {};
    manifeste = m || {};
    // Les sprites déclarés en dur dans species.js comptent aussi.
    for (const id in SPECIES) if (SPECIES[id].sprite && !(id in manifeste)) manifeste[id] = SPECIES[id].sprite;
    inventaire().then(() => {
      rail(); panneau();
      const premier = Object.keys(manifeste)[0] || Object.keys(SPECIES)[0];
      choisir(premier);
      boucle();
    });
  });
})();
</script>
