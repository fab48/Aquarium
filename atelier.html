<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aquarium — atelier des créatures</title>
<!--
  ATELIER DES CRÉATURES — l'outil unique.

  Il remplace le banc de calibrage et les allers-retours de fichiers à la main.
  Tout s'y fait au même endroit :

    partir de la silhouette du jeu ─┐
    importer un SVG ───────────────┼─▶ ancres · nageoires · queue · formes
    importer un JSON ──────────────┘        │
                                            ▼
                        aperçu avec le VRAI rendu du jeu
                                            │
                                            ▼
                    Assets/<nom>.json  +  Assets/sprites.json
                          (écrits par le serveur de dev)

  Le point important : ce qu'on voit ici est dessiné par `FishBody.draw`, le
  code du jeu, pas par une imitation. Toute divergence serait un bug du jeu, pas
  une surprise à la première mise en eau.

  Se lance avec le serveur de dev : python dev_server.py 8642 → /atelier.html
-->
<style>
  :root {
    color-scheme: light;
    --bord: #c9d8e3; --texte: #16232e; --doux: #5b7186;
    --fond: #eef3f7; --panneau: #fff; --accent: #2d7fd3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; overflow: hidden;
         font: 13.5px/1.5 "Segoe UI", system-ui, sans-serif;
         background: var(--fond); color: var(--texte); }

  /* --- Rail des espèces --- */
  #rail { width: 216px; background: var(--panneau); border-right: 1px solid var(--bord);
          display: flex; flex-direction: column; }
  #rail header { padding: 12px 14px 8px; border-bottom: 1px solid var(--bord); }
  #rail h1 { margin: 0; font-size: 14px; }
  #rail .sous { font-size: 11.5px; color: var(--doux); }
  #liste { flex: 1; overflow-y: auto; padding: 6px; }
  .esp { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 6px;
         cursor: pointer; font-size: 12.5px; }
  .esp:hover { background: #eef5fb; }
  .esp.actif { background: var(--accent); color: #fff; }
  .pastille { width: 8px; height: 8px; border-radius: 50%; background: #cbd8e2; flex: none; }
  .pastille.sprite { background: #35b06a; }
  .pastille.brouillon { background: #f0a92e; }
  .esp .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rubrique { font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
              color: #8ba2b4; padding: 12px 8px 3px; }
  .esp .fic { font-size: 10.5px; color: #8ba2b4; margin-left: auto; padding-left: 6px; }
  .esp.actif .fic { color: rgba(255,255,255,.75); }

  /* --- Scène --- */
  #scene { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #barre { display: flex; gap: 6px; align-items: center; padding: 8px 12px;
           background: var(--panneau); border-bottom: 1px solid var(--bord); flex-wrap: wrap; }
  #plan { flex: 1; position: relative; min-height: 0; }
  #vue { position: absolute; inset: 0; width: 100%; height: 100%; }
  #humeurs { height: 158px; border-top: 1px solid var(--bord); background: var(--panneau);
             display: flex; flex-direction: column; }
  #humeurs canvas { width: 100%; flex: 1; min-height: 0; display: block; }
  #humeursBarre { display: flex; gap: 5px; padding: 5px 10px 0; }
  #humeursBarre button { padding: 2px 8px; font-size: 11.5px; }

  /* --- Panneau --- */
  #panneau { width: 322px; background: var(--panneau); border-left: 1px solid var(--bord);
             overflow-y: auto; padding: 14px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
       color: var(--doux); margin: 20px 0 8px; }
  h2:first-child { margin-top: 0; }
  label { display: block; margin: 10px 0 2px; font-weight: 600; font-size: 12.5px; }
  label .val { float: right; font-weight: 400; color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; }
  input[type=text], input[type=color], select {
    width: 100%; padding: 5px 7px; border: 1px solid var(--bord); border-radius: 5px; font: inherit; }
  input[type=color] { padding: 2px; height: 30px; }
  button { padding: 6px 10px; font: inherit; border: 1px solid var(--bord); border-radius: 6px;
           background: #fff; cursor: pointer; }
  button:hover { background: #f2f7fb; }
  button.plein { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  button.plein:hover { filter: brightness(1.08); }
  button.on { background: #dcecfa; border-color: var(--accent); color: #14507f; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .rangee { display: flex; gap: 6px; margin-top: 8px; }
  .rangee > * { flex: 1; }
  .aide { font-size: 11.5px; color: var(--doux); margin: 6px 0 0; }
  .formes { border: 1px solid var(--bord); border-radius: 6px; overflow: hidden; }
  .forme { display: flex; align-items: center; gap: 7px; padding: 5px 7px; cursor: pointer;
           border-bottom: 1px solid #edf2f6; font-size: 12px; }
  .forme:last-child { border-bottom: 0; }
  .forme.sel { background: #dcecfa; }
  .pastel { width: 15px; height: 15px; border-radius: 3px; border: 1px solid rgba(0,0,0,.18); flex: none; }
  .forme .info { flex: 1; color: var(--doux); }
  #etat { padding: 6px 12px; font-size: 12px; color: var(--doux); background: var(--panneau);
          border-top: 1px solid var(--bord); min-height: 28px; }
  #etat.ok { color: #1c7a45; } #etat.ko { color: #b3261e; }
  .coord { display: grid; grid-template-columns: 56px 1fr 1fr; gap: 4px 5px; align-items: center;
           margin-top: 6px; }
  .coord label { margin: 0; font-size: 11.5px; font-weight: 600; }
  .coord input { padding: 3px 5px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .coord .pt { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
               margin-right: 4px; vertical-align: middle; }
  kbd { background: #eef2f6; border: 1px solid var(--bord); border-bottom-width: 2px;
        border-radius: 4px; padding: 0 4px; font: 11px monospace; }
  .forme input[type=checkbox] { margin: 0; flex: none; }
  .forme .grp { font-size: 10px; background: #e6eef6; color: #14507f; border-radius: 3px;
                padding: 0 4px; flex: none; }
  .calques { border: 1px solid var(--bord); border-radius: 6px; max-height: 132px;
             overflow-y: auto; padding: 3px 5px; }
  .calques label { display: flex; align-items: center; gap: 6px; margin: 2px 0;
                   font-weight: 400; font-size: 12px; cursor: pointer; }
  .calques input { flex: none; margin: 0; }
  .sep { border: 0; border-top: 1px solid var(--bord); margin: 0 4px; height: 18px; align-self: center; }
  #barre .grp2 { display: flex; gap: 4px; }

  /* --- Panneau : l'outil en cours en haut, le reste replié -------------------
     Tout était empilé d'un seul tenant : pour changer la couleur d'un calque il
     fallait passer devant les ancres, la queue, l'échelle et l'enregistrement.
     Chaque section est donc repliable, et se souvient de son état. */
  #titreOutil { display: flex; align-items: center; gap: 8px; margin: 14px 0 2px;
                padding: 7px 9px; border-radius: 7px; background: #eaf3fb;
                border: 1px solid #cfe3f5; }
  #titreOutil .ico { font-size: 17px; line-height: 1; }
  #titreOutil b { font-size: 13px; }
  #titreOutil .quoi { display: block; font-size: 11.5px; color: var(--doux); font-weight: 400; }
  details.bloc { border: 1px solid var(--bord); border-radius: 7px; margin-top: 8px;
                 background: #fbfdff; }
  details.bloc > summary { cursor: pointer; padding: 7px 9px; font-size: 11px;
                           text-transform: uppercase; letter-spacing: .07em; color: var(--doux);
                           font-weight: 600; list-style: none; display: flex; align-items: center; gap: 6px; }
  details.bloc > summary::-webkit-details-marker { display: none; }
  details.bloc > summary::before { content: '▸'; font-size: 10px; transition: transform .12s; }
  details.bloc[open] > summary::before { transform: rotate(90deg); }
  details.bloc > summary .cpt { margin-left: auto; text-transform: none; letter-spacing: 0;
                                font-weight: 400; color: #8ba2b4; font-size: 11px; }
  details.bloc .dedans { padding: 0 9px 10px; }
  details.bloc .dedans h2:first-child { margin-top: 4px; }
  .puce { display: flex; align-items: center; gap: 6px; font-weight: 400; font-size: 12.5px; }
  .puce input { flex: none; width: auto; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: center; }
  .pastilles { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .pastilles input[type=color] { width: 30px; height: 26px; padding: 1px; }
  .pastilles .sup { padding: 2px 5px; font-size: 11px; }
  #filtre { width: 100%; margin-top: 7px; padding: 4px 7px; border: 1px solid var(--bord);
            border-radius: 5px; font: inherit; font-size: 12px; }
  #barre .aideOff { opacity: .55; }
</style>
</head>
<body>

<div id="rail">
  <header>
    <h1>Atelier des créatures</h1>
    <div class="sous"><span id="compte">—</span></div>
    <input id="filtre" type="text" placeholder="filtrer les espèces…" autocomplete="off">
  </header>
  <div id="liste"></div>
</div>

<div id="scene">
  <div id="barre">
    <button id="tOutils" class="on" data-outil="ancres" title="Repères du dessin (1)">📍 Ancres</button>
    <button data-outil="visage" title="Taille, forme et couleurs du visage (2)">🙂 Visage</button>
    <button data-outil="nageoires" title="Nageoires, pattes, tentacules (3)">🖐 Appendices</button>
    <button data-outil="queue" title="Ondulation du corps (4)">〰 Queue</button>
    <button data-outil="forme" title="Déplacer / tourner / colorer un calque (5)">⬛ Calque</button>
    <button data-outil="points" title="Retoucher le contour (6)">◻ Points</button>
    <button data-outil="dessiner" title="Tracer un nouveau calque (7)">✏️ Dessiner</button>
    <button id="bAide" class="on" title="Afficher / masquer les explications du panneau">💡</button>
    <span style="flex:1"></span>
    <button id="btnNeuf">Nouveau dessin</button>
    <button id="btnFond">Image de repérage…</button>
    <button id="btnSilhouette">Partir de la silhouette du jeu</button>
    <button id="btnSVG">Importer un SVG…</button>
    <button id="btnJSON">Importer un JSON…</button>
    <input type="file" id="fichier" hidden>
    <input type="file" id="fichierFond" accept="image/*" hidden>
  </div>
  <div id="plan"><canvas id="vue"></canvas></div>
  <div id="humeurs">
    <div id="humeursBarre">
      <button data-bandeau="cles" class="on">9 humeurs clés</button>
      <button data-bandeau="toutes">les 18</button>
      <button data-bandeau="individus" title="Le même dessin sur six individus : c'est là qu'on juge une couleur tirée au sort">6 individus</button>
    </div>
    <canvas id="cHumeurs"></canvas>
  </div>
  <div id="etat">Choisis une espèce à gauche.</div>
</div>

<div id="panneau"></div>

<script>
// Le jeu n'est pas lancé ici : on ne charge que ce qui dessine, et on bouche
// le reste. Les silhouettes lisent l'heure, la pente du fond et la souris.
window.GAGS = {};
window.Main = { time: 0, nightAmount: () => 0, dayT: () => 0.25, dpr: 1 };
window.World = { slopeAt: () => 0, floorY: () => 99999, planktonAt: () => 1,
                 isUnderwater: () => true, shoreX: 0, depthAt: () => 1000 };
window.Camera = { zoom: 1, x: 0, y: 0, w: 1200, h: 800, vw: 1200, vh: 800,
                  isVisible: () => true, toScreen: (x, y) => [x, y], toWorld: (x, y) => [x, y] };
window.Input = { inWindow: false, mx: 0, my: 0, mouseSpeed: 0 };
window.Particles = new Proxy({}, { get: () => () => {} });
window.Ecosystem = { entities: [], neighbors: () => [], bySpecies: {}, counts: {},
                     colosses: [], chasseurs: [], refugeFloor: () => 0, isNearRefuge: () => false };
window.Food = new Proxy({}, { get: () => () => null });
</script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/species.js"></script>
<script src="js/sprites.js"></script>
<script src="js/fishbody.js"></script>
<script src="js/entity.js"></script>
<script src="js/svgexport.js"></script>
<script src="js/svgimport.js"></script>
<script>
(function () {
'use strict';
const $ = s => document.querySelector(s);
const vue = $('#vue'), ctx = vue.getContext('2d');
const cHum = $('#cHumeurs'), gHum = cHum.getContext('2d');

// ---------------------------------------------------------------------------
// État
// ---------------------------------------------------------------------------
let espece = null;      // id d'espèce sélectionné
let doc = null;         // document en cours d'édition (format sprites.js)
let outil = 'ancres';
let formeSel = 0;
let finSel = 0;
let manifeste = {};     // espèce -> nom de fichier sprite
let fichiers = [];      // tous les dessins présents dans Assets/
const brouillons = {};  // espèce -> doc pas encore enregistré
let fichierOuvert = null;   // dessin libre en cours d'édition, s'il y en a un
let coches = new Set();     // formes cochées, pour les gestes de groupe
let trace = null;           // polygone en cours de tracé (mode Dessiner)
let couleurTrace = '#5b8fb5';
let lisseTrace = true;
let imgFond = null;         // Image() de l'éventuel calque de repérage
let REPERES = {};           // espèce -> { w, h, rang } : la planche découpée
let vueT = { x: 0, y: 0, k: 1 };
let anime = false;
let fantome = false;    // superposition de la silhouette procédurale
let nuit = false;       // force la nuit : sans ça une luminescence est invisible ici
let attrape = null;     // ce que la souris tient en ce moment
let filtreTxt = '';     // filtre du rail — 51 espèces, on ne les parcourt plus à l'œil
// Le bandeau du bas : les humeurs, ou le MÊME dessin sur plusieurs individus.
// C'est le seul endroit où se juge une couleur tirée au sort.
let bandeauMode = 'cles';
// Le panneau montrait tout d'un seul tenant. Chaque section est repliable et se
// souvient de son état — sinon elle se rouvre à chaque re-rendu, c'est-à-dire à
// chaque mouvement de curseur.
let aide = localStorage.getItem('atelier.aide') !== '0';
const ouverts = JSON.parse(localStorage.getItem('atelier.blocs') || '{}');

// `eye2` n'est présente que si l'espèce a deux yeux : la liste effective est
// donc lue depuis le document, pas figée.
const CLE_ANCRES = ['center', 'nose', 'eye', 'eye2', 'mouth', 'tail'];
const COUL = { center: '#0a8f3c', nose: '#8a5ea8', eye: '#e0322f', eye2: '#e0322f',
               mouth: '#1560d8', tail: '#c98a1b' };
function ancres() { return CLE_ANCRES.filter(c => doc && doc.points[c]); }

// --- Groupes de calques -----------------------------------------------------
// « Aplatir » ne fusionne PAS les tracés : un corps et sa rayure n'ont pas la
// même couleur, les souder ferait perdre le dessin. Aplatir, ici, c'est déclarer
// que plusieurs calques n'en font plus qu'un DU POINT DE VUE DE L'ANIMATION et
// des gestes : ils se déplacent ensemble, tournent ensemble, et un seul
// appendice les entraîne tous. C'est ce qu'il faut pour un corps peint en
// quatre couches, et pour une patte dessinée en trois pièces.
function groupeDe(i) {
  const sh = doc && doc.shapes[i];
  if (!sh || !sh.groupe) return [i];
  const l = [];
  doc.shapes.forEach((o, j) => { if (o.groupe === sh.groupe) l.push(j); });
  return l;
}
function nomGroupeLibre() {
  let n = 0;
  for (const sh of doc.shapes) {
    const m = /^G(\d+)$/.exec(sh.groupe || '');
    if (m) n = Math.max(n, +m[1]);
  }
  return 'G' + (n + 1);
}
// Les calques qu'un appendice entraîne. `layerIndex` reste lu : les dessins déjà
// enregistrés (le requin) ne doivent pas changer d'aspect au premier chargement.
function calquesDe(f) {
  if (f.calques && f.calques.length) return f.calques;
  return f.layerIndex != null ? [f.layerIndex] : [];
}
function TYPE(f) { return f.type === 'tentacule' ? 'tentacule' : 'nageoire'; }

// Taille de la bouche en unités du dessin. Tant qu'elle n'a pas été réglée, elle
// suit l'œil — c'est le comportement d'origine, qu'on ne veut pas changer sous
// les pieds d'un dessin déjà calé. `drawFace` place l'œil à 0,22 fois la taille
// du visage et la bouche à ~0,2 : l'équivalence ne dépend donc pas du zoom.
function tailleBouche() {
  if (!doc || !doc.points.mouth) return 0;
  if (doc.points.mouth.r != null) return doc.points.mouth.r;
  return (doc.points.eye.r || 10) * 0.2 / 0.22;
}

// Boîte du dessin, ou la surface de travail s'il est encore vide.
function boiteDoc() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const sh of doc.shapes) for (const q of sh.points) {
    if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0];
    if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1];
  }
  if (!isFinite(x0)) { x0 = 0; y0 = 0; x1 = doc.naturalW || 420; y1 = doc.naturalH || 260; }
  return { x0, y0, L: Math.max(1, x1 - x0), H: Math.max(1, y1 - y0) };
}

// GABARITS d'ancrage. Les valeurs par défaut supposent un poisson vu de profil :
// museau à droite, bouche tout devant, queue qui bat. Sur un crabe c'était faux
// sur les trois points à la fois — bouche posée sur une pince, un seul œil, et
// un tiers de la carapace qui ondulait. Trois boutons plutôt que six réglages.
function gabarit(genre) {
  if (!doc) return;
  instantane();
  const { x0, y0, L, H } = boiteDoc();
  const p = doc.points;
  const rO = p.eye.r, rB = p.mouth.r;
  p.center = { x: x0 + L * 0.5, y: y0 + H * 0.5 };
  p.nose = { x: x0 + L, y: y0 + H * 0.5 };
  p.tail = { x: x0, y: y0 + H * 0.5 };
  delete p.eye2;
  if (genre === 'profil') {
    p.eye = { x: x0 + L * 0.78, y: y0 + H * 0.38, r: rO };
    p.mouth = { x: x0 + L * 0.90, y: y0 + H * 0.58, r: rB };
    delete doc.sansQueue;
  } else {
    // Vu de face ou de dessus : deux yeux écartés, et la bouche AU MILIEU —
    // c'est le cas du crabe, de l'étoile, du coquillage, du poulpe.
    p.eye = { x: x0 + L * 0.62, y: y0 + H * 0.34, r: rO, ecart: Math.round(L * 0.24) };
    p.mouth = { x: x0 + L * 0.50, y: y0 + H * 0.54, r: rB };
    if (genre === 'rampant') doc.sansQueue = true; else delete doc.sansQueue;
  }
  marquer(); panneau();
  dire(genre === 'profil' ? 'gabarit poisson : un œil, bouche au museau, queue active'
     : genre === 'face' ? 'gabarit vu de face : deux yeux, bouche au milieu'
     : 'gabarit rampant : deux yeux, bouche au milieu, pas de queue', 'ok');
}

// ---------------------------------------------------------------------------
// Rail des espèces
// ---------------------------------------------------------------------------
// Le rail listait les 51 espèces dans l'ordre de `SPECIES`, ce qui ne dit rien
// de l'état d'avancement : on cherchait « celles qu'il reste à faire » à l'œil,
// une par une. Il les RANGE désormais par état, et un filtre coupe la liste dès
// qu'on sait ce qu'on cherche.
//
// La rubrique « sans dessin de référence » est la plus utile des cinq : c'est
// la liste, tenue à jour toute seule, des espèces qui n'ont encore rien —
// ni dessin actif, ni brouillon, ni vignette dans la planche du design.
function rail() {
  const l = $('#liste');
  l.innerHTML = '';
  let nSprite = 0;
  const titre = (txt, n) => {
    const d = document.createElement('div');
    d.className = 'rubrique'; d.textContent = n != null ? `${txt} · ${n}` : txt;
    l.appendChild(d);
  };
  const f = filtreTxt.trim().toLowerCase();
  const passe = id => !f || id.includes(f) || SPECIES[id].name.toLowerCase().includes(f)
                    || (SPECIES[id].realName || '').toLowerCase().includes(f);

  const groupes = { actif: [], brouillon: [], planche: [], rien: [] };
  for (const id of Object.keys(SPECIES)) {
    if (manifeste[id]) nSprite++;
    if (!passe(id)) continue;
    if (manifeste[id]) groupes.actif.push(id);
    else if (brouillons[id]) groupes.brouillon.push(id);
    else if (aRepere(id)) groupes.planche.push(id);
    else groupes.rien.push(id);
  }

  const ligne = (id) => {
    const d = document.createElement('div');
    d.className = 'esp' + (id === espece && !fichierOuvert ? ' actif' : '');
    const aSprite = !!manifeste[id];
    d.innerHTML = `<span class="pastille ${brouillons[id] ? 'brouillon' : (aSprite ? 'sprite' : '')}"></span>`
                + `<span class="nom">${SPECIES[id].name}</span>`
                + (aRepere(id) ? `<span class="fic" title="dessin de référence">🎨</span>` : '')
                + (aSprite ? `<span class="fic">${manifeste[id]}</span>` : '');
    d.title = (aSprite ? `dessin : ${manifeste[id]}.json` : 'silhouette procédurale')
            + (aRepere(id) ? ' · planche du design disponible' : ' · aucun dessin de référence');
    d.onclick = () => { fichierOuvert = null; choisir(id); };
    l.appendChild(d);
  };
  const rubrique = (cle, txt) => {
    if (!groupes[cle].length) return;
    titre(txt, groupes[cle].length);
    groupes[cle].forEach(ligne);
  };
  rubrique('actif', 'Dessin actif dans le jeu');
  rubrique('brouillon', 'Brouillons non enregistrés');
  rubrique('planche', 'Planche du design disponible');
  rubrique('rien', 'Sans dessin de référence');

  // Tout dessin présent dans Assets/ mais rattaché à aucune espèce. Sans cette
  // rubrique, un fichier enregistré puis désactivé devenait introuvable : il
  // existait sur le disque et nulle part dans l'outil.
  const rattaches = new Set(Object.values(manifeste));
  const libres = fichiers.filter(x => !rattaches.has(x) && (!f || x.toLowerCase().includes(f)));
  if (libres.length) {
    titre('Dessins non rattachés', libres.length);
    for (const x of libres) {
      const d = document.createElement('div');
      d.className = 'esp' + (x === fichierOuvert ? ' actif' : '');
      d.innerHTML = `<span class="pastille brouillon"></span><span class="nom">${x}</span>`;
      d.title = `Assets/${x}.json — pas encore rattaché à une espèce`;
      d.onclick = () => ouvrirFichier(x);
      l.appendChild(d);
    }
  }

  $('#compte').textContent =
    `${Object.keys(SPECIES).length} espèces · ${nSprite} dessin${nSprite > 1 ? 's' : ''} actif${nSprite > 1 ? 's' : ''} · `
    + `${Object.keys(REPERES).length} planches · `
    + `${fichiers.length} fichier${fichiers.length > 1 ? 's' : ''} dans Assets/`;
}

// Ouvre un dessin libre, en le rattachant provisoirement à l'espèce courante
// (il faut bien un `size` pour le mettre à l'échelle).
function ouvrirFichier(f) {
  fichierOuvert = f;
  // Un dessin libre a quand même besoin d'une espèce : c'est elle qui donne le
  // `size` qui met le dessin à l'échelle. Si le nom du fichier est celui d'une
  // espèce, on la prend — sinon `crabe.json` s'affichait à la taille du requin.
  if (SPECIES[f]) espece = f;
  dire('chargement de ' + f + '…');
  fetch(`Assets/${f}.json`).then(r => r.json())
    .then(d => {
      doc = SVGImport.finaliser(Object.assign({}, d, { espece, nom: f }));
      formeSel = 0; finSel = 0;
      cadrer(); panneau(); rail();
      dire(`${f}.json ouvert — rattache-le à une espèce avec « Activer dans le jeu »`, 'ok');
    })
    .catch(e => dire('illisible : ' + e, 'ko'));
}

// --- Calque de repérage ------------------------------------------------------
// Une image posée SOUS le dessin, à opacité réglable, pour redessiner par-dessus
// un rendu généré ailleurs. Elle est embarquée dans le document (comme le
// `sourceRaw` de l'outil d'ancrages) : le fichier reste autonome, on peut
// reprendre le travail sans avoir à retrouver l'image d'origine.
//
// Deux provenances, un seul objet `doc.fond` :
//   `data` — une image choisie au disque, EMBARQUÉE dans le document ;
//   `src`  — une image du dépôt (la planche découpée, ci-dessous), référencée
//            par son chemin. 30 vignettes embarquées, ce serait 1 Mo de base64
//            recopié dans les documents ; le chemin ne coûte rien et suit les
//            mises à jour de la planche.
// `x`, `y` et `k` la placent dans le repère du DESSIN : une vignette de 155 px
// n'est jamais à l'échelle d'un document de 410, il faut pouvoir la caler.
function chargerFond(dataURL, w, h) {
  doc.fond = Object.assign({ x: 0, y: 0, k: 1, opacite: 0.45 }, doc.fond || {},
                           { data: dataURL, src: null, w, h });
  imgFond = new Image();
  imgFond.onload = () => { cadrer(); };
  imgFond.src = dataURL;
}
function reprendreFond() {
  imgFond = null;
  // Sans document ouvert, on montre quand même la planche de l'espèce : c'est
  // ce qu'on regarde avant de décider de dessiner.
  const src = (doc && doc.fond) ? (doc.fond.data || doc.fond.src)
            : (aRepere(espece) ? `Assets/Reperes/${espece}.png` : null);
  if (!src) return;
  imgFond = new Image();
  imgFond.onload = () => dessiner();
  imgFond.src = src;
}

// --- La planche des 30 créatures ---------------------------------------------
// `Assets/Reperes/<espèce>.png` : le dessin de référence, détouré, une image par
// espèce. L'index dit qui en a une — sans lui il faudrait sonder 51 URL au
// chargement pour afficher une pastille dans le rail.
function aRepere(id) { return !!REPERES[id]; }

// Cale la vignette sur le dessin en cours : même largeur, même centre. C'est le
// seul placement qui serve à quelque chose — on redessine PAR-DESSUS.
function ajusterFond() {
  if (!doc || !doc.fond) return;
  const b = bornesDoc();
  if (!b) { doc.fond.x = 0; doc.fond.y = 0; doc.fond.k = 1; return; }
  doc.fond.k = (b.x1 - b.x0) / doc.fond.w;
  doc.fond.x = b.x0;
  doc.fond.y = (b.y0 + b.y1) / 2 - doc.fond.h * doc.fond.k / 2;
}

// Boîte du dessin, en unités du document. `bornes()` travaille sur le sprite
// préparé par le jeu, qui n'existe que quand il y a des formes.
function bornesDoc() {
  if (!doc || !doc.shapes.length) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const s of doc.shapes) for (const p of s.points) {
    if (p[0] < x0) x0 = p[0];
    if (p[0] > x1) x1 = p[0];
    if (p[1] < y0) y0 = p[1];
    if (p[1] > y1) y1 = p[1];
  }
  return isFinite(x0) ? { x0, y0, x1, y1 } : null;
}

function poserRepere(id, silencieux) {
  const r = REPERES[id];
  if (!doc || !r) return false;
  doc.fond = { src: `Assets/Reperes/${id}.png`, w: r.w, h: r.h,
               x: 0, y: 0, k: 1, planche: id,
               opacite: doc.fond ? doc.fond.opacite : 0.45 };
  // Document vide : la surface de travail prend la taille de la vignette, on
  // dessine DANS son repère. Document existant : on cale la vignette dessus.
  if (!doc.shapes.length) { doc.naturalW = r.w; doc.naturalH = r.h; }
  else ajusterFond();
  reprendreFond();
  if (!silencieux) dire(`planche posée en repérage (${r.w}×${r.h})`, 'ok');
  return true;
}

function inventaire() {
  return fetch('api/sprites').then(r => r.json())
    .then(r => { fichiers = r.sprites || []; })
    .catch(() => { fichiers = Object.values(manifeste); });
}

function choisir(id) {
  espece = id;
  const nom = manifeste[id];
  if (brouillons[id]) { doc = brouillons[id]; apres(); }
  else if (nom) {
    dire('chargement de ' + nom + '…');
    fetch(`Assets/${nom}.json`).then(r => r.json())
      .then(d => { doc = SVGImport.finaliser(Object.assign({}, d, { espece: id, nom })); apres(); })
      .catch(e => { doc = null; apres(); dire('illisible : ' + e, 'ko'); });
  } else { doc = null; apres(); }
  rail();
}

function apres() {
  trace = null; coches.clear();
  // La planche se pose TOUTE SEULE : c'est le dessin de référence de l'espèce,
  // on ne travaille jamais sans. Elle ne remplace pas une image déjà choisie.
  if (doc && !doc.fond && aRepere(espece)) poserRepere(espece, true);
  reprendreFond(); cadrer(); panneau(); rail();
  dire(doc ? '' : 'Aucun dessin : importe-en un, ou pars de la silhouette du jeu.');
}

// ---------------------------------------------------------------------------
// Vue : le dessin est rendu par le VRAI code du jeu
// ---------------------------------------------------------------------------
function defEspece() { return SPECIES[espece] || SPECIES.requin; }

// `ind` : le numéro d'individu du bandeau. Deux individus d'une même espèce ne
// partagent ni identifiant ni couleur — c'est ce qui rend visible une couleur
// tirée au sort, invisible tant qu'on ne regarde qu'un seul poisson.
function poser(expr, t, ind = 0) {
  const def = defEspece();
  const e = new Entity(espece || 'requin', 0, 0);
  e.id = 1000 + ind * 7;
  e.stage = 'adult'; e.growth = 1; e.gabarit = 1; e.age = e.maxAge * 0.5;
  e.expression = expr || 'idle'; e._held = true; e.exprTimer = 9; e.emoteDur = 9;
  e._facing = 1; e._flipX = 1; e._tilt = 0; e._chew = 0; e._sable = 0;
  e.speedNow = def.speed; e.phase = 0;
  e._color = def.colors[ind % def.colors.length];
  e.stealth = 0; e.strikeT = 0; e._repli = 0;
  return e;
}

// Le document en cours est injecté dans le cache de `Sprites` sous une clé
// dédiée : le rendu passe alors exactement par le même chemin qu'en jeu,
// préparation comprise.
function brancher() {
  if (!doc) return null;
  const cle = '__atelier__';
  // La palette du visage est mise en cache par `FishBody` sur l'objet source :
  // en jeu elle ne change jamais (elle sort d'un JSON), ici on la modifie au
  // curseur. Sans cette purge, changer la couleur d'une pupille n'aurait aucun
  // effet à l'écran — l'objet est muté, sa version fusionnée reste en cache.
  if (doc.visage) FishBody._palCache.delete(doc.visage);
  Sprites.cache[cle] = Sprites.preparer(doc);
  defEspece().sprite = cle;
  return Sprites.cache[cle];
}
function debrancher() { const d = defEspece(); if (d.sprite === '__atelier__') delete d.sprite; }

// Même règle que `FishBody.drawSprite` : l'échelle déclarée si elle existe,
// sinon la règle du poisson allongé. Dupliquée ici parce que l'atelier doit
// convertir les coordonnées du DESSIN en coordonnées écran pour ses poignées.
function echelleRendu(sp, def) {
  const ajust = sp.spriteScale || def.spriteScale || 1;
  return (sp.echelle && sp.tailleJeu)
    ? sp.echelle * (def.size / sp.tailleJeu) * ajust
    : (def.size * 2.5 * ajust) / sp.w;
}

function bornes(sp) {
  let y0 = Infinity, y1 = -Infinity;
  for (const sh of sp.shapes) for (const p of sh.points) {
    if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
  }
  return { x0: sp.minX, x1: sp.minX + sp.w, y0, y1 };
}

function cadrer() {
  const sp = brancher();
  if (!sp) { debrancher(); dessiner(); return; }
  const b = bornes(sp);
  const W = vue.clientWidth, H = vue.clientHeight;
  // Document encore vide : on cadre la SURFACE DE TRAVAIL, sinon il n'y a rien
  // à cadrer et le zoom part à l'infini.
  if (!doc.shapes.length) {
    const k0 = Math.min(W / ((doc.naturalW || 420) * 1.15), H / ((doc.naturalH || 260) * 1.2));
    vueT.k = k0;
    vueT.x = W / 2 - (doc.naturalW || 420) / 2 * k0;
    vueT.y = H / 2 - (doc.naturalH || 260) / 2 * k0;
    debrancher(); dessiner(); return;
  }
  const k = Math.min(W / (sp.w * 1.25), H / Math.max(1, (b.y1 - b.y0) * 1.35));
  vueT.k = k;
  vueT.x = W / 2 - (b.x0 + sp.w / 2) * k;
  vueT.y = H / 2 - (b.y0 + (b.y1 - b.y0) / 2) * k;
  debrancher();
  dessiner();
}

const versEcran = p => [p[0] * vueT.k + vueT.x, p[1] * vueT.k + vueT.y];

// Le calque de repérage. Il se pose SOUS le dessin pour redessiner par-dessus,
// et AU-DESSUS pour comparer : sur une espèce reprise de sa silhouette, le
// corps opaque recouvre entièrement la référence et on ne compare plus rien.
function tracerFond() {
  if (!doc || !doc.fond || !imgFond || !imgFond.complete) return;
  ctx.save();
  ctx.globalAlpha = doc.fond.opacite;
  const k = doc.fond.k || 1;
  const [x, y] = versEcran([doc.fond.x || 0, doc.fond.y || 0]);
  const lw = doc.fond.w * k * vueT.k, lh = doc.fond.h * k * vueT.k;
  // Les planches sont déjà retournées vers la droite à la découpe ; ce miroir
  // sert aux créatures vues de face, dont le sens ne veut rien dire, et aux
  // images importées d'ailleurs.
  if (doc.fond.miroir) { ctx.translate(x + lw, y); ctx.scale(-1, 1); ctx.drawImage(imgFond, 0, 0, lw, lh); }
  else ctx.drawImage(imgFond, x, y, lw, lh);
  ctx.restore();
}
const versDoc = (sx, sy) => [(sx - vueT.x) / vueT.k, (sy - vueT.y) / vueT.k];

function dessiner() {
  const W = vue.clientWidth, H = vue.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  if (vue.width !== W * dpr || vue.height !== H * dpr) { vue.width = W * dpr; vue.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#dfeaf2'; ctx.fillRect(0, 0, W, H);

  if (!doc) {
    // Pas de dessin, mais une planche : autant la montrer. C'est elle qu'on
    // vient regarder avant de cliquer sur « Nouveau dessin ».
    let bas = H / 2;
    if (imgFond && imgFond.complete && aRepere(espece)) {
      const r = REPERES[espece];
      const k = Math.min(W * 0.55 / r.w, H * 0.62 / r.h);
      ctx.save(); ctx.globalAlpha = 0.85;
      ctx.drawImage(imgFond, W / 2 - r.w * k / 2, H / 2 - r.h * k / 2 - 14,
                    r.w * k, r.h * k);
      ctx.restore();
      bas = H / 2 + r.h * k / 2 + 8;
    }
    ctx.fillStyle = '#8ba2b4'; ctx.font = '15px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(espece ? 'Pas encore de dessin pour cette espèce.' : 'Choisis une espèce à gauche.', W / 2, bas);
    ctx.textAlign = 'left';
    return;
  }

  // Calque de repérage, sous le dessin — ou par-dessus, voir `dessus`.
  if (!(doc.fond && doc.fond.dessus)) tracerFond();

  const sp = brancher();
  const def = defEspece();
  // Échelle : `FishBody.draw` travaille en unités de jeu autour de l'origine,
  // il faut donc défaire sa mise à l'échelle pour retrouver les coordonnées du
  // dessin, sur lesquelles portent les poignées.
  const kJeu = echelleRendu(sp, def);
  const t = anime ? performance.now() / 1000 : 1.2;
  Main.time = t;

  // Fantôme : la silhouette procédurale que ce dessin remplace, en gris, calée
  // sur la MÊME origine. C'est la seule façon de juger d'un coup d'œil si un
  // dessin importé est à la bonne taille — la règle de repli du jeu suppose un
  // poisson allongé et se trompe sur tout ce qui est vertical.
  if (fantome) {
    debrancher();
    ctx.save();
    ctx.globalAlpha = 0.3;
    ctx.translate(sp.cx * vueT.k + vueT.x, sp.cy * vueT.k + vueT.y);
    ctx.scale(vueT.k / kJeu, vueT.k / kJeu);
    try { FishBody.draw(ctx, poser('idle', t), t); } catch (err) { /* ignore */ }
    ctx.restore();
    brancher();
  }

  ctx.save();
  ctx.translate(sp.cx * vueT.k + vueT.x, sp.cy * vueT.k + vueT.y);
  ctx.scale(vueT.k / kJeu, vueT.k / kJeu);
  try { FishBody.draw(ctx, poser('idle', t), t); } catch (err) { /* dessin incomplet */ }
  ctx.restore();

  if (doc.fond && doc.fond.dessus) tracerFond();
  debrancher();

  poignees(sp);

  // Polygone en cours de tracé : les sommets posés, le segment vers le curseur,
  // et le retour à la fermeture. Sans le retour on ne voit pas la forme venir.
  if (trace && trace.length) {
    ctx.strokeStyle = couleurTrace; ctx.lineWidth = 2;
    ctx.fillStyle = couleurTrace + '55';
    ctx.beginPath();
    trace.forEach((p, i) => { const [x, y] = versEcran(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    if (souris) { const [x, y] = versEcran(souris); ctx.lineTo(x, y); }
    ctx.stroke();
    if (trace.length > 1) {
      ctx.save(); ctx.globalAlpha = 0.5; ctx.beginPath();
      trace.forEach((p, i) => { const [x, y] = versEcran(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.closePath(); ctx.fill(); ctx.restore();
      ctx.setLineDash([4, 4]);
      const [ax, ay] = versEcran(trace[trace.length - 1]), [bx, by] = versEcran(trace[0]);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.fillStyle = '#fff'; ctx.strokeStyle = couleurTrace;
    for (const p of trace) {
      const [x, y] = versEcran(p);
      ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }
}

function poignees(sp) {
  const R = 6;
  // Ligne de queue — masquée quand la créature n'en a pas : la montrer laissait
  // croire qu'un réglage restait actif.
  if (doc.tailBlend != null && !doc.sansQueue) {
    const [x] = versEcran([doc.tailBlend, 0]);
    ctx.strokeStyle = outil === 'queue' ? '#c98a1b' : 'rgba(201,138,27,.45)';
    ctx.lineWidth = outil === 'queue' ? 2 : 1;
    ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, vue.clientHeight); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#c98a1b'; ctx.font = '11px system-ui';
    ctx.fillText('queue ←', x - 52, 14);
  }

  // Appendices. Deux dessins, parce que ce sont deux gestes différents :
  //  · nageoire  → un DISQUE, le rayon d'influence de la rotation ;
  //  · tentacule → une FLÈCHE, l'axe le long duquel l'onde court.
  // Montrer un disque pour un tentacule laissait croire à une rotation.
  (doc.fins || []).forEach((f, i) => {
    const vif = outil === 'nageoires' && i === finSel;
    // Le second tracé, en symétrique, est en pointillés : on doit voir OÙ il
    // tombe, c'est tout l'intérêt de l'option.
    const axes = f.miroir ? [[f.x, 1, false], [2 * doc.points.center.x - f.x, -1, true]]
                          : [[f.x, 1, false]];
    for (const [fx, sens, image] of axes) {
      const [x, y] = versEcran([fx, f.y]);
      const r = (f.r || 60) * vueT.k;
      ctx.strokeStyle = vif ? 'rgba(45,127,211,.9)' : 'rgba(45,127,211,.35)';
      ctx.lineWidth = vif ? 2 : 1;
      if (image) ctx.setLineDash([6, 5]);
      if (TYPE(f) === 'tentacule') {
        const a0 = (f.ang != null ? f.ang : 180) * Math.PI / 180;
        const ax = Math.cos(a0) * sens, ay = Math.sin(a0);
        const bx = x + ax * r, by = y + ay * r;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(bx, by); ctx.stroke();
        // L'amplitude se voit : l'enveloppe que le bout parcourt.
        const amp = (f.amp != null ? f.amp : 15) / 100 * r;
        ctx.beginPath();
        ctx.moveTo(bx - ay * amp, by + ax * amp);
        ctx.lineTo(bx + ay * amp, by - ax * amp);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = image ? '#9fc0dd' : (vif ? '#1560d8' : '#7ea6cc');
        ctx.beginPath(); ctx.arc(bx, by, vif ? 5.5 : 4, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(45,127,211,.07)';
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.fillStyle = image ? '#9fc0dd' : (vif ? '#1560d8' : '#7ea6cc');
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
    }
  });

  // Contour du calque actif — et de tout son groupe, puisqu'un geste les prend
  // tous. Dans tous les outils qui travaillent SUR un calque : sans repère
  // permanent on ne sait pas sur lequel on agit. Pas dans « Ancres », où on
  // regarde un visage et où le pointillé ne fait que gêner.
  if (doc.shapes[formeSel] && outil !== 'ancres' && outil !== 'visage' && outil !== 'dessiner') {
    const lot = groupeDe(formeSel);
    ctx.setLineDash([6, 4]);
    for (const j of lot) {
      const actif = j === formeSel;
      ctx.strokeStyle = actif ? '#1560d8' : 'rgba(21,96,216,.4)';
      ctx.lineWidth = actif ? 2 : 1.2;
      ctx.beginPath();
      doc.shapes[j].points.forEach((p, i) => {
        const [x, y] = versEcran(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      ctx.closePath(); ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // Points de la forme sélectionnée
  if (outil === 'points' && doc.shapes[formeSel]) {
    const pts = doc.shapes[formeSel].points;
    ctx.strokeStyle = 'rgba(20,80,127,.5)'; ctx.lineWidth = 1;
    ctx.beginPath();
    pts.forEach((p, i) => { const [x, y] = versEcran(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#14507f';
    for (const p of pts) {
      const [x, y] = versEcran(p);
      ctx.beginPath(); ctx.rect(x - 3, y - 3, 6, 6); ctx.fill(); ctx.stroke();
    }
  }

  // Ancres
  for (const cle of ancres()) {
    const a = doc.points[cle]; if (!a) continue;
    const [x, y] = versEcran([a.x, a.y]);
    // L'outil Visage travaille sur les mêmes deux ancres : leurs cercles de
    // taille doivent y rester saisissables, sinon on règle un œil à l'aveugle.
    const vif = outil === 'ancres' || (outil === 'visage' && (cle.startsWith('eye') || cle === 'mouth'));
    // Cercle de taille : l'œil, et la bouche. La bouche n'a pas toujours de `r`
    // enregistré — on montre alors la valeur qu'elle suit.
    const rayon = cle === 'mouth' ? tailleBouche() : a.r;
    if ((cle.startsWith('eye') || cle === 'mouth') && rayon) {
      const teinte = cle === 'mouth' ? '21,96,216' : '224,50,47';
      ctx.strokeStyle = `rgba(${teinte},${vif ? 0.85 : 0.3})`;
      ctx.lineWidth = vif ? 2 : 1;
      ctx.beginPath(); ctx.arc(x, y, rayon * vueT.k, 0, Math.PI * 2); ctx.stroke();
      if (vif) {   // poignée de rayon, à droite du cercle
        ctx.fillStyle = COUL[cle];
        ctx.beginPath(); ctx.arc(x + rayon * vueT.k, y, 4.5, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.strokeStyle = COUL[cle]; ctx.lineWidth = vif ? 2 : 1.2;
    ctx.beginPath();
    ctx.moveTo(x - R, y); ctx.lineTo(x + R, y);
    ctx.moveTo(x, y - R); ctx.lineTo(x, y + R);
    ctx.stroke();
    if (vif) { ctx.fillStyle = COUL[cle]; ctx.font = '11px system-ui'; ctx.fillText(cle, x + 9, y - 5); }
  }
}

// --- Bandeau du bas ---------------------------------------------------------
// Une calibration juste doit tenir sur TOUTES les expressions. Il n'en montrait
// que 7 sur les 18 de `FishBody.EMOTIONS` : on réglait donc un visage sur sept
// cas et le jeu en jouait dix-huit. La plus gênante des absentes était `eating`,
// celle qui ouvre la bouche en grand — donc celle qui met le plus à l'épreuve
// l'ancre de bouche et son rayon, le réglage le plus délicat de l'atelier.
//
// Trois modes : les neuf humeurs clés, les dix-huit, et le même dessin sur six
// INDIVIDUS — le seul endroit où se juge une couleur tirée au sort.
const HUMEURS_CLES = ['idle', 'happy', 'eating', 'angry', 'sleeping', 'scared',
                      'surprise', 'kiss', 'disgust'];
const HUMEURS_TOUTES = Object.keys(FishBody.EMOTIONS);
function bandeau() {
  const W = cHum.clientWidth, H = cHum.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  if (cHum.width !== W * dpr || cHum.height !== H * dpr) { cHum.width = W * dpr; cHum.height = H * dpr; }
  gHum.setTransform(dpr, 0, 0, dpr, 0, 0);
  gHum.clearRect(0, 0, W, H);
  if (!doc) return;
  const sp = brancher(); const def = defEspece();
  const b = bornes(sp);
  const kJeu = echelleRendu(sp, def);
  const t = anime ? performance.now() / 1000 : 1.2;
  const cases = bandeauMode === 'individus'
    ? [0, 1, 2, 3, 4, 5].map(i => ({ ex: 'idle', ind: i, txt: 'n° ' + (i + 1) }))
    : (bandeauMode === 'toutes' ? HUMEURS_TOUTES : HUMEURS_CLES).map(ex => ({ ex, ind: 0, txt: ex }));
  // Au-delà de neuf vignettes, une seule rangée les rend minuscules : on passe
  // à deux, chacune à la moitié de la hauteur.
  const lignes = cases.length > 9 ? 2 : 1;
  const parLigne = Math.ceil(cases.length / lignes);
  const pas = W / parLigne, hLigne = H / lignes;
  const k = Math.min((pas - 14) / (sp.w * kJeu), (hLigne - 26) / Math.max(1, (b.y1 - b.y0) * kJeu));
  cases.forEach((c, i) => {
    const li = Math.floor(i / parLigne), co = i % parLigne;
    const cx = pas * (co + 0.5), cy = hLigne * li + hLigne / 2 + 7;
    gHum.save();
    gHum.translate(cx, cy);
    gHum.scale(k, k);
    // Un individu différent = un identifiant différent : c'est lui, et lui
    // seul, qui décide de la couleur tirée au sort.
    try { FishBody.draw(gHum, poser(c.ex, t, c.ind), t); } catch (err) { /* ignore */ }
    gHum.restore();
    gHum.fillStyle = '#5b7186'; gHum.font = '11px system-ui'; gHum.textAlign = 'center';
    gHum.fillText(c.txt, cx, hLigne * li + 13);
  });
  gHum.textAlign = 'left';
  debrancher();
}

// Panneau contextuel

// Il montrait TOUT, tout le temps, d'un seul tenant : pour changer la couleur
// d'un calque il fallait défiler devant les ancres, la queue, l'échelle et
// l'enregistrement, et rien ne disait sur quoi l'outil courant agissait.
//
// Trois règles depuis :
//  1. le haut du panneau appartient à l'OUTIL sélectionné, et il est annoncé ;
//  2. tout le reste est en sections REPLIABLES qui se souviennent de leur état
//     (`ouverts`), donc un réglage rangé une fois reste rangé ;
//  3. les explications sont un CALQUE (bouton 💡) : elles occupaient les deux
//     tiers de la colonne, ce qui est bien la première fois et jamais après.
const OUTILS = {

  visage:    { ico: '🙂', nom: 'Visage',     quoi: 'Taille, forme de bouche et couleurs du visage commun.' },
  nageoires: { ico: '🖐', nom: 'Appendices', quoi: 'Nageoires, pattes, antennes, bras.' },
  queue:     { ico: '〰', nom: 'Queue',      quoi: 'Ce qui ondule, et à partir d\'où.' },

  points:    { ico: '◻', nom: 'Points',      quoi: 'Retoucher le contour, point par point.' },

// Une explication ne s'affiche que si l'aide est allumée.
const A = h => (aide ? `<p class="aide">${h}</p>` : '');

// Une section repliable, dont l'état est retenu d'un rendu à l'autre.
function bloc(cle, titre, contenu, parDefaut, compte) {
  const o = ouverts[cle] != null ? ouverts[cle] : !!parDefaut;
  return `<details class="bloc" data-bloc="${cle}"${o ? ' open' : ''}>
    <summary>${titre}${compte ? `<span class="cpt">${compte}</span>` : ''}</summary>
    <div class="dedans">${contenu}</div></details>`;
}

// Amplitude effective d'un appendice : la sienne, ou à défaut celle du premier
// calque qu'il entraîne (le comportement d'avant, pour les dessins déjà calés).
function ampDe(f) {
  if (f.amp != null) return f.amp;
  const i = calquesDe(f)[0];
  return (doc.shapes[i] && doc.shapes[i].amp) || 15;
}
// Liste de cases à cocher « quelles formes » — le même bloc sert aux appendices
// et à la queue.
function listeCalques(attr, choisies) {
  const s = new Set(choisies);
  return `<div class="calques">` + doc.shapes.map((sh, i) =>
    `<label><input type="checkbox" data-${attr}="${i}" ${s.has(i) ? 'checked' : ''}>` +
    `<span class="pastel" style="background:${sh.fill || sh.stroke || '#888'}"></span>` +
    `forme ${i + 1}${sh.groupe ? ' · ' + sh.groupe : ''}</label>`).join('') + `</div>`;
}
